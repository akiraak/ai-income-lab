text = ["SPY 日足（分割調整済み・配当未調整 ＝ 価格リターン）。1994-11-21〜2026-09-08 の 8,000 本・窓 7,921 個。増えていく窓で、テストは 2016-09 から 2 年 × 5 塊・検証はその直前 2 年（checkpoint を選ぶだけ）。5 fold × 種 3 ＝ 15 fit（config/scenario/cgan_spy.toml。ハイパーパラメータ・分割・採用基準は事前固定）。"]

[model.detail.how]
text = [
  "条件 ＝ 直前 60 営業日 × 6 列（ail/scenario/data.py:28-59）: ret_1 ／ vol_rel20 ＝ log 出来高 − log（前日までの 20 日平均出来高）／ rv_5 ・rv_20 ＝ 直近の r² の平均の平方根 ／ cum_5 ・cum_20 ＝ 直近の r の和。欠損は埋めず窓ごと落とす。",
  "生成器: GRU(6 → 64, 1 層) の最後の状態 ＋ z(16) → Linear(80 → 64)・LeakyReLU 0.2・Linear(64 → 5)。Critic: 別の重みの GRU ＋ Y(5) → 64 → 64 → 1。GP は同じ X の下で Y だけを補間。Adam 1e-4・β (0.5, 0.9)・n_critic 5・λ 10・batch 256・最大 200 epoch。5 epoch ごとに検証 CRPS（200 本）を測り、8 回続けて良くならなければ止める（ail/scenario/model.py）。",
  "採点 ＝ 5 日目の累積単純リターン exp(Σr) − 1 の CRPS（低いほどよい。metrics.py）。",
]

[model.detail.score]
text = ["【実測】CRPS（2,512 起点）: cGAN 0.01210（種ごと 0.01215 ／ 0.01199 ／ 0.01216）／ 履歴ベース 0.01195 ／ 軽量モデル 0.01146（cgan-scenario.md §4-2）。負けの大半は f2（0.01637・80% 区間の被覆 0.587 ＝ §4-3）。生成物の尖度 0.15（実測 8.79）・|r| の自己相関 0.03（実測 0.26）。区間の幅は起点でほとんど変わらない（§4-4・§4-5）。"]

[model.detail.result]
text = [
  "事前登録の 5 条件（§4-1）: (a) 履歴ベースとの差 d の平均が負・95% 区間が 0 より下 → ＋0.000151（−0.000013〜＋0.000334）× ／ (b) d が負の塊が 4 以上 → 3 × ／ (c) 種 3 つとも d が負 → 3 つとも正 × ／ (d) 被覆率が帯の中・崩壊の印なし → 80% 0.773 は帯内・95% 0.893 は帯外 × ／ (e) 軽量モデル以下 → 0.01210 ＞ 0.01146 ×。",
  "runs/2026-09-19T09-35-41_scn_cgan_spy: 15 fit で 753 秒（1 fit 39〜59 秒・70〜95 epoch で停止・採った checkpoint は 30〜55 epoch）。台帳の n_trials には入れず、試した構成は記録の §0-3 に数える。保存した重みからの再現差は最大 9.8e-17（§5-1）。",
