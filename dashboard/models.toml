  "エンコーダ 3 層: 頭 4・D = 16・F = 128・dropout 0.3・BatchNorm・残差注意。平らにして 112 → 1 の線形の頭。パラメータ 16,676。Adam lr 1e-4・type3 の減衰・MSE・batch 128・100 epoch・patience 100。選定期間の MSE 最小の epoch を採る。種 0・cuda（patchtst.py:197-302）。",
]

