[[model]]
id = "seq-quant"
name = "trade_ownseq_ridge_a"
method = "T3 QUANT（60日窓）"
formal = ["T3 QUANT（60日窓）", "Ridge"]
label = "過去 60 日の線の形を読む型"
summary = "過去 60 日の値段の動きを 1 本の線として見て、その形から出力スコアを計算する。数字を 1 つずつ見るのではなく、線を区切って形そのものを読む。"
card = { sees = "過去 60 日の値段の道すじ", decides = "線を区切って、区間ごとに値を読む" }
traits = [
  { text = "試し運転（64 日のシミュレーション）では、初日に見る株の全部を買い、最後の日も全部を持っていた。", why = "64 日のあいだの売りは、買いの 4 分の 1 ほどだった。買う線がまん中にあり、出力スコアがまん中より少し上に出る日が多かったためと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "過去のデータで試すと、1 回に持ち続けた日数はまちまちだった。まん中は 7 日で、1 日で手放すことも 2 割ほどあった。", why = "短く手放す山と、1 年近く持ち続ける山の 2 つに分かれた。", basis = "trial" },
  { text = "「じわじわ上がってきた」「急に落ちてから戻した」といった線の形を、数字に直して読む。", why = "線を長い区間から短い区間まで区切り、区間ごとに値を読む作りのため。", basis = "build" },
  { text = "線の形から数百個の数字を作るので、過去のたまたまの形を覚えこみやすい。", why = "見る数字が多いほど、たまたま当たった形を拾いやすい。", basis = "build" },
  { text = "株どうしをくらべて選ぶことはしない。", why = "どの株の出力スコアも、その株自身の過去だけから出るため。", basis = "build" },
