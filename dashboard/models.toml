[[model]]
id = "ownex-lgbm"
name = "trade_ownex_lgbm_a"
method = "全部使う（基準）"
formal = ["LightGBM"]
label = "世の中の数字も入れて、枝分かれで決める型"
summary = "会社の株だけに出力スコアをつける。値動きに加えて、ほかの株とくらべた位置や、為替・金利・天気・地震も見て、「もし〜なら」の枝分かれをたくさん重ねて出力スコアを計算する。"
card = { sees = "値動き ＋ ほかの株 ＋ 為替・金利など", decides = "「もし〜なら」の枝分かれを重ねる" }
traits = [
  { text = "同じ日のどの株にも、ほとんど同じ出力スコアをつける。", why = "過去のデータで試すと、ほとんどの日（96%）で、その日の最高の出力スコアを何本もの株が分け合っていた。試し運転の 64 日でも、多くの日で全部の株がまったく同じ値だった。為替や金利は全部の株で同じ値なので、出力スコアが「どの株か」より「どんな日か」で決まってしまうためと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "そのため、見る株を全部いっぺんに買うか、1 本も買わないかになりやすい。何日も 1 本も買わなくても、故障ではない。", why = "どの株の出力スコアもほぼ同じなので、買う線を上回るときは全部が上回り、届かないときは全部が届かない。", basis = "trial" },
  { text = "足し算では表せない組み合わせ（金利が上がっていて、かつ値動きが荒いときだけ、など）も拾える。そのぶん、過去のたまたまを覚えこみやすい。", why = "枝分かれを重ねる作りのため。", basis = "build" },
  { text = "株の外の数字（為替・金利・天気・地震）のどれかが 8 日より古くなると、その日は出力スコアをつけない。", why = "これらの数字は発表が遅れることがある。古すぎる数字では出力スコアを計算しない決まりにしてある。", basis = "build" },
  { text = "学んだ見こみと出力スコアの向きが、逆になる期間がある。", why = "0〜100 に直す式を、取り分けた日で当たった向きに合わせるため。過去のデータの 5 つの期間のうち 2 つ、試し運転の 64 日のうち 4 分の 3 の日でそうなった。", basis = "trial" },
]
sees = [
  { label = "その株の値動き", items = ["上がり下がり・荒さ・いまの位置・売買された量・値動きの形（35 個の数字）"] },
  { label = "ほかの株とのくらべ", items = ["今日の上がり方や荒さは全体の中で何番目か", "全体のうち何割が上がったか"] },
  { label = "市場とのくらべ", items = ["市場全体やその業種が動いたぶんを引いた、その株だけの動き"] },
  { label = "為替と金利", items = ["ユーロに対するドル・円・ポンドなど 7 つの通貨の値段", "アメリカの金利（1 か月ものから 30 年ものまでの 7 つ）"] },
  { label = "天気と地震", items = ["アメリカの 3 つの町（ニューヨーク・ロサンゼルス・シカゴ）の最高・最低気温、雨の量", "世界の大きめの地震（マグニチュード 5 以上）の回数と、いちばん大きい揺れ"] },
]
sees_note = "株の外の数字は、値そのものではなく「前の日からの動き」と「ここ 20 日の中での位置」にして、1 日以上前に発表されたものだけを使う（今日まだ知り得ない数字を使わないため）。天気と地震は、効くはずのない数字として試しに入れてある（効いて見えたら、たまたまを疑う目印）。株の詰め合わせ商品（ETF）には出力スコアをつけない（くらべる材料には使う）。"
how = "「もしこの数字がこれより大きく、あの数字がこれより小さければ…」という枝分かれの木を、1 本ずつ足していく。あとの木は、前の木までで外れたぶんを埋めるように学ぶ。木ごとの答えを足して生の見こみにし、0〜100 の出力スコアに直す。"
flow = [
  { t = "値動き ＋ ほかの株 ＋ 世の中の数字", s = "為替・金利・天気・地震も（124 個）" },
  { t = "枝分かれをたどる", s = "「もし〜なら」の木を何百本も" },
  { t = "木ごとの答えを足す", s = "明日の上がり下がりの見こみ" },
  { t = "0〜100 の出力スコアに直す", kind = "out" },
]
axes = { data = "124 個の数字 ＝ その株の値動き 35 ＋ ほかの株とのくらべ 26 ＋ 市場や業種とのくらべ 13 ＋ 株の外の数字 50（為替・金利・天気・地震の 25 本それぞれの、前の日からの動きと、ここ 20 日の中での位置）。出力スコアをつけるのは会社の株だけ。2018 年から 2026 年まで。", prep = "数字の大きさをそろえる（学ぶ期間のデータだけで決める）。株の外の数字は 1 日ずらし、8 日より古い値は使わない。", calc = "枝分かれの木を、最大 500 本まで 1 本ずつ足していく。学ぶ期間の終わりの 1 割で当たり方を見て、30 本続けて良くならなければ止める。", target = "次の日の終わりの値段までに、どれだけ上がり下がりするか。", scope = "会社の株の全部をまとめて 1 つのモデルを学ぶ。過去の試しでは、過去を 6 つに分け、残りの 5 つで順に答え合わせ。実際の売買では、毎日、答えがわかっている日（前の前の日）までのデータで学び直す。" }
walk = { lead = "本物は 124 個の数字と何百本もの木を使うが、ここでは小さな木 2 本で、枝分かれ → 足す → 0〜100 に直す までを追う。", steps = [
  { t = "1 本目の木", text = "「10 年ものの金利が、前の日より上がったか」→ はい →「その株の日々のぶれは大きいか」→ いいえ → この枝の先の答えは ＋0.0004。" },
  { t = "2 本目の木", text = "「その株の今日の上がり方は、全体の中で上のほうか」→ いいえ → 答えは −0.0001。この木は、1 本目で外れたぶんを埋めるように学んである。" },
  { t = "足す", text = "0.0004 − 0.0001 ＝ 0.0003。これが生の答えで、「明日 0.03% くらい上がりそう」という意味。" },
  { t = "0〜100 に直す", text = "足し合わせる型と同じ式（取り分けた日で決めた傾きとずらし）で、0〜100 の出力スコアに直す。" },
  { t = "同じ日のほかの株", text = "金利の動きはどの株でも同じなので、1 本目の木の最初の分かれ道は、どの株も同じ枝に進む。木が株の外の数字ばかりで分かれていると、どの株も同じ枝の先にたどり着き、同じ出力スコアになる。" },
], note = "最後の段は見立て（どの数字で分かれていたかは、まだ測っていない）。確かめてあるのは、多くの日で全部の株が同じ出力スコアだったこと。" }
score = { items = [
  { text = "出力スコアは、まん中の近くのせまい範囲に出た。試し運転の 64 日では、低いほうの端が 44.50、高いほうの端が 57.72 だった。", why = "1 日の中での株どうしの幅は、ならすと 0（全部同じ値）だった。", basis = "trial" },
  { text = "買う線がまん中より上にあると、線に届く日がほとんど無い。", why = "試し運転の 64 日で届いたのは 1 日だけで、その日は全部の株がいっぺんに届いた。実際の売買の準備で 2026-09-18 の出力スコアを出したときは、全部の株が 44〜46 に並び、1 本も届かなかった。", basis = "trial" },
  { text = "出力スコアが「上がりそう」を言い当てる力は、でたらめより少しだけ良かった。", why = "学ぶ期間の終わりに取り分けた日で測った当たり方は、コインを投げるのより少し上。ただし期間によっては、でたらめを下回った。", basis = "trial" },
], read = ["出力スコアは、株のちがいより、その日がどんな日かで決まっている。株を選ぶ手がかりとしては読まない。", "何日も 1 本も買わない日が続いても、故障ではない。ある日に全部の株をいっぺんに買うことがある。"] }
limits = [
  "株を選んでいるように見えて、実際には「今日は買う日か、買わない日か」しか決めていない（試し運転で見えたこと）。",
  "実際の売買では、出力スコアが 1 本でも出せない日は注文の仕組みそのものを起こさない決まりなので、株の外の数字が古くなった日は、その日の売り買いの全部が止まる。",
]
result = { verdict = "hold", text = "買う線を 3 通り試した。1 通りだけ、平均ではただ持ち続けるを上回ったが、期間によって勝ち負けが割れた（保留）。残りの 2 通りは下回った。", why = "上回ったぶんは、たまたまと区別がつかない大きさ。株の外の数字の不具合を直す前は、保留になる買う線が別のもの（まん中）だった ＝ 買う線ごとの印が入れかわるほど、差は小さい。同じ入力で回し直すと、数字は 1 桁も違わず同じだった。" }
history = [
  { when = "2026-09-10", what = "買う線 3 通り", drop = 3, old = true, note = "0〜100 に直す計算が止まっていて、ほとんどの期間で、ただ持ち続けると同じになった。" },
  { when = "2026-09-13", what = "同じ 3 通りを、計算を直したあとに回し直した", hold = 1, drop = 2, aside = "株の外の数字の不具合を直す前の試し。いまの印には数えない", note = "保留は買う線がまん中の形。" },
  { when = "2026-09-17", what = "株の外の数字の不具合を 2 つ直して、同じ 3 通りを回し直した", hold = 1, drop = 2, note = "保留は買う線がまん中より少し上の形に入れかわった。2 回回して、数字は 1 桁も違わなかった。" },
  { when = "2026-09-19", what = "出力スコアの高い順に、持つ株の数をしぼる決まりで試した", hold = 13, drop = 2, aside = "ちがう売り買いの決まりでの試し。いまの印には数えない", note = "どの株も同じ出力スコアの日がほとんどで、順番を試したことになっていない。" },
]
records = ["docs/specs/experiments/threshold-trading.md", "docs/specs/experiments/calibration-rerun.md", "docs/specs/experiments/daily-data-sources.md", "docs/specs/experiments/topk-holdings.md", "docs/specs/experiments/live-trading.md"]

