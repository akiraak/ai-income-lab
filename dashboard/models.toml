]

[model.detail.how]
text = [
  "窓 ＝ own_seq60_r0..r59（60 日分の対数リターン。ail/features/seq.py:32-36）を古い順に並べて累積し、最後の値を引いた道筋（点 j ＝ log c[i−59+j] − log c[i]）。窓ごとの z 正規化はしない（tsc.py:36-50）。",
  "4 つの表現（aeon の _quant.py:109-114）: 道筋そのもの（長さ 60・120 区間・191 列）／ 1 次差分を 5 点で均したもの（59・120・191）／ 2 次差分（58・120・191）／ FFT の振幅（31・57・80）。計 653 列（fitted と一致）。",
  "区間の規則（_quant.py:131-161）: 段 n ＝ 1, 2, 4, …（最大 min(6, floor(log2 L)+1) 段）・境目は linspace(0, L, n+1) の切り捨て・n>1 なら ceil(L/n/2) ずらした組を足す。1 区間の分位の数 q ＝ 1 + (長さ−1)//4。q ≥ 2 なら等間隔の分位で、奇数番の添字からは区間の平均を引く。小さな例の [3,1,4,1,5,9,2,6] → 丸ごとの区間は [1.0, 5.125]（コードから計算）。",
  "変換の fit（訓練だけ）→ StandardScaler（訓練で fit）→ Ridge → Platt 較正（訓練の尻 10%・隙間 max(64, n//200) 行。ail/models/holdout.py:23-37・calibrate.py:42-95）。",
  "入出力の形（実売買）: 入力 1 行 ＝ 1 銘柄 × 1 営業日。表は 95 列（own 35 ＋ own_seq60_r0..r59）だが使うのは 60 日の道筋だけ → QUANT 653 列 → StandardScaler → Ridge。訓練 ＝ 2018-01-31〜asof の 2 営業日前（asof 2026-09-22 で 136,529 行【実測】）・毎日 fit し直す。出力 ＝ predict.jsonl に 63 銘柄 × 1 行（buy ／ exit ＝ 0〜100・小数 6 桁）。項目の一覧はしくみのページ「実際の売買で使う」の「モデルに入るものと出てくるもの」と live-trading.md §0-9 (f)。",
]

