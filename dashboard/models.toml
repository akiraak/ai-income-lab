# 予測モデルの言葉の正本（docs/specs/dashboard.md §17）。
#
# ⚠ **モデルの解説を書くのはここだけ**。vibeboard の「予測モデル」タブ（modelview.py）と「トレーダー」タブ（traderview.py）の
#    両方がここから写す。⚠ 人の側の言葉（呼び名・いつ・いくら・買う線の文）は traders.toml。
# ⚠ **ほかのモデルとくらべる文を書かない**（「モデルの中でいちばん」「〜より多い」など。モデルは増えたり減ったりする）。
#    1 つのモデルだけを読んで分かる文にする。⚠ 「ただ持ち続ける」とくらべるのは良い（それが試しのものさし）。
# ⚠ **どこまで確かかを必ず付ける**（特性の `basis`）: build ＝ 作りから言えること（コードと設定を読めば分かる）／
#    trial ＝ 試し運転で見えたこと（シミュレーションと過去のデータでの試し。本番で同じとは限らない）／ guess ＝ 見立て（確かめていない）。
#    ⚠ 確かめていない理由を言い切らない（「〜と見られる（理由は確かめていない）」）。
# ⚠ **説明を Python や HTML に書かない**（用語タブの glossary.toml と同じ考え方）。文を直すならこのファイルだけ。
# ⚠ **やさしい言葉で書く**: 本文では専門用語を使わない（使わない語の一覧は tests/test_traders_tab.py の FORBIDDEN。
#    dashboard.md §16-2 の表）。用語を書いてよいのは `id`・`name`・`method`・`formal`・`configs`・`records` だけ（画面の「正式な名前」の段に出る）。
# ⚠ **実売買の設定の数字（予算・買う線・見る株の本数）を書かない**。⚠ 売買結果（損益・注文・約定・持ち高）は書かない・出さない。
# ⚠ **`result`（過去のデータで試した結果）は人が記録から写したもの**。台帳を作り直しても自動では変わらない。
#    印は adopt ＝ 採る ／ hold ＝ 保留 ／ drop ＝ 落とす。いくつもの形で試したモデルは、いちばん良かった形の印を付け、内訳を文に書く。
#    ⚠ 1 万分の 1 単位の成績などの細かい数字は書かない（記録と検証タブにある）。`records` は記録の文書（リポジトリ直下からの道）。
# ⚠ **1 項目は 1〜2 行まで**。理由は `why`（小さい字で下に出る）に分ける。
#
# モデルを足す ＝ `[[model]]` を 1 つ書く（コードは触らない）。`id` はページの鍵（英数と `-`。⚠ 一度付けたら変えない ＝ リンクが切れる）。
# `name`・`method` は実売買の設定（experiments/live-trading/config/traders/）の [[models]] と同じ綴り ＝ これが合う人が居れば
# 「いま使っている」の束に出る。`configs` は experiments/feature-discovery/config/ からの道（省けば experiment/<name>.toml）。
# `stocks = false` ＝ 会社の株で試していないモデル（「消えた会社が入っていない」の注意を出さない）。
# `flow` ＝ 「システム説明」タブ（system.toml の `models = true` の段）に出す型ごとの図の箱（`t` 見出し・`s` 小さい字・`kind = "out"`）。やさしい言葉で・12 個以内。

[common]
show_result = true        # false にすると「過去のデータで試した結果」の段と、一覧の印を出さない
list_title = "予測モデルの一覧"
list_lead = "このプロジェクトで作った予測モデルを、型ごとに 1 枚ずつ並べた。札を押すと、そのモデルのページが開く。"
group_live = "いま使っている"
group_desk = "机上で試した"
card_sees = "見るもの"
card_decides = "決め方"
open_page = "このモデルのページを開く"
used_by = "このモデルを使う人"
used_by_none = "いま、このモデルを実際の売買で使う人は居ない。過去のデータで試しただけ。"
unsettled_mark = "未確定"
basis_build = "作りから"
basis_trial = "試し運転で見えた"
basis_guess = "見立て"
basis_note = "印の意味 — 作りから: コードと設定を読めば分かること ／ 試し運転で見えた: シミュレーションや過去のデータで試したときに見えたこと。本番で同じになるとは限らない ／ 見立て: まだ確かめていない考え。"
no_words = "このモデルの説明はまだ書かれていません（dashboard/models.toml に足す）。"
result_adopt = "採る"
result_hold = "保留"
result_drop = "落とす"
result_none = "過去のデータで試した結果は、まだ書かれていません。"
result_note = "印の意味（出力スコアに買う線を引いて売り買いする試しの場合）— 採る: 過去のデータを 5 つの期間に分けて試し、どの期間でも「何もせずただ持ち続ける」を上回った ／ 保留: 平均では上回ったが、期間によって勝ち負けが割れた（たまたまと区別がつかない）／ 落とす: 平均で上回らなかった。いくつもの形で試したモデルは、いちばん良かった形の印を出している。"
result_caution = "これは過去のデータでの試しの結論で、実際の売買の結果ではない。試した数が多いので、良く見えた形があっても、たまたまの可能性が高い。"
records_label = "くわしい記録"
limit_survivor = "試しに使った株は、いま大きい会社から選んである。過去に消えた会社が入っていないので、過去のデータでの成績は実力より良く見える。"
limit_costs = "試しでは、その日の終わりの値段で必ず買えて売れることにしている。実際の売買では、そのとおりの値段で買えるとは限らない。"

# ---------------------------------------------------------------- いま実売買の設定に出てくるモデル
# `name`（と `method`）は実売買の設定の [[models]] と同じ綴り。

[[model]]
id = "own-ridge"
name = "trade_own_ridge_a"
method = "全部使う（基準）"
formal = ["Ridge"]
label = "値動きの数字を足し合わせる型"
summary = "その株自身の最近の値動きを表す 35 個の数字に、重みをかけて足し合わせて出力スコアを計算する。ほかの株も、世の中の数字も見ない。"
card = { sees = "その株の値動きだけ", decides = "数字に重みをかけて足す" }
traits = [
  { text = "買う線がまん中にあると、売り買いの回数が多くなりやすい。", why = "出力スコアがまん中のすぐ近くに集まり、少しの値動きで線をまたぐためと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "「この数字が大きいほど上がりやすい」という、まっすぐな関係しか使えない。", why = "足し算で出力スコアを計算する作りのため。数字どうしの組み合わせ（両方そろったときだけ、など）は拾えない。", basis = "build" },
  { text = "株どうしをくらべて選ぶことはしない。", why = "どの株の出力スコアも、その株自身の過去だけから出るため。", basis = "build" },
]
sees = [
  { label = "上がり下がり", items = ["ここ 1 日〜60 日でどれだけ上がり下がりしたか"] },
  { label = "荒さ", items = ["日々のぶれの大きさ", "1 日の高値と安値の幅"] },
  { label = "いまの位置", items = ["最近の平均とくらべて高いか低いか", "最近の高値と安値の幅の中でどのあたりか"] },
  { label = "売買された量", items = ["ふだんとくらべて多いか少ないか"] },
  { label = "値動きの形", items = ["上と下のどちらに偏っているか", "極端な日が多いか", "前の日の動きを引きずるか"] },
  { label = "その日の足と暦", items = ["始まりと終わりの値の差、上下のひげ", "曜日"] },
]
how = "見ている 35 個の数字それぞれに重みをかけて足し合わせ、1 つの出力スコアにする。重みは過去から学ぶ。"
flow = [
  { t = "その株の値動き", s = "35 個の数字" },
  { t = "重みをかけて足す", s = "重みは過去から学ぶ" },
  { t = "生の答え", s = "明日の上がり下がりの見こみ" },
  { t = "0〜100 の出力スコアに直す", kind = "out" },
]
limits = []
result = { verdict = "drop", text = "買う線を 3 通り試した。どれも、ただ持ち続けるより悪かった。", why = "それでも実際の売買で使うのは、成績ではなく型（作り）のちがいで選んだため。出力スコアを 0〜100 に直す計算に不具合があった頃の試しでは 1 通りだけ「保留」だったが、直したあとの計算で試し直すと「落とす」になった。" }
records = ["docs/specs/experiments/threshold-trading.md", "docs/specs/experiments/live-trading.md"]

[[model]]
id = "ownex-lgbm"
name = "trade_ownex_lgbm_a"
method = "全部使う（基準）"
formal = ["LightGBM"]
label = "世の中の数字も入れて、枝分かれで決める型"
summary = "会社の株だけに出力スコアをつける。値動きに加えて、ほかの株とくらべた位置や、為替・金利・天気・地震も見て、「もし〜なら」の枝分かれをたくさん重ねて出力スコアを計算する。"
card = { sees = "値動き ＋ ほかの株 ＋ 為替・金利など", decides = "「もし〜なら」の枝分かれを重ねる" }
traits = [
  { text = "同じ日のどの株にも、ほとんど同じ出力スコアをつける。", why = "過去のデータで試すと、ほとんどの日でそうなった。為替や金利は全部の株で同じ値なので、出力スコアが「どの株か」より「どんな日か」で決まってしまうためと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "そのため、見る株を全部いっぺんに買うか、1 本も買わないかになりやすい。何日も 1 本も買わなくても、故障ではない。", why = "どの株の出力スコアもほぼ同じなので、買う線を上回るときは全部が上回り、届かないときは全部が届かない。", basis = "trial" },
  { text = "足し算では表せない組み合わせ（金利が上がっていて、かつ値動きが荒いときだけ、など）も拾える。そのぶん、過去のたまたまを覚えこみやすい。", why = "枝分かれを重ねる作りのため。", basis = "build" },
  { text = "天気や地震の数字が 8 日より古くなると、その日は出力スコアがつけられず何もしない。", why = "これらの数字は発表が 3〜4 日遅れる。古すぎる数字では出力スコアを計算しない決まりにしてある。", basis = "build" },
]
sees = [
  { label = "その株の値動き", items = ["上がり下がり・荒さ・いまの位置・売買された量・値動きの形（35 個の数字）"] },
  { label = "ほかの株とのくらべ", items = ["今日の上がり方は全体の中で何番目か", "全体のうち何割が上がったか"] },
  { label = "市場とのくらべ", items = ["市場全体やその業種が動いたぶんを引いた、その株だけの動き"] },
  { label = "為替と金利", items = ["ユーロに対するドル・円・ポンドなど 7 つの通貨の値段", "アメリカの金利（1 か月ものから 30 年ものまで）"] },
  { label = "天気と地震", items = ["最高・最低気温、雨の量", "地震の回数と、いちばん大きい揺れ"] },
]
sees_note = "株の外の数字は、1 日以上前に発表されたものだけを使う（今日まだ知り得ない数字を使わないため）。株の詰め合わせ商品（ETF）には出力スコアをつけない。"
how = "「もしこの数字がこれより大きく、あの数字がこれより小さければ…」という枝分かれを、たくさん重ねて出力スコアを計算する。"
flow = [
  { t = "値動き ＋ ほかの株 ＋ 世の中の数字", s = "為替・金利・天気・地震も" },
  { t = "枝分かれをたどる", s = "「もし〜なら」の木を何百本も" },
  { t = "木ごとの答えを足す", s = "明日の上がり下がりの見こみ" },
  { t = "0〜100 の出力スコアに直す", kind = "out" },
]
limits = [
  "株を選んでいるように見えて、実際には「今日は買う日か、買わない日か」しか決めていない（試し運転で見えたこと）。",
]
result = { verdict = "hold", text = "買う線を 3 通り試した。1 通りだけ、平均ではただ持ち続けるを上回ったが、期間によって勝ち負けが割れた（保留）。残りの 2 通りは下回った。", why = "同じ設定で回し直すたびに、成績が大きくぶれた。上回ったぶんは、そのぶれより小さい。" }
records = ["docs/specs/experiments/threshold-trading.md", "docs/specs/experiments/topk-holdings.md", "docs/specs/experiments/live-trading.md"]

[[model]]
id = "seq-quant"
name = "trade_ownseq_ridge_a"
method = "T3 QUANT（60日窓）"
formal = ["T3 QUANT（60日窓）", "Ridge"]
label = "過去 60 日の線の形を読む型"
summary = "過去 60 日の値動きを 1 本の線として見て、その形から出力スコアを計算する。数字を 1 つずつ見るのではなく、線の形そのものを読む。"
card = { sees = "過去 60 日の値動きの線", decides = "線を区切って、高い・低いを測る" }
traits = [
  { text = "出力スコアが日ごとに急には動きにくく、いちど買うと持ち続ける株が多くなりやすい。", why = "60 日の線は 1 日たっても 1 つずれるだけで、形がほとんど変わらないためと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "「じわじわ上がってきた」「急に落ちてから戻した」といった線の形を、数字に直して読む。", why = "線を区切って測る作りのため。", basis = "build" },
  { text = "線の形から数百個の数字を作るので、過去のたまたまの形を覚えこみやすい。", why = "見る数字が多いほど、たまたま当たった形を拾いやすい。", basis = "build" },
  { text = "株どうしをくらべて選ぶことはしない。", why = "どの株の出力スコアも、その株自身の過去だけから出るため。", basis = "build" },
]
sees = [
  { label = "過去 60 日の線", items = ["毎日の上がり下がりを 60 日ぶん並べたもの（60 個の数字が 1 本の線になる）"] },
]
how = "60 日の線を、長い区間から短い区間までいくつにも区切る。区切ったそれぞれで「高いほうの値・低いほうの値はどのくらいか」を測り、数百個の数字にする。その数字に重みをかけて足し合わせ、1 つの出力スコアにする。"
flow = [
  { t = "過去 60 日の線", s = "毎日の上がり下がりを並べる" },
  { t = "線を区切る", s = "長い区間から短い区間まで" },
  { t = "区間ごとに測る", s = "高いほう・低いほうの値 → 数百個の数字" },
  { t = "重みをかけて足す", s = "重みは過去から学ぶ" },
  { t = "0〜100 の出力スコアに直す", kind = "out" },
]
limits = []
result = { verdict = "hold", text = "買う線を 3 通り試した。1 通りだけ、平均ではただ持ち続けるを上回ったが、期間によって勝ち負けが割れた（保留）。残りの 2 通りは下回った。", why = "保留の中身を見ると、5 つの期間のうち 4 つは「ずっと全部持つ」か「ずっと全部休む」で、平均を押し上げたのは 1 つの期間だけだった。当てた証拠としては読まない。" }
records = ["docs/specs/experiments/tsc-threshold.md", "docs/specs/experiments/live-trading.md"]

# ---------------------------------------------------------------- 机上で試したモデル

[[model]]
id = "mlp"
formal = ["MLP"]
configs = ["experiment/trade_own_mlp_a.toml", "experiment/trade_ownex_mlp_a.toml"]
label = "数字を何段もまぜ合わせる型"
summary = "見ている数字を、小さな計算のつぶを並べた層に 2 回通してまぜ合わせ、出力スコアを計算する。どの数字とどの数字を組み合わせるかは、過去から自分で学ぶ。"
card = { sees = "その株の値動き（ほかの株や為替・金利を足した形も試した）", decides = "小さな計算のつぶの層に通して、まぜ合わせる" }
traits = [
  { text = "足し算では表せない組み合わせも拾える。そのぶん、過去のたまたまを覚えこみやすい。", why = "数字を何段もまぜ合わせる作りのため。", basis = "build" },
  { text = "覚えこみすぎる前に、学ぶのをやめる。", why = "学びに使わない日を少し取り分けておき、そこでの当たり方が良くならなくなったら止める決まり。", basis = "build" },
  { text = "学びはじめの状態を乱数で決めるので、乱数の種を変えると答えが少し変わる。", why = "種を決めておけば同じ答えになる。試しでは種を決めてある。", basis = "build" },
  { text = "なぜその出力スコアになったのかを、人が読み取りにくい。", why = "重みが何千個もあり、1 つずつの意味を言えないため。", basis = "build" },
]
sees = [
  { label = "その株の値動き", items = ["上がり下がり・荒さ・いまの位置・売買された量・値動きの形（35 個の数字）"] },
  { label = "足した形も試した", items = ["ほかの株とくらべた位置、市場とのくらべ、為替・金利・天気・地震"] },
]
how = "見ている数字を、まず 64 個の計算のつぶの層に、つぎに 32 個の層に通す。つぶ 1 個は「入ってきた数字に重みをかけて足し、0 より小さければ 0 にする」だけの小さな計算で、これを重ねると入り組んだ関係を表せる。最後に 1 つの数にまとめ、0〜100 の出力スコアに直す。"
limits = []
result = { verdict = "drop", text = "その株の値動きだけを見る形と、ほかの株や為替・金利も見る形の両方で、買う線を 3 通り・線の引き方を 2 通り試した。どの形でも、ただ持ち続けるより悪かった。", why = "" }
records = ["docs/specs/experiments/mlp-threshold-trading.md", "docs/specs/experiments/gpu-models.md"]

[[model]]
id = "gan-augment"
formal = ["Ridge+GAN増強", "Ridge+GAN増強(batch16k)", "LightGBM+GAN増強", "LightGBM+GAN増強(batch16k)", "MLP+GAN増強", "MLP+GAN増強(batch16k)", "WGAN-GP"]
configs = ["experiment/trade_own_ridgegan_a.toml", "experiment/trade_own_ridgegan16k_a.toml", "experiment/trade_own_lgbmgan_a.toml", "experiment/trade_own_lgbmgan16k_a.toml", "experiment/trade_own_mlpgan_a.toml", "experiment/trade_own_mlpgan16k_a.toml"]
label = "にせの過去データを足して学ばせるやり方"
summary = "出力スコアを計算する型そのものではなく、学ばせる前のひと手間。過去のデータによく似た「にせの日」を本物と同じ数だけ作り、本物に足してから、足し合わせ・枝分かれ・まぜ合わせの型に学ばせる。"
card = { sees = "本物の過去 ＋ 同じ数のにせの日", decides = "出力スコアの計算のしかたは、基になる型のまま" }
traits = [
  { text = "にせの日は、本物にあった関係をなぞるだけで、新しい手がかりは増えない。", why = "にせの日を作る側も、同じ過去のデータからしか学んでいないため。", basis = "build" },
  { text = "にせの日を作るのは「作る役」と「見破る役」の 2 つ。見破られないように作る練習をくり返す。", why = "", basis = "build" },
  { text = "にせの日を足すのは学ぶときだけ。出力スコアをつけるときは本物の数字だけを使う。", why = "", basis = "build" },
  { text = "過去のデータで試すと、同じ設定で回し直しても成績が大きくぶれた。", why = "にせの日を作る計算が、回すたびに少しちがう答えになるためと見られる（理由は確かめていない）。", basis = "trial" },
]
sees = [
  { label = "基になる型と同じ数字", items = ["その株の値動き（ほかの株や為替・金利を足した形も試した）"] },
  { label = "にせの日", items = ["見ている数字と「次の日の上がり下がり」をひと組にした、にせの 1 日ぶん", "本物と同じ数だけ作る"] },
]
how = "まず過去のデータから「にせの日」を作る練習をする。できたにせの日を本物につなげ、基になる型（足し合わせ・枝分かれ・まぜ合わせのどれか）に学ばせる。出力スコアの計算のしかたは基になる型と同じ。練習のとき一度に見る日の数を 2 通りにしたので、基になる型 3 つと合わせて 6 種になる。"
limits = []
result = { verdict = "drop", text = "6 種の全部を、その株の値動きだけを見る形と、ほかの株や為替・金利も見る形で試した。どの形でも、ただ持ち続けるより悪かった。", why = "" }
records = ["docs/specs/experiments/gan-threshold-trading.md", "docs/specs/experiments/gan-threshold-ownex.md", "docs/specs/experiments/gpu-models.md"]

[[model]]
id = "symbolic-regression"
formal = ["F4-1 記号回帰（遺伝的プログラミング）"]
configs = ["experiment/trade_own_gp_a.toml", "experiment/trade_own_gp_lgbm_a.toml", "experiment/trade_own_gp_mlp_a.toml"]
label = "式を競わせて進化させ、新しい数字を作る型"
summary = "見ている数字を足したり掛けたりする「式」をたくさん作り、過去によく当たった式を残して掛け合わせる、をくり返す。生き残った式の答えを新しい数字として、出力スコアを計算する型に渡す。"
card = { sees = "その株の値動き（35 個の数字）", decides = "式を競わせて残し、残った式の答えから出力スコアを計算する" }
traits = [
  { text = "探す力が強いほど、過去のたまたまを確実に見つけてくる。", why = "過去のデータで試すと、学ぶ期間の中でよく当たった式が、その先の期間では当たらなかった。", basis = "trial" },
  { text = "過去のデータで試すと、生き残った式の先頭には「曜日」が入っていた。", why = "学ぶ期間の中では曜日がよく当たって見えた。その先の期間では当たらなかった。", basis = "trial" },
  { text = "式を探すのは学ぶ期間の中だけ。答え合わせの期間は、探すあいだ 1 度も見せない。", why = "", basis = "build" },
  { text = "できた式は、人が読める。", why = "足す・掛けるなどの組み合わせで書かれるため。", basis = "build" },
]
sees = [
  { label = "その株の値動き", items = ["上がり下がり・荒さ・いまの位置・売買された量・値動きの形（35 個の数字）"] },
]
how = "100 本の式を用意し、学ぶ期間の中で「式の答えと、次の日の上がり下がりの並びが、どれだけ合うか」を測る。良い式を残し、式どうしを掛け合わせたり一部を変えたりして次の世代を作る。これを 20 世代くり返し、似すぎた式を間引いて 16 本を残す。残った式の答えを新しい数字として、足し合わせ・枝分かれ・まぜ合わせのどれかの型に渡し、出力スコアを計算する。"
limits = []
result = { verdict = "drop", text = "出力スコアを計算する型を 3 通り・買う線を 3 通り試した。どの形でも、ただ持ち続けるより悪かった。", why = "" }
records = ["docs/specs/experiments/evolutionary-search.md"]

[[model]]
id = "trend-gates"
formal = ["D1 短期ゲート（20日・学習）", "D2 中期ゲート（60日・学習）", "D3 長期ゲート（200日・学習）", "D4 合成ゲート（3スケール平均）", "C1 短期 SMA20 フィルタ", "C2 中期 SMA60 フィルタ", "C3 長期 SMA200 フィルタ"]
configs = ["experiment/trend_scales_1995.toml"]
label = "上がり調子かどうかを見る門"
summary = "「明日上がるか」ではなく、「これから先しばらく（20 日・60 日・200 日）上がるか」に出力スコアをつける。出力スコアが低いあいだは株を持たずに休む、という門として使う。"
card = { sees = "その株の、長めの値動きの調子", decides = "過去から学ぶ門と、昔からある決まりの門" }
traits = [
  { text = "下げている期間を避けることはできた。ただし、下げたあとの戻りを取りそこねるぶんのほうが大きかった。", why = "過去のデータで試すと、どの長さの門でもそうなった。休んでいるあいだに値段が戻ってしまう。", basis = "trial" },
  { text = "過去のデータで試すと、長い期間を見る門ほど負けが小さかった。", why = "その先にあるのは「1 度も休まない」＝ ただ持ち続ける、という並びだった。", basis = "trial" },
  { text = "昔からある決まりの門は、過去から何も学ばない。", why = "「値段が、ここ何日かの平均より上なら持つ・下なら休む」と決めてあるだけのため。", basis = "build" },
]
sees = [
  { label = "調子を表す 6 つの数字（20 日・60 日・200 日のそれぞれで）", items = ["ここ何日かの平均から、どれだけ離れているか", "値動きにまっすぐな線を当てたときの傾き", "その期間の高値から、どれだけ下がっているか", "上がった日の割合", "日々のぶれの大きさ", "その期間でどれだけ上がり下がりしたか"] },
]
how = "過去から学ぶ門は、6 つの数字に重みをかけて足し、「これから先その日数のあいだに上がっていそうか」の出力スコアを 0〜100 で出す。20 日・60 日・200 日の 3 本と、その 3 本の出力スコアを平均した 1 本がある。昔からある決まりの門は学ばず、値段が平均より上なら出力スコアを 100、下なら 0 とする（これも 3 本）。"
limits = [
  "試しに使った株は、下げたあとにどれも戻っている。戻らなかった会社が入っていないので、「休む」には厳しい結果になっている。",
]
result = { verdict = "hold", text = "門 7 本 × 買う線 3 通りの 21 通りを試した。18 通りは落とす・3 通りは保留で、採るは無かった。", why = "保留の 3 通りも、たまたまと区別がつかない大きさだった。" }
records = ["docs/specs/experiments/downtrend-detection.md"]

[[model]]
id = "entry-exit-gates"
formal = ["入口D1(20)×出口D2(60)（学習）", "入口D1(20)×出口D3(200)（学習）", "入口D2(60)×出口D3(200)（学習）", "入口D2(60)×出口D1(20)（学習）", "入口D3(200)×出口D1(20)（学習）", "入口D3(200)×出口D2(60)（学習）", "入口C1(20)×出口C2(60)（古典）", "入口C1(20)×出口C3(200)（古典）", "入口C2(60)×出口C3(200)（古典）", "入口C2(60)×出口C1(20)（古典）", "入口C3(200)×出口C1(20)（古典）", "入口C3(200)×出口C2(60)（古典）"]
configs = ["experiment/trend_pairs_1995.toml"]
label = "買うときと売るときで、見る長さを変える門"
summary = "買うかどうかは短い期間の調子で、売るかどうかは長い期間の調子で決める（確かめのために、その逆も試す）。上がり調子かどうかを見る門を、買う側と売る側に 1 本ずつ置いたもの。"
card = { sees = "その株の、長めの値動きの調子", decides = "買う側の門と、売る側の門を別々に持つ" }
traits = [
  { text = "持っていない日は買う側の門だけ、持っている日は売る側の門だけを見る。", why = "2 本の門の言うことが食いちがっても、どちらを先にするかで迷わない作り。", basis = "build" },
  { text = "過去のデータで試すと、「買うのは短い期間・売るのは長い期間で決める」という考えは支持されなかった。", why = "成績が上のほうだったのは、確かめのために置いた逆向き（買うのは長い期間・売るのは短い期間）の組だった。", basis = "trial" },
  { text = "過去のデータで試すと、売る側の出力スコアがせまい幅に固まって、ほとんど動かなかった。", why = "なぜ固まるのかは確かめていない。", basis = "trial" },
]
sees = [
  { label = "調子を表す 6 つの数字（買う側の長さと、売る側の長さのそれぞれで）", items = ["平均からの離れ・傾き・高値からの下がり・上がった日の割合・日々のぶれ・その期間の上がり下がり"] },
]
how = "見る長さは 20 日・60 日・200 日の 3 つ。買う側と売る側でちがう長さを組にした 6 通りを、過去から学ぶ門と、昔からある決まりの門のそれぞれで作った（合わせて 12 本）。6 通りのうち 3 通りは「買うのは短い期間・売るのは長い期間」、残りの 3 通りは確かめのための逆向き。"
limits = []
result = { verdict = "hold", text = "12 本 × 買う線 3 通りの 36 通りを試した。34 通りは落とす・2 通りは保留で、採るは無かった。この方向は続けないと決めた。", why = "保留の 2 通りも、たまたまと区別がつかない大きさだった。" }
records = ["docs/specs/experiments/entry-timing.md"]

[[model]]
id = "minirocket"
name = "trade_ownseq_ridge_a"
method = "T1 MiniRocket（60日窓）"
formal = ["T1 MiniRocket（60日窓）", "Ridge"]
label = "60 日の線に、小さな型紙をたくさん当てる型"
summary = "過去 60 日の値動きを 1 本の線として見て、約 1 万枚の小さな型紙を線の上にすべらせる。型紙ごとに「線のうち、どれだけの部分で当てはまったか」を数字にして、出力スコアを計算する。"
card = { sees = "過去 60 日の値動きの線", decides = "決まった型紙を当てて、当てはまった割合を測る" }
traits = [
  { text = "型紙は過去から学ばない。決まった形を最初から全部持っている。", why = "学ぶのは、型紙ごとの数字にかける重みだけ。", basis = "build" },
  { text = "線の形から約 1 万個の数字を作るので、過去のたまたまの形を覚えこみやすい。", why = "見る数字が多いほど、たまたま当たった形を拾いやすい。", basis = "build" },
  { text = "過去のデータで試すと、出力スコアがせまい幅に固まり、期間ごとに「ずっと全部持つ」か「ずっと全部休む」に倒れた。", why = "線の形から作った数字が、次の日の上がり下がりの手がかりになっていなかったと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "株どうしをくらべて選ぶことはしない。", why = "どの株の出力スコアも、その株自身の過去だけから出るため。", basis = "build" },
]
sees = [
  { label = "過去 60 日の線", items = ["毎日の上がり下がりを 60 日ぶん並べたもの（60 個の数字が 1 本の線になる）"] },
]
how = "型紙は 9 日ぶんの長さの、小さな重みの並び。あいだを空けて当てることで、短い形も長い形も拾う。型紙 1 枚ごとに「線のうち何割で当てはまったか」を測り、約 1 万個の数字にする。その数字に重みをかけて足し合わせ、1 つの出力スコアにする。"
limits = []
result = { verdict = "drop", text = "買う線を 3 通り試した。どれも、ただ持ち続けるより悪かった。", why = "" }
records = ["docs/specs/experiments/tsc-threshold.md"]

[[model]]
id = "hydra"
name = "trade_ownseq_ridge_a"
method = "T2 Hydra（60日窓）"
formal = ["T2 Hydra（60日窓）", "Ridge"]
label = "60 日の線の上で、型紙どうしを競わせる型"
summary = "過去 60 日の線に、型紙を組にして当てる。線の場所ごとに、組の中でどの型紙がいちばん強く当てはまったかを数え、その数から出力スコアを計算する。"
card = { sees = "過去 60 日の値動きの線", decides = "組にした型紙を競わせて、勝った回数を数える" }
traits = [
  { text = "型紙は乱数で作り、過去から学ばない。", why = "学ぶのは、数えた結果にかける重みだけ。", basis = "build" },
  { text = "過去のデータで試すと、どの日のどの株にも、ほとんど同じ出力スコアをつけた。", why = "出力スコアの幅が 1 に満たなかった。", basis = "trial" },
  { text = "そのため、期間ごとに「ずっと全部持つ」か「ずっと全部休む」に倒れた。", why = "どの出力スコアもほぼ同じなので、買う線を上回るときは全部が上回り、届かないときは全部が届かない。", basis = "trial" },
  { text = "株どうしをくらべて選ぶことはしない。", why = "どの株の出力スコアも、その株自身の過去だけから出るため。", basis = "build" },
]
sees = [
  { label = "過去 60 日の線", items = ["毎日の上がり下がりを 60 日ぶん並べたもの", "その線の、前の日との差を並べた線"] },
]
how = "型紙を 8 枚ずつの組にし、それを 64 組用意する。線の上の場所ごとに、組の中でどの型紙がいちばん強く（または、いちばん弱く）当てはまったかを数える。数えた結果を数千個の数字にし、重みをかけて足し合わせて 1 つの出力スコアにする。"
limits = []
result = { verdict = "drop", text = "買う線を 3 通り試した。どれも、ただ持ち続けるより悪かった。", why = "" }
records = ["docs/specs/experiments/tsc-threshold.md"]

[[model]]
id = "patchtst"
name = "trade_ownseq_patchtst_a"
method = "S1 PatchTST（60日窓）"
formal = ["S1 PatchTST（60日窓）", "PatchTST"]
label = "60 日の線を切れはしに分けて読む型"
summary = "過去 60 日の線を、少しずつ重なる 16 日ぶんの切れはしに分ける。切れはしどうしの関係を読んで、線のつづきの次の値（明日の上がり下がり）を当てにいく。"
card = { sees = "過去 60 日の値動きの線", decides = "切れはしどうしの関係を読んで、線のつづきを当てる" }
traits = [
  { text = "線から何を読み取るかも、自分で学ぶ。決まった型紙は持たない。", why = "切れはしを数字に直すところから出力スコアを計算するところまで、全部を過去から学ぶ作り。", basis = "build" },
  { text = "過去のデータで試すと、何も学ばなかった。「明日は動かない」と答え続けるのと変わらない当たり方だった。", why = "学び直した 10 回の全部でそうなった。作りの写しまちがいではないことは、元の作者の実装と答えが一致することで確かめてある。", basis = "trial" },
  { text = "株どうしをくらべて選ぶことはしない。", why = "どの株の出力スコアも、その株自身の過去だけから出るため。", basis = "build" },
]
sees = [
  { label = "過去 60 日の線", items = ["毎日の上がり下がりを 60 日ぶん並べたもの（60 個の数字が 1 本の線になる）"] },
]
how = "線を 16 日ぶんずつ、8 日ずらしながら切って、7 つの切れはしにする。切れはしをそれぞれ数字の並びに直し、「どの切れはしが、どの切れはしと関係が深いか」を 3 段かけて読む。最後に線のつづきの次の値を出し、0〜100 の出力スコアに直す。"
limits = []
result = { verdict = "drop", text = "買う線を 3 通り試した。どれも、ただ持ち続けるより悪かった。", why = "" }
records = ["docs/specs/experiments/patchtst-threshold.md"]

[[model]]
id = "cgan-scenario"
formal = ["条件付き GAN のシナリオ予測（cgan_spy）", "WGAN-GP ＋ GRU"]
configs = ["scenario/cgan_spy.toml"]
stocks = false
label = "これから 5 日の筋書きをたくさん作る型"
summary = "出力スコアはつけない。過去 60 日の様子を見て、「これから 5 日の値動き」の筋書きを 1,000 本作る。筋書きの散らばり方で、この先の上がり下がりの幅を表す。"
card = { sees = "大きな会社の株の詰め合わせ商品 1 本の、過去 60 日", decides = "筋書きを 1,000 本作り、散らばりを見る" }
traits = [
  { text = "答えは 1 つの数ではなく、幅のある見通しになる。", why = "同じ過去を見せても、乱数を変えるたびにちがう筋書きが出る作り。", basis = "build" },
  { text = "筋書きを作るのは「作る役」と「本物かどうかを見破る役」の 2 つ。見破られないように作る練習をくり返す。", why = "", basis = "build" },
  { text = "売り買いの決まりにはつながっていない。", why = "出力スコアを計算しないので、買う線を使う仕組みにはそのままでは入らない。", basis = "build" },
]
sees = [
  { label = "過去 60 日の、毎日の 6 つの数字", items = ["その日の上がり下がり", "売買された量が、ふだんとくらべて多いか少ないか", "ここ 5 日・20 日のぶれの大きさ", "ここ 5 日・20 日でどれだけ上がり下がりしたか"] },
]
how = "過去 60 日を順に読んで、様子を短い数字の並びにまとめる。そこに乱数を足して、これから 5 日ぶんの毎日の上がり下がりを 1 本作る。乱数を変えて 1,000 本作り、その散らばりを見通しとする。"
limits = [
  "試したのは、詰め合わせ商品 1 本だけ。",
]
result = { verdict = "drop", text = "試す前に決めておいた 5 つの合格の条件を、1 つも満たさなかった。見通しの当たり方は、過去の値動きをそのまま使うだけの見通しに届かなかった。", why = "今あるモデルの置きかえには使わず、試しの実装として残してある。" }
records = ["docs/specs/experiments/cgan-scenario.md"]
