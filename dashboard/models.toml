[model.detail.about]
text = [
  "時系列分類器 QUANT（aeon 1.5.0 の QUANTTransformer・既定の深さ 6・分位の割り 4・乱数なし）を特徴量の変換に使い、頭は分類ではなく Ridge 回帰（alpha 1.0。論文の頭 ExtraTrees とは違う ＝ ail/detectors/tsc.py:12-14）。",
  "形式 (A)（銘柄共通）で us63（ETF 15 ＋ 会社 48）をプールして fold ごとに 1 本。期間 2018-01-31〜2026-09-04・135,962 行。walk-forward 5 fold（日付を 6 等分・先頭は訓練専用）・パージ 1 日。検証の始まり 2019-07-09（rules.md 14-4）。",
]

[model.detail.how]
text = [
  "窓 ＝ own_seq60_r0..r59（60 日分の対数リターン。ail/features/seq.py:32-36）を古い順に並べて累積し、最後の値を引いた道筋（点 j ＝ log c[i−59+j] − log c[i]）。窓ごとの z 正規化はしない（tsc.py:36-50）。",
  "4 つの表現（aeon の _quant.py:109-114）: 道筋そのもの（長さ 60・120 区間・191 列）／ 1 次差分を 5 点で均したもの（59・120・191）／ 2 次差分（58・120・191）／ FFT の振幅（31・57・80）。計 653 列（fitted と一致）。",
  "区間の規則（_quant.py:131-161）: 段 n ＝ 1, 2, 4, …（最大 min(6, floor(log2 L)+1) 段）・境目は linspace(0, L, n+1) の切り捨て・n>1 なら ceil(L/n/2) ずらした組を足す。1 区間の分位の数 q ＝ 1 + (長さ−1)//4。q ≥ 2 なら等間隔の分位で、奇数番の添字からは区間の平均を引く。小さな例の [3,1,4,1,5,9,2,6] → 丸ごとの区間は [1.0, 5.125]（コードから計算）。",
  "変換の fit（訓練だけ）→ StandardScaler（訓練で fit）→ Ridge → Platt 較正（訓練の尻 10%・隙間 max(64, n//200) 行。ail/models/holdout.py:23-37・calibrate.py:42-95）。",
]

[model.detail.score]
text = [
  "【実測】門（訓練を日付の 90% で切り、頭で作って尻で測る。5 fold の中央値 ＝ ail/validation/gate.py:74-96）: AUC 0.5024（fold 別 0.503 ／ 0.463 ／ 0.502 ／ 0.506 ／ 0.501）・買い% の幅（p05–p95）2.08 点（fold 別 2.08 ／ 2.99 ／ 1.19 ／ 4.99 ／ 1.66）。⚠ 検証期間の数字ではない。",
  "較正の傾き a: −5.434 ／ ＋17.447 ／ −1.709 ／ −1.459 ／ −0.660。θ=50 の保有日率 1.000 ／ 0.915 ／ 0.000 ／ 1.000 ／ 1.000（tsc-threshold.md §2・§3）。",
  "保有日数（θ=50）: 中央値 7 日・保有 1 日が 20.9%・強制清算 13.5%。短い山と約 360 日の山の二山（holding-days.md §3-2）。sim3 の sim_T3: 初日に全銘柄を買い、64 営業日で買い 85 ／ 売り 22、最終日も全銘柄を保有（live-trading.md §0-7 (k)）。2026-09-18 の合図は 62 ／ 63 が買い（§0-9 (a)）。",
]

