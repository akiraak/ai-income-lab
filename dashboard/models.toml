  "leak 対照（2026-09-27T20-32-59_trade_ownseq_fwd10_timexer_a_leak・79 分）: θ50 ／ 55 ／ 60 の上乗せ ＋6,029.9 ／ ＋5,928.5 ／ ＋5,793.4bp・5/5・t 3.59 ／ 3.48 ／ 3.38。線形の項の重みは 0 から LEAK_fwd_10 0.16〜0.78 まで学んだ ＝ 配線は通っている。",
