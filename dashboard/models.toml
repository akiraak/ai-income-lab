[model.detail.about]
text = ["表は素のモデルと同じ（own_2018 35 列・us63 ／ ownex 124 列・48 社）。形式 (A) は 63 銘柄をまとめて fit、(B) は銘柄ごと（fold 1 は約 360 行）。後段は Ridge ／ LightGBM ／ MLP（既定のまま）→ Platt → θ（gan-threshold-trading.md §5-6）。"]

[model.detail.how]
text = [
  "WGAN-GP（ail/models/gan.py）: 標準化済みの訓練分割で、1 行 ＝ 特徴量 ＋ ラベル（y/σ）の同時分布を学ぶ（:36-40）。合成行 ＝ 訓練行と同数（α = 100%）・実データの前に置く（:7-8・85・99-100）。fold ごとに fit し直し、重みは保存しない。",
  "生成器: 潜在 32 → [Linear 128 ＋ LeakyReLU 0.2] × 3 → 出力。critic も同じ形で出力 1。Adam lr 1e-4・β (0.5, 0.9)・critic 5 回に生成器 1 回・GP 係数 10・300 epoch。batch は min(1,024 または 16,384, 行数)。種は seed+1（:31-73・116）。16k を足した理由: 1 反復 37 → 47ms とほとんど変わらない【実測】（*16k_a.toml:5-7）。⚠ (B) の fold 1・2 では 1,024 と 16k が同じ計算になる。",
]

[model.detail.score]
text = ["【実測】門の買い% 幅（own ／ batch 1,024）: Ridge+ 7.08・LightGBM+ 0.71・MLP+ 4.54 点 ／（own ／ 16k）2.59・1.66・3.41 ／（ownex ／ 1,024）4.69・2.63・4.30 ／（ownex ／ 16k）8.33・3.88・5.24。AUC own 0.4988〜0.5194 ／ ownex 0.4884〜0.5221（gan-threshold-trading.md §0・gan-threshold-ownex.md §0）。own Ridge+16k (A) θ=60 は較正の傾きが寝て保有日率 0.007（trading §1-4）。同じ入力の回し直しは bit 一致（trading §3-1・§5 #7、ownex §3-1）。ex_ 修正後の ownex の回し直しで純利の最大差 (A) 453〜803bp ／ (B) 52〜265bp（素のモデルは 29〜136bp。理由は【推測】＝ ownex §8）。"]

[model.detail.result]
