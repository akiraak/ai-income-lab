  { t = "買う・売る", text = "売買基準値がまん中（50）なら、持っていない株は 51.6 が 50 を上回ったので買う。持っている株は、出力スコアが 50 を下回るまで持ち続ける。ちょうど線と同じ値のときは動かない。" },
