  "学習の対象 y_fwd_10 ＝ log(c[t+10]) − log(c[t])（ail/features/labels.py build_scales・config の label_scales = [10]）。損益の y は 1 日のまま（rules.md 15-3）。",
  "検知器（fwd.py forward_gate）: 表の説明変数を全部（y_fwd_ は接頭辞ごと外れる）→ StandardScaler（ラベルのある訓練行だけで fit）→ config の model（Ridge alpha 1.0 ／ LightGBM 500 本・早期打ち切り）で y_fwd_10 を回帰 → Platt で P(y_fwd_10 > 0)。較正は訓練の日付の末尾 10% を holdout にし 15 暦日パージ（scale._fit_calibration ＝ date_holdout(label_bars=10)）。",
  "leak 対照は LEAK_fwd_10（答えそのもの）が説明変数に入る形（6 実行とも上乗せ ＋7,194〜＋8,070bp・5/5・t 12.6〜15.9）。",
