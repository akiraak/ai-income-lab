  { text = "出力スコアが「上がりそう」を言い当てる力は、でたらめとほとんど変わらなかった。", why = "学ぶ期間の終わりに取り分けた日で測った当たり方が、コインを投げるのとほぼ同じだった。", basis = "trial" },
