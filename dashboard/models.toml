  "LightGBM（ail/models/trees.py:17-31）。手法「全部使う（基準）」。targets = company ＝ 予測する対象は会社株 48 本だけ（ETF は説明変数の材料にだけ使う ＝ build.py:87-95）。形式 (A) で 48 社をまとめて fold ごとに 1 本。2018-01-31〜2026-09-04・101,157 行。fold 1 の訓練 16,182 行 ／ fold 5 は 83,829 行。パージ 1 日・エンバーゴ 1 本（config:36-38）。",
  "実売買（cli/predict.py:80-123）: 訓練 ＝ ラベルの終わりの足が asof より前の行。毎日 fit し直す（1 回 1.4 秒）。今日の行で特徴量が欠けた銘柄は外す。⚠ ex_ は 48 本とも同じ列なので、古くなると全銘柄が落ちて predict が失敗し、run-live.sh はその回の執行器を起こさない（run-live.sh:98）＝ T1・T3 も動かない。",
]

