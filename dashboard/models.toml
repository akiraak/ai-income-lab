# 予測モデルの言葉の正本（docs/specs/dashboard.md §17）。
#
# ⚠ **モデルの解説を書くのはここだけ**。vibeboard の「予測モデル」タブ（modelview.py）と「トレーダー」タブ（traderview.py）の
#    両方がここから写す。⚠ 人の側の言葉（呼び名・いつ・いくら・売買基準値の文）は traders.toml。
# ⚠ **ほかのモデルとくらべる文を書かない**（「モデルの中でいちばん」「〜より多い」など。モデルは増えたり減ったりする）。
#    1 つのモデルだけを読んで分かる文にする。⚠ 「ただ持ち続ける」とくらべるのは良い（それが試しのものさし）。
# ⚠ **どこまで確かかを必ず付ける**（特性の `basis`）: build ＝ 作りから言えること（コードと設定を読めば分かる）／
#    trial ＝ 試し運転で見えたこと（シミュレーションと過去のデータでの試し。本番で同じとは限らない）／ guess ＝ 見立て（確かめていない）。
#    ⚠ 確かめていない理由を言い切らない（「〜と見られる（理由は確かめていない）」）。
# ⚠ **説明を Python や HTML に書かない**（用語タブの glossary.toml と同じ考え方）。文を直すならこのファイルだけ。
# ⚠ **やさしい言葉で書く**: 本文では専門用語を使わない（使わない語の一覧は tests/test_traders_tab.py の FORBIDDEN。
#    dashboard.md §16-2 の表）。用語を書いてよいのは `id`・`name`・`method`・`formal`・`configs`・`records` だけ（画面の「正式な名前」の段に出る）。
# ⚠ **実売買の設定の数字（予算・売買基準値・見る株の本数）を書かない**。⚠ 売買結果（損益・注文・約定・持ち高）は書かない・出さない。
# ⚠ **`result`（過去のデータで試した結果）の印と文は人が記録から写したもの**。検証結果一覧を作り直しても自動では変わらない。
#    ⚠ ただし試した経緯の数は、研究の DB（`ledger_rows` ＝ 検証結果一覧の生成物）から数える（2026-09-21。下の `history` の `names`）。
#    印と DB の数が食い違えばテストが落ちる ＝ そのとき直すのはここの印と文（記録で確かめてから）。
#    印は adopt ＝ 採る ／ hold ＝ 保留 ／ drop ＝ 落とす。いくつもの形で試したモデルは、いちばん良かった形の印を付け、内訳を文に書く。
#    ⚠ 1 万分の 1 単位の成績などの細かい数字は書かない（記録と実行タブにある）。`records` は記録の文書（リポジトリ直下からの道）。
# ⚠ **1 項目は 1〜2 行まで**。理由は `why`（小さい字で下に出る）に分ける。
# ⚠ **2026-09-20 に手厚くした**（利用者の裁定「とにかくこの仕組みは複雑なので分かりやすくするようにする」）。
#    足す物差しは「分かりやすいか」で、長くするのが目的ではない。下の欄は**予測モデルのタブにだけ**出る（トレーダーのページは長くしない）:
#    `flow`（図の箱）／ `axes`（このモデルの組み立て ＝ data・prep・calc・target・scope）／ `walk`（小さな例で段を追う。⚠ 数字は作りもの）／
#    `score`（出力スコアの出かた ＝ `items` に印 `basis` つき・読み方 ＝ `read`）／ `history`（試した経緯の表。`when`・`what`・`adopt`/`hold`/`drop` の数・
#    `old = true` ＝ 計算を直す前の試し・`aside = "理由"` ＝ ちがう売り買いの決まりでの試しなど ＝ どちらも薄く出して印に数えない・`note`・
#    `names` ＝ その行に当たる予測モデル名のパターン〔rules.md 10-2・`fnmatch`・θ はまとめて数える〕。⚠ `names` のある行は、DB がある機械では
#    数を DB から数える〔ここに書いた数は DB の無い機械のための控えで、DB の数と同じでないとテストが落ちる〕。`when` の日は DB の実行の日の
#    範囲に入っていること。⚠ 回し直しが 1 行にまとまるので、直す前と後の回し直しを分けた行には `names` を書けない〔人が写した数のまま〕。
#    ⚠ `old`・`aside` を除いたいちばん良い印が `result.verdict` と同じ ＝ テスト）。
# ⚠ **用語・正式な名前・細かい数字と出典を書いてよいのは `[model.detail.<about|how|score|result>]` だけ**（画面の「詳しく（用語あり）」の囲み。
#    ⚠ 畳まない）。【実測】と出典を添える。ほかの欄は全部やさしい言葉の検査を受ける。
#    ⚠ **門の数字と較正の係数は、実行の記録から差し込む**（2026-09-21・dashboard.md §17-3）: `{{gate|<実行>|<数字の選び方・作り方>|<項目>|<桁>|<控え>}}`
#    （項目 ＝ auc ／ width_pt ／ auc_folds ／ width_folds）・`{{calib|…|a または b|…}}`（fold の順に並ぶ）。桁の頭に `+` で正の数に ＋。
#    DB がある機械では DB の値（点線の下線・指すと実行の識別名）、無い機械では控え。⚠ 控えは DB の値と同じ文字でないとテストが落ちる。
#    範囲（「0.491〜0.512」）や、桁のそろわない並び・いくつもの実行にまたがる数字は差し込めないので、人が写したまま。
#
# モデルを足す ＝ `[[model]]` を 1 つ書く（コードは触らない）。`id` はページの識別名（英数と `-`。⚠ 一度付けたら変えない ＝ リンクが切れる）。
# `name`・`method` は実売買の設定（experiments/live-trading/config/traders/）の [[models]] と同じ綴り ＝ これが合う人が居れば
# 「いま使っている」の束に出る。`configs` は experiments/feature-discovery/config/ からの道（省けば experiment/<name>.toml）。
# `stocks = false` ＝ 会社の株で試していないモデル（「消えた会社が入っていない」の注意を出さない）。
# `flow` ＝ しくみのページ「モデルを作る」（下の `[[page]]` の `models = true` の段）に出す型ごとの図の箱（`t` 見出し・`s` 小さい字・`kind = "out"`）。やさしい言葉で・12 個以内。
#
# ⚠ **しくみのページ（`[[page]]`。このファイルの最後）**: どのモデルにも共通の話 ＝ モデルを作る ／ 過去のデータで確かめる ／ 実際の売買で使う ／
#    名前と識別名。2026-09-21 に「システム説明」タブ（system.toml）から移した（利用者の指示「システム説明は概要だけにする」）。
#    形は system.toml と同じ（[[page]] → [[page.section]] → [page.section.figure] ／ table ／ detail_table）。本文はやさしい言葉・
#    用語は `detail`・`detail_points`・`detail_table`（「詳しく（用語あり）」の囲み）にだけ。⚠ `id` は [[model]] の `id` と重ねない（テスト）。

[common]
show_result = true        # false にすると「過去のデータで試した結果」の段と、一覧の印を出さない
list_title = "予測モデルの一覧"
