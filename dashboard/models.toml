text = ["検知器 S4（ail/detectors/exomodel.py）＋ モデル TimeXer（ail/models/timexer.py ＝ thuml/Time-Series-Library commit 4e938a1 の models/TimeXer.py〔features = MS〕の移植）。表は trade_ownseq_fwd10_ridge_a を features_from で読む（own 35 ＋ seq 60 ＋ y_fwd_10・135,395 行）。外生は表の列ではなく検知器が組む（全 63 銘柄の seq 窓の道筋〔自分の枠は 0〕＋ 金利 7・為替 7 の水準の道筋〔1 日ずらし as-of・最後の点 0〕＝ 77 本）。形式 (A)・us63・walk-forward 5 fold・パージ 15 暦日・AIL_TORCH_DEVICE=cuda。実行 2026-09-27T19-46-57_trade_ownseq_fwd10_timexer_a（本番 46 分）。記録 exog-deep-models.md。"]

[model.detail.how]
text = [
  "ARCH（事前固定 ＝ 公式 scripts/forecast_exogenous/EPF/TimeXer.sh 5 本の多数決 ＋ run.py の既定）: e_layers 2・n_heads 8・d_model 512・d_ff 2048・dropout 0.1・GELU・patch_len 10（窓 60 → 6 パッチ ＋ 大域トークン 1）・use_norm（窓ごとの平均・分散。全変数）。パラメータ 8,449,537。TRAIN: Adam 1e-4・MSE・batch 16・10 epoch・type1（epoch ごとに半減）・patience 3。",
  "公式との違い: pred_len 1 で その 1 点 ＝ 10 営業日先の道筋の値 ＝ y_fwd_10 ／ x_mark なし ／ 尺度 ＝ 内生と y を訓練の内生の標準偏差（0.08〜0.10）で割り、外生は変数ごとに訓練の標準偏差で割る ／ 早期打ち切りの検証は訓練の日付の尻 10% を 10 営業日ぶん（暦 15 日）パージ（date_holdout）／ LEAK_ 列は重み 0 で始まる線形の項（PatchTST と同じ）。",
  "1 ステップ 7.82ms（batch 16・GPU）【実測】。本番 5 fold × 2 回（較正用 ＋ 本番）で 46 分。early stopping は 5〜7 epoch 目で止まった（best 2〜4）。",
]

[model.detail.score]
text = [
  "【実測】門（訓練内 holdout・fold 中央値）: AUC {{gate|2026-09-27T19-46-57_trade_ownseq_fwd10_timexer_a|S4 TimeXer（60日窓・先10日・外生あり）|auc|4|0.5117}}・幅 {{gate|2026-09-27T19-46-57_trade_ownseq_fwd10_timexer_a|S4 TimeXer（60日窓・先10日・外生あり）|width_pt|1|7.6}} 点 ＝ 門前（回すと事前に決めて回した）。fold 別 AUC 0.587 ／ 0.466 ／ 0.512 ／ 0.514 ／ 0.480・幅 8.6 ／ 7.6 ／ 6.8 ／ 15.2 ／ 4.4 点。",
  "検証 MSE（最良 epoch）÷「0 と予測」の MSE（fold 1〜5）: 1.105 ／ 0.992 ／ 1.054 ／ 1.119 ／ 1.002 ＝ 3 fold で 1 を超え、2 fold は 1 とほぼ同じ（PatchTST §3 と同じ形）。較正の傾き a: −30.40 ／ ＋5.68 ／ ＋1.67 ／ −12.29 ／ ＋1.05（符号が入れ替わる）。",
  "θ=50 の保有日率 0.78 ／ 0.99 ／ 0.00 ／ 0.85 ／ 1.00（fold 3 は 1 日も持たない）・取引 1,405 ／ 152 ／ 18 ／ 1,173 ／ 95 回・保有日数の中央値 7 日（2 日以下 27%）。θ=55 ／ 60 は中央値 17 ／ 22 日。",
]

