  "モデルは毎日、その日までのデータで学び直す。確かめるときと同じ計算をそのまま使い、実際の売買のためだけの別の計算は足していない。",
  "出力スコアが 1 本でも出せなかった日は、注文の仕組みを起こさない（古い出力スコアや欠けた出力スコアで売り買いしない）。",
]
detail = [
  "run-live.sh の 1 本。朝 ＝ --prepare（日足 ＋ 外部系列の更新 約 2 分 → 紙上の対照 out/daily.csv。発注しない）。15:50 ET ＝ --wait で起こす → 日足の更新（足だけ 52 秒）→ cli.predict × 3（並列 36 秒）→ out/<日付>/predict-<時刻>.jsonl（回ごとに別の道。2026-09-21 から中身は live.sqlite）→ 売買履歴の控え state-backup/（submit の回だけ）→ run_day.py【所要時間は実測・titan】。",
  "cli.predict は表 ＝ cli.build.assemble・買い% ＝ cli.run.fold_buy_pct の切り出しで、モデル・較正のコードは足していない。訓練 ＝ ラベルが asof より前に確定している行 ／ 予測する行 ＝ asof の行。asof より後の足は読んだ直後に捨てる。runs/ を作らない（検証ではない）。",
  "執行の窓は 15:45〜16:05 ET（NYSE の営業日。休場日は暦で見る。半日立会の日は発注しない）。合図は 15:50 の気配、注文は成行。未約定は発注から 600 秒で取消。Session offline と 5xx は 60 秒おき 3 回まで再送（external-identifier で重複を探してから）。",
