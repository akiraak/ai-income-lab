text = ["S1 PatchTST（ail/models/patchtst.py・ail/detectors/seqmodel.py）。Ridge は挟まず、次の 1 点（＝ y）を予測 → Platt。形式 (A)・us63（targets = all ＝ 材料 ＝ 学ぶ ＝ 出力 ＝ 63 本）・2018-01-31〜2026-09-04・walk-forward 5 fold。入力は seq-quant と同じ累積の道筋 60 点を、訓練の y の標準偏差で割ってから入れる（patchtst.py:246-252）。"]

[model.detail.how]
