  { text = "そのため、売買する株を全部いっぺんに買うか、1 本も買わないかになりやすい。何日も 1 本も買わなくても、故障ではない。", why = "どの株の出力スコアもほぼ同じなので、売買基準値を上回るときは全部が上回り、届かないときは全部が届かない。出力スコアを出す株の全部を金額を決めて買う形の試し運転でも、決まった本数を 1 株単位で買う形の試し運転でも、そうなった（本数は「詳しく」に）。", basis = "trial" },
  { text = "足し算では表せない組み合わせ（金利が上がっていて、かつ値動きが荒いときだけ、など）も拾える。そのぶん、過去のたまたまを覚えこみやすい。", why = "枝分かれを重ねる作りのため。", basis = "build" },
