  "ex ＝ 25 系列 × {前日差 d1, 20 日 z}（水準は入れない ＝ config/dataset/exog_daily.toml:12-39）: ECB の対ユーロ参照相場 7（USD・JPY・GBP・CHF・CNY・AUD・CAD）／ 米国債 7 年限（1M・3M・1Y・2Y・5Y・10Y・30Y）／ NOAA 3 地点 × 最高・最低気温・降水 9 ／ USGS M5.0 以上の件数・最大 M 2。気象と地震は偽薬の枠（exog_daily.toml:26・35）。1 日ずらし、前の値の引き継ぎは列ごとに 7 日まで（(足の日 − 1) − 最後に値があった日 > 7 なら欠損 ＝ exog.py:151-178）。地震は行の無い日を 0 件で埋める。",
