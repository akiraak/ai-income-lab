[model.detail.about]
text = ["検知器 S2 ／ S3（ail/detectors/exomodel.py）＋ モデル Chronos-2（ail/models/chronos2.py。amazon/chronos-2・120M・Apache 2.0・重みの版 29ec3766）。zero-shot ＝ 学習しない。表は trade_ownseq_fwd10_ridge_a を features_from で読む（own 35 ＋ seq 60 ＋ y_fwd_10・135,395 行・2018-01-31〜2026-08-24）。共変量は表の列ではなく検知器が組む（他 62 銘柄の相対価格 ＝ 同じ日付の行の seq 窓の exp ／ 金利 7・為替 7 の水準 ＝ raw/treasury・raw/ecb を 1 日ずらし as-of）。形式 (A)・us63・walk-forward 5 fold・パージ 15 暦日。実行 2026-09-27T18-14-01_trade_ownseq_fwd10_chronos_a（本番 46 分・GPU 77 行/秒）／ leak 19-00-27_…_leak（47 分）。記録 exog-deep-models.md。"]

[model.detail.how]
text = [
  "Chronos2Pipeline.predict_quantiles（文脈 60・prediction_length 10・分位点 21 本 0.01〜0.99・past_covariates のみ）。10 日目の分位点から文脈の最後の値を引き、単調に直して線形補間で F(0) を読む → P(上) ＝ 1 − F(0)（端 0.01 ／ 0.99）→ ロジット → Platt（訓練の日付の尻 10%・10 営業日ぶん暦 15 日パージ ＝ date_holdout）。",
  "共変量ありの推論は 1 バッチ 1,024 系列で 77 行/秒【実測】。4,096 系列にすると 35 行/秒と遅くなった（結果には効かない）。",
  "leak 対照は LEAK_fwd_10 の重みを訓練の行で最小二乗して足す（学習しないモデルなので PatchTST の「重み 0 の線形の項」の代わり）。重みは LEAK_fwd_10 に 1.0・LEAK_future_ret に 0.0。6 行とも上乗せ ＋5,329〜＋6,042bp・5/5・t 8.6〜11.3。",
  "⚠ 最初の実行（17-09-04）は目的を相対価格（最後 1.0）で渡しながら 0 を読んで P(上) が全行 0.99 になり、1 時間で止めて捨てた（sweep で閉じた。検証結果一覧に行は出ない）。",
]

[model.detail.score]
text = [
  "【実測】門（訓練内 holdout・fold 中央値）: S2 AUC {{gate|2026-09-27T18-14-01_trade_ownseq_fwd10_chronos_a|S2 Chronos-2（60日窓・先10日・共変量あり）|auc|4|0.4881}}・幅 {{gate|2026-09-27T18-14-01_trade_ownseq_fwd10_chronos_a|S2 Chronos-2（60日窓・先10日・共変量あり）|width_pt|1|13.9}} 点 ／ S3 AUC {{gate|2026-09-27T18-14-01_trade_ownseq_fwd10_chronos_a|S3 Chronos-2（60日窓・先10日・共変量なし）|auc|4|0.4855}}・幅 {{gate|2026-09-27T18-14-01_trade_ownseq_fwd10_chronos_a|S3 Chronos-2（60日窓・先10日・共変量なし）|width_pt|1|5.9}} 点 ＝ 2 本とも門前（回すと事前に決めて回した）。",
  "P(上)（本番の検証行・fold 1〜5）: S2 平均 0.479 ／ 0.483 ／ 0.514 ／ 0.490 ／ 0.493・sd 0.12 ／ S3 平均 0.538 ／ 0.520 ／ 0.512 ／ 0.524 ／ 0.518・sd 0.17。較正の傾き a: S2 ＋0.300 ／ ＋0.044 ／ −0.413 ／ −0.042 ／ ＋0.065、S3 ＋0.188 ／ −0.111 ／ −0.188 ／ −0.132 ／ −0.065（符号が fold で入れ替わる）。",
  "θ=50 の保有日率 0.85（S2）／ 0.81（S3）・取引 348 ／ 349 回/fold・保有日数の中央値 3 ／ 5 日（2 日以下が 43% ／ 38%）。θ=55 ／ 60 は中央値 78〜350 日。fold 3 だけほぼ持たない（保有 0.26 ／ 0.13）。",
]

[model.detail.result]
text = [
  "2026-09-27（n_trials 736 → 742）: S2 θ50 ／ 55 ／ 60 の上乗せ −109.3 ／ −147.1 ／ −1,173.2bp（fold の符号 −0−0− ／ −0−−＋ ／ −−−−−・t −1.10 ／ −0.61 ／ −2.65）／ S3 −139.8 ／ −121.2 ／ −839.1bp（−＋−−＋ ／ −＋−−＋ ／ ＋−−−−・t −1.38 ／ −0.72 ／ −2.37）＝ 6 行とも落とす。B&H ＋1,666.4bp/fold。",
  "共変量の効き: S2 − S3 の上乗せの差は θ50 ＋30 ／ θ55 −26 ／ θ60 −334bp で、fold の σ（数百 bp）の内 ＝ 見立て §0-3 の 3 のとおり。手法 − 乱択ゲート: S2 ＋17 ／ −71 ／ −43、S3 ＋102 ／ ＋62 ／ −133bp（採否に使わない）。",
]

