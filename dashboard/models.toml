# ---------------------------------------------------------------- 出口だけを言うモデル（損切り。2026-09-28 Phase 4。候補の人 T5 が使う）
# ⚠ 机上の検証は「入口 ＝ いま使っているモデル・出口 ＝ 規則」の対で回した（trade_own_stop_ridge_a。33 検証とも落とす）。本番の器は
#    出口だけを出す trade_own_stopexit_a（cli.predict のためだけ・queue に入れない ＝ n_trials に数えない）。経緯の数は対の検知器の行から数える。
[[model]]
id = "stop-exit"
name = "trade_own_stopexit_a"
method = "X1 出口だけ 高値20日から−10%で降りる"
formal = ["X1 出口だけ 高値20日から−10%で降りる", "X1〜X3（出口だけ・7 本）", "机上の対: L0〜L3・買値から−N%（trade_own_stop_ridge_a）"]
configs = ["experiment/trade_own_stopexit_a.toml", "experiment/trade_own_stop_ridge_a.toml"]
label = "下がったら降りる、と言うだけの型（損切り）"
summary = "「買うか」は決めず、「持っている株をいつ手放すか」だけを言う。この型は、ここ 20 日の高い値段から 1 割下がったら「売り」と言う。買いの出力スコアはいつも100にしてあるので、ほかの型と「全員が買いのときだけ買う・どれか 1 本が売りと言えば売る」の合わせ方で組むと、買うかどうかはもう 1 本の型が決め、降りる判断だけをこの型が足す形になる。"
card = { sees = "ここ 20 日の高い値段と、今日の値段", decides = "高い値段からどれだけ下がったら手放すか（決まった割合）" }
traits = [
  { text = "この型だけでは何も買わない。", why = "買いの出力スコアはいつも100で、買うかどうかの中身は持っていない。組む相手の型が買うと言ったときにだけ意味を持つ。", basis = "build" },
  { text = "「売り」と言う日は少ない。言うときは100で言う。", why = "ここ 20 日の高い値段から 1 割下がった日にだけ100、それ以外の日は 0。途中の値は無い。過去のデータでは、ある日に売りと言った株は見ている株の 1 割に満たなかった。", basis = "trial" },
  { text = "過去のデータで試したかぎり、この型を足しても損は減らなかった。", why = "いま使っているモデルの買いにこの型の売りを足した形は、足さない形より、もうけの合計が下がった。減ったのは「いちどの取引で失う額の最悪」と「高い値段からの下がり幅」だけで、取り損ねと売り買いの回数が増えた分の費用がそれを上回った。", basis = "trial" },
  { text = "浅い水準ほど費用がかさむ。", why = "少し下がっただけで降りると、降りたあとすぐ買い直す日が増え、売り買いの回数が 3 倍ほどになった。費用が損の半分を占めた。", basis = "trial" },
  { text = "買った値段は知らない。", why = "見ているのは「ここ 20 日の高い値段」で、自分がいくらで買ったかは見ていない。買った値段から測る形は、いまの売り買いの仕組みでは渡せないので、机上でだけ試した（下がり幅をかえって大きくした）。", basis = "build" },
]
sees = [
  { label = "値段の動き", items = ["ここ 20 日でいちばん高かった値段", "今日の値段", "その 2 つの差（割合）"] },
]
sees_note = "見る数字はこれだけ。売買された量や、ほかの株、株の外の数字は見ない。"
how = "毎日、株ごとに「ここ 20 日の高い値段から今日の値段がどれだけ下がったか」を出し、決めた割合（1 割）を超えて下がっていれば売りの出力スコアを100に、そうでなければ 0 にする。買いの出力スコアはいつも100。学ぶことはなく、決めた割合を動かすこともない。"
flow_claim = "この型は「学ぶ」段が無い。決めた割合との比べだけで出力スコアが決まる。"
flow = [
  { t = "見る数字", s = "ここ 20 日の高い値段・今日の値段" },
  { t = "下がった割合を出す", s = "高い値段から今日までの差" },
  { t = "決めた割合と比べる", s = "1 割を超えていれば売り" },
  { t = "出力スコア", s = "売り ＝ 100か 0 ／ 買い ＝ いつも100", kind = "out" },
  { t = "組む相手の型と合わせる", s = "買いは相手・売りはどちらかが言ったら", kind = "note" },
]
axes = { data = "その株の値段だけ（ここ 20 日の高い値段と今日の値段）。", prep = "高い値段からの下がり幅を割合に直す。学ぶ期間で何かを決めることはない。", calc = "決めた割合との比べだけ（重みを学ばない）。学ぶ形の出口も机上では試したが、この人が使うのは決めた割合の形。", target = "「これから 10 日のあいだに下がるか」を当てたいところだが、この型は当てにいかず、下がってしまってから降りる。", scope = "学ぶ段が無いので学ぶ株の分け方は無い。机上の確かめは、いま使っているモデルの買いにこの型の売りを足した形で、過去を 6 つに分けて順に答え合わせした。" }
sets = { material = "その株自身の値段だけ。", learn = "学ばない（学ぶ株は無い）。", output = "見る株の全部（会社の株と、株の詰め合わせ商品）。" }
score = { items = [
  { text = "売りの出力スコアは100か 0 のどちらかで、あいだの値は出ない。", why = "決めた割合を超えたかどうかだけで決めるため。", basis = "build" },
  { text = "本番と同じ作り方で出力スコアを出す試し運転（ある日の全部の株）では、売りが100になった株は 4 本で、残りは 0 だった。", why = "その日に、ここ 20 日の高い値段から 1 割を超えて下がっていた株がそれだけだったため。日によって本数は変わる。", basis = "trial" },
], read = ["買いの出力スコアはいつも100で、買うかどうかの中身は無い（組む相手の型が決める）。", "売りの出力スコアが100の日は「ここ 20 日の高い値段から 1 割を超えて下がっている」という意味で、これから下がるという予想ではない。"] }
limits = [
  "過去のデータでこの型を足した形は、足さない形より、もうけの合計が下がった。この型を組むのは「降りる判断を型として持てるか」の配線を確かめるためで、もうけを増やすためではない。",
  "この型は買った値段を知らない。買った直後に上がってから 1 割下がった株は、買値より上でも売る。買値より下でも、ここ 20 日の高い値段から 1 割下がっていなければ売らない。",
  "試しに使った株は、いま大きい会社から選んである。過去に消えた会社が入っていないので、下がったあと戻る株が実力より多く見え、「降りる」には厳しい結果になる。",
]
result = { verdict = "drop", text = "いま使っているモデルの買いに、決めた割合で降りる形（水準 3 つ × 2 通り）・学んで降りる形・買った値段から測る形（水準 3 つ）・降りない形を、売買基準値 3 通りずつ試した。全部で 33 通り、全部落とすだった。", why = "降りる形はどれも、降りない形より、もうけの合計が下がった。減ったのは「いちどの取引で失う額の最悪」と「高い値段からの下がり幅」だけで、取り損ねと費用がそれを上回った。買った値段から測る形は、下がり幅をかえって大きくした（降りて、買い直して、また降りる）。" }
history = [
  { when = "2026-09-27", what = "降りない形（比べる相手）。売買基準値 3 通り", names = ["own-trend.l0-nostop.ridge.shared"], drop = 3, note = "いま使っているモデルの買いだけの形。この型を足した形と比べるために、同じ材料で回した。" },
  { when = "2026-09-27", what = "ここ 20 日の高い値段からの下がりで降りる形（決めた割合 3 水準・値動きの大きさで割った割合 3 水準）と、これから 10 日の下がりを学んで降りる形。売買基準値 3 通りずつ", names = ["own-trend.l[123]-*.ridge.shared"], drop = 21, note = "深い水準ほど降りない形に近づく。「ましな損切り」は「効かない損切り」だった。" },
  { when = "2026-09-27", what = "買った値段からの下がりで降りる形（3 水準）。売買基準値 3 通りずつ。⚠ 机上でだけ試した（いまの売り買いの仕組みでは買った値段を型に渡せない）", names = ["own-trend.l0-nostop-stop*.ridge.shared"], drop = 9, note = "高い値段からの下がり幅をかえって大きくした。" },
]
records = ["docs/specs/experiments/stoploss-as-model.md"]

[model.detail.about]
text = [
  "出口だけを言う検知器 `X1 出口だけ 高値20日から−{5,10,20}%で降りる`・`X2 出口だけ 高値20日からσの{2,4,8}倍で降りる`・`X3 出口だけ 先10日の下げを学んで降りる`（7 本。`ail/detectors/stop.py`。入口% ＝ 常に 100・出口% ＝ 規則そのもの）。config は `trade_own_stopexit_a`（`features_from = \"trade_own_stop_ridge_a\"` ＝ own 35 列 ＋ `own_trend20_*` 6 列 ＋ `y_fwd_10`）。⚠ **`cli.predict` のためだけ ＝ queue に入れない ＝ `n_trials` に数えない ＝ 検証結果一覧に出ない**（rules.md 19-1 の 8）。",
  "机上の検証は対の検知器 `L0 入口のみ（損切りなし）`・`L1 高値20日から−N%で降りる`・`L2 高値20日からσのN倍で降りる`・`L3 先10日の下げを学んで降りる`（入口 ＝ own Ridge・出口 ＝ max(100 − 入口%, 規則)）と、形 B `〔買値から−N%〕`（`simulate(stop_loss_pct=…)`）・基準線 `〔N日で降りる〕`（config `trade_own_stop_ridge_a`・rules.md 19 章・stoploss-as-model.md §0）。θ 50 ／ 55 ／ 60 × 11 行 ＝ 33 検証・n_trials 703 → 736。",
  "候補の人 `T5` は `[[models]]` ＝ `trade_own_ridge_a`（全部使う（基準））＋ `trade_own_stopexit_a`（X1 −10%）を `combine = \"unanimous\"`（買い ＝ min ＝ 主モデル・出口 ＝ max）で合わせる（K2）。水準を X1 −10% にしたのは L1〜L3 のまん中の水準で、Phase 3 の `cli.predict` で実測できた本（記録 §7）。⚠ 水準の良し悪しで選んでいない（全部落とす）。",
]

[model.detail.how]
text = [
  "X1: `dd20 = close / rolling_max(close, 20) − 1`（表の `own_trend20_dd` 相当）。`dd20 ≤ −N%` なら出口% 100、でなければ 0。X2: `dd20 ≤ −k · σ20`（σ20 ＝ 20 日の日次リターンの標準偏差）。X3: `fwd.forward_gate` で P(y_fwd_10 ≤ 0) を Ridge ＋ Platt で学ぶ（出口% ＝ 100 · P）。",
  "本番の合わせ方は執行器の `trader.combine(\"unanimous\")`（`trader.py`）: 買い% ＝ min（出口だけのモデルは 100 なので主モデルの値）・出口% ＝ max。机上の対の検知器は同じ max を 1 本の中でやる ＝ 机上と本番で同じ規則を見る（stoploss-as-model.md §7 の図）。",
  "⚠ 同じ実験名で `--method` を替えて同じ日に 2 度流すと `predict.jsonl` は後の 1 本だけ残る（(日付, 実験名) で置き換え）＝ 1 人の中で使う水準は 1 本。",
]

[model.detail.score]
text = [
  "【実測 asof 2026-09-04・研究用の `data/`】`cli.predict --experiment trade_own_stopexit_a --method \"X1 出口だけ 高値20日から−10%で降りる\"`: 63 行・`buy` 全行 100・`exit` 100 が 4 銘柄（AVGO・CSCO・HON・LLY ＝ 机上の対の検知器 L1 で「規則が立つ行」と一致）・残り 0。表 34 秒 ＋ fit 0.01 秒。X3 は `exit` 44.9〜52.2（H1 の補数）。訓練は 2026-08-20 まで（`split_asof` の直し）。",
  "机上（θ=50・L0 ＝ 取引 1,099 回/fold・保有日率 0.73）: L1 −5% は取引 3,310 回/fold（対 L0 −351bp ＝ 粗利 −176 ＋ 費用 ＋176）／ L2 σ×2 は −534bp（粗利 −238 ＋ 費用 ＋297）。門は 8 本とも門前（入口が 1 本なので同じ値。AUC 0.483・幅 2.5 点）。",
]

[model.detail.result]
text = [
  "2026-09-27（n_trials 703 → 736）: 33 検証 ＝ 全部落とす（採る 0 ／ 保留 0）。損切りを足した 27 行のうち θ=50 ／ 55 の 18 行が全部、L0 より純利の平均が低い。fold 5/5 で負なのは 4 行（θ=50 の L2 σ×4・θ=55 の 買値−5%・L2 σ×2・L2 σ×4）。θ=60 は 1 年に十数回しか建てないので差がほぼ 0。leak 対照は全行で跳ねた（＋22,084bp・t 17.4）。",
  "減ったのは「最悪の 1 取引」と「高値からの規則の最大ドローダウン」だけ。形 B（買値から）は θ=50 で最大ドローダウンを悪化させた（−3,815 → −4,216bp）。⚠ これは「損切りは無駄」の証明ではなく「情報の無い入口に損切りを足しても純利は増えなかった」（stoploss-as-model.md §1・§4）。",
]
