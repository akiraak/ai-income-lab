# vibeboard の「システム説明」タブ（先頭のタブ）の言葉の正本（docs/specs/dashboard.md §18）。
#
# このシステムの概要。⚠ **概要の 1 ページだけ**（2026-09-21 の利用者の指示「システム説明は概要だけにする」）。
# ⚠ モデルの話（モデルを作る ／ 過去のデータで確かめる ／ 実際の売買で使う ／ 名前と識別名）は「予測モデル」タブのしくみのページ
#    （models.toml の [[page]]）へ移した。ここにはモデルでない話（実際の売買で守っていること）を短く残す。
# ⚠ **説明を Python や HTML に書かない**（glossary.toml・models.toml と同じ考え方）。文を直すならこのファイルだけ。
# ⚠ **両方を並べる**: 本文（`lead`・`text`・`points`・`after`・`note`・`table`・図の箱の文字）は**やさしい言葉**で書く
#    （使わない語は tests/test_traders_tab.py の FORBIDDEN ＝ dashboard.md §16-2 の表。テストが見る）。
#    用語・正式な名前・コードの場所・細かい数字と出典は **`detail`・`detail_points`・`detail_table`（画面では「詳しく（用語あり）」の囲み。⚠ 畳まない・いつも開いている）にだけ**書く。
# ⚠ **本文に実売買の設定の数字（予算・売買基準値・見る株の本数）と `$` を書かない**（設定が変わると嘘になる。トレーダーのタブが設定から写す）。
# ⚠ **売買結果（損益・注文・約定・持ち高）は書かない**。⚠ 検証結果一覧の合計は画面が `ledger.md` から読む（`ledger = true` の段。ここに書き写さない）。
# ⚠ **確かめた事実だけを書く**（出どころは規約 rules.md・記録 docs/specs/experiments/・コード）。仕組みを変えたら該当の段を読み直す。
# ⚠ 図: 1 図 1 主張（`claim` は図の直前に出る）・箱は 12 個以内。`kind = "flow"`（箱と矢印）／ `"folds"`（期間を分けて試す図）。
#
# 形: [[page]]（id・label・sub・title・lead）→ [[page.section]]（title・text・points・after・note・models・ledger・links・
#     detail・detail_points・detail_links）→ [page.section.figure] ／ [page.section.table] ／ [page.section.detail_table]。
#     ⚠ TOML の決まりで、段の平の項目（title や detail）は [page.section.figure] などの小さな表より**上**に書く。
#     links の形 ＝ { label = "…", doc = "docs/…" } か { label = "…", tab = "models|traders|system|glossary|experiments|data", item = "…" }。

[common]
detail_label = "詳しく（用語あり）"
other_pages = "ほかのページ"

