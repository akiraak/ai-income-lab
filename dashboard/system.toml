no_live_models = "いま実際の売買の設定に出てくるモデルはありません。"
ledger_rows = "試した形（行）"
ledger_adopt = "採る"
ledger_hold = "保留"
ledger_drop = "落とす"
ledger_note = "過去のデータで試した結果の検証結果一覧から写した合計（検証結果一覧を作った日 {date}）。検証結果一覧を作り直すと、この数字も変わる。"

