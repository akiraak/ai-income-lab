# vibeboard の「トレーダー」タブの、人の側の言葉の正本（docs/specs/dashboard.md §16）。
#
# ⚠ **主役はモデル**（利用者の指示 2026-09-20「使用するモデルを表示して、それの特性を書くかたちにする」）。
#    ⚠ **モデルの解説（特性・見るもの・点の出し方・印の文）は `dashboard/models.toml` の `[[model]]` にある**（2026-09-20 に移した。
#    「予測モデル」タブと同じ 1 本。dashboard.md §17）。ここに書くのは人の側 ＝ 呼び名・いつ・いくら・売買基準値の文・共通の注意。
#    画面はトレーダー 1 人 1 ページだけ（人数を数えない・見くらべるページを作らない ＝ 利用者の指示）。
#    ⚠ トレーダーは増えたり減ったりする（1 人のときも 10 人のときもある）。⚠ **ほかの人・ほかのモデルとくらべる文を書かない**
#    （「3 人の中でいちばん」「〜より少ない」など。人数が変わると嘘になる）。
# ⚠ **説明を Python や HTML に書かない**（用語タブの glossary.toml と同じ考え方）。文を直すならこのファイルか models.toml だけ。
# ⚠ **やさしい言葉で書く**: 本文では専門用語を使わない（使わない語の一覧は tests/test_traders_tab.py の FORBIDDEN。
#    足すときは dashboard.md §16-2 の表と一緒に直す）。用語は画面の「正式な名前」にだけ出る（設定から写す）。
# ⚠ **数字を書かない**: 予算・売買基準値・売買する株の本数と名前・1 本あたりの金額は実売買の設定
#    （experiments/live-trading/config/traders/）から写す。文の中の {budget} {n} {per} {line} {sell} {k} {symbols} は画面が埋める。
# ⚠ **売買結果（損益・注文・約定・持ち高・回数）は書かない・出さない**（利用者の指示 2026-09-20）。
# ⚠ **共通のしくみはここに書かない**（2026-09-26。設定の説明の Step 6）: 4 つの集合・選び方の考え方・規模 A ／ B・上限と含み損と停止・
#    設定項目の意味は「システム説明」の「トレーダーのしくみ」（system.toml の [[page]] trader）が正本。ここは 1 人のページに要る文と、
#    そこへの案内（stocks_link・common_link）だけ。

# 呼び名: 識別名（設定のファイル名）→ 画面に出す名前。⚠ **意味の無い名前にする**（利用者の決定 2026-09-20。性質に由来する
#    名前だと、少し違うタイプの人を足すときに困る）。記録と設定の識別名は変えない。無い人は識別名のまま出る。
#    ⚠ 一度付けた呼び名は変えない・使い回さない。モデルや売買基準値を替えるのは「新しい人」＝ 新しい識別名と新しい呼び名。
[nicks]
T1 = "アキ"
T2 = "アリス"
T3 = "カエデ"
# 候補の人（2026-09-27 利用者決定 K6。設定は config/traders/candidates/multi/。本番に入れるかは 10/20 の後に利用者が決める）
T4 = "ハル"
T5 = "ミオ"
# 候補の人（2026-10-01 利用者決定「ソラで」。設定は config/traders/candidates/best/。本番に入れるかは 10/20 の後に利用者が決める）
T6 = "ソラ"

# 売買する株を選んだ理由（識別名 → 文。2026-09-26）。⚠ **人ごと**に持つ: いまの 3 人は同じ決め方（利用者決定 D3・2026-09-20 ＝
#    会社株のうち終値の低い順・live-trading.md §0-1）だが、次の人は別の選び方でよいので、共通の文にしない（人が替わると嘘になる）。
#    無い人には出ない。⚠ 本数・株の名前・値段を書かない（画面が設定から写す ＝ {symbols}）。選び方の一般論は「トレーダーのしくみ」。
[symbols_why]
T1 = "少ない予算でも 1 株単位で買えるように、モデルが出力スコアを出す会社の株のうち、決めた日の値段の低い順に選んである。動かす前に決め、結果を見て入れ替えない。"
T2 = "少ない予算でも 1 株単位で買えるように、モデルが出力スコアを出す会社の株のうち、決めた日の値段の低い順に選んである。動かす前に決め、結果を見て入れ替えない。"
T3 = "少ない予算でも 1 株単位で買えるように、モデルが出力スコアを出す会社の株のうち、決めた日の値段の低い順に選んである。動かす前に決め、結果を見て入れ替えない。"
# 候補の 2 人（2026-09-28）: 配線を確かめる人なので、いま動いている人と同じ選び方の同じ株にしてある（株を変えると、モデルを合わせた違いと株の違いが混ざる）
T4 = "モデルを合わせる配線を確かめるための人なので、株はいま動いている人と同じ選び方（会社の株のうち、決めた日の値段の低い順）にしてある。株を変えると、モデルを合わせた違いと株の違いが混ざって読めなくなる。"
T5 = "損切りのモデルを合わせる配線を確かめるための人なので、株はいま動いている人と同じ選び方（会社の株のうち、決めた日の値段の低い順）にしてある。株を変えると、損切りを足した違いと株の違いが混ざって読めなくなる。"
T6 = "過去のデータで試した結果の一覧から選んだモデルを、いま動いている人と同じ形で動かせるかを確かめるための人なので、株はいま動いている人と同じ選び方（会社の株のうち、決めた日の値段の低い順）にしてある。机上の確かめも同じ 5 本で行った。"

[common]
when = "1 日 1 回だけ、取引が終わる直前（ニューヨーク時間の 15:50 ごろ）に動く。その時の値段までを見て出力スコアをつけ、買う・売るが決まったら、その場で注文を出す。しばらく待っても買えなかった注文は取り消す。日中は何もしない。"
money = [
  "どの株にも同じ金額しか入れない（出力スコアが高くても多く買わない）。",
  "買って持つか、売って現金に戻すかの 2 つだけ。値下がりでもうける売り方（空売り）はしない。",
  "売ったお金は、次の日まで次の買いに使わない（決まりで 1 日待つ）。",
  "最初の日は何も持っていないので、売買基準値を上回った株をまとめて買う。そのため最初の日は注文が多い。",
]
amount_one = "予算は {budget}。売買する株 {n} 本で等しく割るので、1 本あたり {per} まで。"
buy_way_notional = "金額を決めて買う。値段の高い株でも、1 株に満たない分だけ買える。"
buy_way_shares = "1 株単位で買う。1 本あたりの金額で 1 株も買えない株は見送る。"
# 予算の規模（2026-09-26）。画面に出る予算は口座で実際に使える規模のもの。大きい規模の数字と「使えない可能性」の説明は「トレーダーのしくみ」
budget_scale = "この予算は、口座に実際に入っているお金の範囲で決めた規模のもの。もっと大きな規模で数字を出すこともあるが、そちらは実際の取引では使えない可能性がある（「トレーダーのしくみ」の予算の規模）。"

# どの株を（2026-09-26。4 つの集合のいちばん内側 ＝ 売買する株）。{symbols} は設定の株の名前の並び。
# 使うモデルが出力スコアを出す株は models.toml の [[model]] sets.output を写す（札の見出しが stocks_model_output）
stocks_one = "売り買いするのは {n} 本: {symbols}。"
stocks_vs_model = "使うモデルが出力スコアを出す株は、これより多くてよい。この人は、その中からこの {n} 本だけを売り買いする。出力スコアの無い株は、売り買いしたくてもできない。"
stocks_model_output = "使うモデルが出力スコアを出す株"
stocks_link = "売買する株の選び方の考え方と、4 つの集合（材料に入れるもの ／ 学ぶ株 ／ 出力スコアを出す株 ／ 売買する株）のちがいは「トレーダーのしくみ」へ"

# 学ぶ範囲の終わり ＝ 「次の日に上がったか」の答えがもう確かめられている日まで（2026-09-26 に「昨日まで」を直した。
# 答えは次の日の終わりの値段が要るので、直近の日は学ぶ側に入らない。予測モデルのしくみ・実際の売買のページと同じ言い方）
step_learn = "毎日、2018 年から、「次の日に上がったか」の答えがもう確かめられている日までの全部の日を見直して、「次の日に上がった日は、その前にどんな数字だったか」を学び直す。答えのまだ出ていない直近の日は、学ぶ側には入れない。"
step_score = "今日の数字から、株 1 本ごとに「出力スコア」（この先上がりそうかを 0〜100 で表した数。高いほど上がりそう。いまのモデルは明日を当てにいく）をつける。まん中の 50 は「どちらとも言えない」。"
line_same = "売買基準値は {line}。出力スコアが {line} を上回ったら買い、{line} を下回ったら売る。待つ幅が無いので、出力スコアが売買基準値の上下を行き来するたびに売り買いが入れ替わる。"
line_band = "売買基準値は {line}。出力スコアが {line} を上回ったら買い、100 − {line} ＝ {sell} を下回ったら売る。{sell}〜{line} のあいだは何もしない（持っていればそのまま、持っていなければ買わない）。"
ruler_sell = "売る"
ruler_wait = "何もしない"
ruler_wait_short = "待つ"          # 帯が狭くて「何もしない」が入らないとき
ruler_buy = "買う"
combine_asis = "モデルは 1 本だけ。その出力スコアをそのまま使う。"
combine_mean = "{k} 本のモデルの出力スコアを平均して、1 つの出力スコアにする。"
combine_majority = "{k} 本のモデルのうち、半分より多くが「買い」なら買う（売りも同じ）。"
# ⚠ unanimous は 買い ＝ 全員（min）・売り ＝ どれか 1 本（max）。2026-09-28 に「売りも同じ」を直した（出口だけを言うモデルを合わせる形 ＝ howto-model-trader.md §2）
combine_unanimous = "{k} 本のモデルが全部そろって「買い」のときだけ買う。売りは、どれか 1 本が「売り」と言えば売る。"

# ⚠ 「まだ確定していない」の帯（unsettled）は 2026-09-26 に消した（2026-09-21 に確定して役目を終えた。候補の人は「正式な名前」の「（候補）」だけ）
limit_common = "過去のデータで試したかぎり、このやり方が「何もせずただ持ち続ける」より良いとは言えていない。"
limit_purpose = "この実売買は、もうかるかを確かめるものではない。注文が計画どおりに出て、計画どおりの値段で買えるかを確かめるもの。"
limit_survivor = "モデルが学ぶ株は、いま大きい会社から選んである。過去に消えた会社が入っていないので、過去のデータでの成績は実力より良く見える。"
# 共通のしくみへの案内と「変えるときは新しい人」（2026-09-26）。しくみの中身は書かない（正本は「トレーダーのしくみ」）
limit_stop = "予算の上限・大きな含み損の警告・停止ボタンは、どのトレーダーにも共通の仕掛け。含み損は警告が出るだけで、止めるのは人。"
limit_change = "モデル・売買基準値・売買する株・予算・買い方のどれかを変えるときは、この人の設定を書き換えず、新しい識別名と新しい呼び名で「新しい人」を作る。この人の記録はそのまま残る。"
common_link = "共通のしくみ（上限・含み損・停止・規模・設定の項目の意味）は「トレーダーのしくみ」へ"

# 「正式な名前」の段（畳んである表）の項目の横に出す一言（2026-09-26）。⚠ やさしい言葉で（用語は項目名の側に出ている）
[common.formal_hint]
model = "設定に書いてあるモデルの名前（実験の名前と、数字の選び方・作り方の名前）"
line = "出力スコアの境目。これを上回ったら買い、100 からこれを引いた値を下回ったら売る"
combine = "モデルが 2 本以上のときの合わせ方（1 本なら「そのまま」）"
stocks = "売買する株の名前の並びと本数"
sizing = "1 株単位で買うか、金額を決めて買うか"
budget = "使ってよいお金の上限（口座で実際に使える規模のもの）"
file = "この人の設定が書いてあるファイル（名前が識別名）"
