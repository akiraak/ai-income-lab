# vibeboard の「トレーダー」タブの言葉の正本（docs/specs/dashboard.md §16）。
#
# ⚠ **主役はモデル**（利用者の指示 2026-09-20「使用するモデルを表示して、それの特性を書くかたちにする」）。
#    特性は `[[model]]` に書く。画面はトレーダー 1 人 1 ページだけ（人数を数えない・見くらべるページを作らない ＝ 利用者の指示）。
#    ページは「この人が使うモデル」を設定から引いて、その特性を写す。
#    ⚠ トレーダーは増えたり減ったりする（1 人のときも 10 人のときもある）。⚠ **ほかの人・ほかのモデルとくらべる文を書かない**
#    （「3 人の中でいちばん」「〜より少ない」など。人数が変わると嘘になる）。1 つのモデルだけを読んで分かる文にする。
# ⚠ **どこまで確かかを必ず付ける**（`basis`）: build ＝ 作りから言えること（コードと設定を読めば分かる）／
#    trial ＝ 試し運転で見えたこと（シミュレーションと過去のデータでの試し。本番で同じとは限らない）／ guess ＝ 見立て（確かめていない）。
#    ⚠ 確かめていない理由を言い切らない。
# ⚠ **説明を Python や HTML に書かない**（用語タブの glossary.toml と同じ考え方）。文を直すならこのファイルだけ。
# ⚠ **やさしい言葉で書く**: 本文では専門用語を使わない（使わない語の一覧は tests/test_traders_tab.py の FORBIDDEN。
#    足すときは dashboard.md §16-2 の表と一緒に直す）。用語は画面の「正式な名前」にだけ出る（設定から写す）。
# ⚠ **数字を書かない**: 予算・買う線・見る株の本数・1 本あたりの金額は実売買の設定
#    （experiments/live-trading/config/traders/）から写す。文の中の {budget} {n} {per} {line} {sell} {k} は画面が埋める。
# ⚠ **売買結果（損益・注文・約定・持ち高・回数）は書かない・出さない**（利用者の指示 2026-09-20）。
# ⚠ **1 項目は 1〜2 行まで**。理由は `why`（小さい字で下に出る）に分ける。

# 呼び名: 鍵（設定のファイル名）→ 画面に出す名前。⚠ **意味の無い名前にする**（利用者の決定 2026-09-20。性質に由来する
#    名前だと、少し違うタイプの人を足すときに困る）。記録と設定の鍵は変えない。無い人は鍵のまま出る。
#    ⚠ 一度付けた呼び名は変えない・使い回さない。モデルや買う線を替えるのは「新しい人」＝ 新しい鍵と新しい呼び名。
[nicks]
T1 = "アキ"
T2 = "アリス"
T3 = "カエデ"

[common]
card_sees = "見るもの"
card_decides = "決め方"
basis_build = "作りから"
basis_trial = "試し運転で見えた"
basis_guess = "見立て"
basis_note = "印の意味 — 作りから: コードと設定を読めば分かること ／ 試し運転で見えた: シミュレーションや過去のデータで試したときに見えたこと。本番で同じになるとは限らない ／ 見立て: まだ確かめていない考え。"

when = "1 日 1 回だけ、取引が終わる直前（ニューヨーク時間の 15:50 ごろ）に動く。その時の値段までを見て点をつけ、買う・売るが決まったら、その場で注文を出す。しばらく待っても買えなかった注文は取り消す。日中は何もしない。"
money = [
  "どの株にも同じ金額しか入れない（点が高くても多く買わない）。",
  "買って持つか、売って現金に戻すかの 2 つだけ。値下がりでもうける売り方（空売り）はしない。",
  "売ったお金は、次の日まで次の買いに使わない（決まりで 1 日待つ）。",
  "最初の日は何も持っていないので、買う線を上回った株をまとめて買う。そのため最初の日は注文が多い。",
]
amount_one = "予算は {budget}。見る株 {n} 本で等しく割るので、1 本あたり {per} まで。"
buy_way_notional = "金額を決めて買う。値段の高い株でも、1 株に満たない分だけ買える。"
buy_way_shares = "1 株単位で買う。1 本あたりの金額で 1 株も買えない株は見送る。"

step_learn = "毎日、2018 年から昨日までの全部の日を見直して、「次の日に上がった日は、その前にどんな数字だったか」を学び直す。"
step_score = "今日の数字から、株 1 本ごとに「明日上がりそうかの点」を 0〜100 でつける。まん中の点は「どちらとも言えない」。"
line_same = "点が {line} を上回ったら買い、{line} を下回ったら売る。待つ幅が無いので、点が線の上下を行き来するたびに売り買いが入れ替わる。"
line_band = "点が {line} を上回ったら買い、{sell} を下回ったら売る。{sell}〜{line} のあいだは何もしない（持っていればそのまま、持っていなければ買わない）。"
ruler_sell = "売る"
ruler_wait = "何もしない"
ruler_wait_short = "待つ"          # 帯が狭くて「何もしない」が入らないとき
ruler_buy = "買う"
combine_asis = "モデルは 1 本だけ。その点をそのまま使う。"
combine_mean = "{k} 本のモデルの点を平均して、1 つの点にする。"
combine_majority = "{k} 本のモデルのうち、半分より多くが「買い」なら買う（売りも同じ）。"
combine_unanimous = "{k} 本のモデルが全部そろって「買い」のときだけ買う（売りも同じ）。"
no_words = "このモデルの説明はまだ書かれていません（dashboard/traders.toml に足す）。"

unsettled = "見る株と買い方はまだ確定していません。月曜に証券会社で「少額の金額指定の注文が通るか」を確かめて決まります。下は通った場合の形です。通らなければ、値段の低い 5 本を 1 株単位で買う形になります。"
limit_common = "過去のデータで試したかぎり、このやり方が「何もせずただ持ち続ける」より良いとは言えていない。"
limit_purpose = "この実売買は、もうかるかを確かめるものではない。注文が計画どおりに出て、計画どおりの値段で買えるかを確かめるもの。"
limit_survivor = "見る株は、いま大きい会社から選んである。過去に消えた会社が入っていないので、過去のデータでの成績は実力より良く見える。"

# ---------------------------------------------------------------- モデル（特性を書くのはここ）
# `name`（と `method`）は実売買の設定の [[models]] と同じ綴り。⚠ ここだけは正式な名前のまま（本文の検査の外）。

[[model]]
name = "trade_own_ridge_a"
method = "全部使う（基準）"
label = "値動きの数字を足し合わせる型"
summary = "その株自身の最近の値動きを表す 35 個の数字に、重みをかけて足し合わせて点を出す。ほかの株も、世の中の数字も見ない。"
card = { sees = "その株の値動きだけ", decides = "数字に重みをかけて足す" }
traits = [
  { text = "買う線がまん中にあると、売り買いの回数が多くなりやすい。", why = "点がまん中のすぐ近くに集まり、少しの値動きで線をまたぐためと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "「この数字が大きいほど上がりやすい」という、まっすぐな関係しか使えない。", why = "足し算で点を出す作りのため。数字どうしの組み合わせ（両方そろったときだけ、など）は拾えない。", basis = "build" },
  { text = "株どうしをくらべて選ぶことはしない。", why = "どの株の点も、その株自身の過去だけから出るため。", basis = "build" },
]
sees = [
  { label = "上がり下がり", items = ["ここ 1 日〜60 日でどれだけ上がり下がりしたか"] },
  { label = "荒さ", items = ["日々のぶれの大きさ", "1 日の高値と安値の幅"] },
  { label = "いまの位置", items = ["最近の平均とくらべて高いか低いか", "最近の高値と安値の幅の中でどのあたりか"] },
  { label = "売買された量", items = ["ふだんとくらべて多いか少ないか"] },
  { label = "値動きの形", items = ["上と下のどちらに偏っているか", "極端な日が多いか", "前の日の動きを引きずるか"] },
  { label = "その日の足と暦", items = ["始まりと終わりの値の差、上下のひげ", "曜日"] },
]
how = "見ている 35 個の数字それぞれに重みをかけて足し合わせ、1 つの点にする。重みは過去から学ぶ。"
limits = []

[[model]]
name = "trade_ownex_lgbm_a"
method = "全部使う（基準）"
label = "世の中の数字も入れて、枝分かれで決める型"
summary = "会社の株だけに点をつける。値動きに加えて、ほかの株とくらべた位置や、為替・金利・天気・地震も見て、「もし〜なら」の枝分かれをたくさん重ねて点を出す。"
card = { sees = "値動き ＋ ほかの株 ＋ 為替・金利など", decides = "「もし〜なら」の枝分かれを重ねる" }
traits = [
  { text = "同じ日のどの株にも、ほとんど同じ点をつける。", why = "過去のデータで試すと、ほとんどの日でそうなった。為替や金利は全部の株で同じ値なので、点が「どの株か」より「どんな日か」で決まってしまうためと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "そのため、見る株を全部いっぺんに買うか、1 本も買わないかになりやすい。何日も 1 本も買わなくても、故障ではない。", why = "どの株の点もほぼ同じなので、買う線を上回るときは全部が上回り、届かないときは全部が届かない。", basis = "trial" },
  { text = "足し算では表せない組み合わせ（金利が上がっていて、かつ値動きが荒いときだけ、など）も拾える。そのぶん、過去のたまたまを覚えこみやすい。", why = "枝分かれを重ねる作りのため。", basis = "build" },
  { text = "天気や地震の数字が 8 日より古くなると、その日は点がつけられず何もしない。", why = "これらの数字は発表が 3〜4 日遅れる。古すぎる数字では点を出さない決まりにしてある。", basis = "build" },
]
sees = [
  { label = "その株の値動き", items = ["上がり下がり・荒さ・いまの位置・売買された量・値動きの形（35 個の数字）"] },
  { label = "ほかの株とのくらべ", items = ["今日の上がり方は全体の中で何番目か", "全体のうち何割が上がったか"] },
  { label = "市場とのくらべ", items = ["市場全体やその業種が動いたぶんを引いた、その株だけの動き"] },
  { label = "為替と金利", items = ["ユーロに対するドル・円・ポンドなど 7 つの通貨の値段", "アメリカの金利（1 か月ものから 30 年ものまで）"] },
  { label = "天気と地震", items = ["最高・最低気温、雨の量", "地震の回数と、いちばん大きい揺れ"] },
]
sees_note = "株の外の数字は、1 日以上前に発表されたものだけを使う（今日まだ知り得ない数字を使わないため）。株の詰め合わせ商品（ETF）には点をつけない。"
how = "「もしこの数字がこれより大きく、あの数字がこれより小さければ…」という枝分かれを、たくさん重ねて点を出す。"
limits = [
  "株を選んでいるように見えて、実際には「今日は買う日か、買わない日か」しか決めていない（試し運転で見えたこと）。",
]

[[model]]
name = "trade_ownseq_ridge_a"
method = "T3 QUANT（60日窓）"
label = "過去 60 日の線の形を読む型"
summary = "過去 60 日の値動きを 1 本の線として見て、その形から点を出す。数字を 1 つずつ見るのではなく、線の形そのものを読む。"
card = { sees = "過去 60 日の値動きの線", decides = "線を区切って、高い・低いを測る" }
traits = [
  { text = "点が日ごとに急には動きにくく、いちど買うと持ち続ける株が多くなりやすい。", why = "60 日の線は 1 日たっても 1 つずれるだけで、形がほとんど変わらないためと見られる（理由は確かめていない）。", basis = "trial" },
  { text = "「じわじわ上がってきた」「急に落ちてから戻した」といった線の形を、数字に直して読む。", why = "線を区切って測る作りのため。", basis = "build" },
  { text = "線の形から数百個の数字を作るので、過去のたまたまの形を覚えこみやすい。", why = "見る数字が多いほど、たまたま当たった形を拾いやすい。", basis = "build" },
  { text = "株どうしをくらべて選ぶことはしない。", why = "どの株の点も、その株自身の過去だけから出るため。", basis = "build" },
]
sees = [
  { label = "過去 60 日の線", items = ["毎日の上がり下がりを 60 日ぶん並べたもの（60 個の数字が 1 本の線になる）"] },
]
how = "60 日の線を、長い区間から短い区間までいくつにも区切る。区切ったそれぞれで「高いほうの値・低いほうの値はどのくらいか」を測り、数百個の数字にする。その数字に重みをかけて足し合わせ、1 つの点にする。"
limits = []
