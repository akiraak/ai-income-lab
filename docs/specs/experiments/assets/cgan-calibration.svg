<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img"><title>確率の校正図</title><desc>上昇確率の帯ごとの予想と実際、区間の名目と実際の被覆率</desc><style>
