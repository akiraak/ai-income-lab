  }
</style><rect class="bg" width="860" height="430"/><text class="t ink" x="24" y="30">確率と区間は、実際の頻度と合っているか（テストの 5 塊・2,512 起点）</text><text class="ink2" x="24" y="50">左は対角線、右は横線に近いほどよい。印の大きさは件数。重なった 5 日予測なので、独立な観測はおよそ 1/5</text><text class="ink2" x="24" y="68">⚠ 20 件未満の帯は描いていない（記録の表には件数つきで全部ある）</text><circle class="s1" cx="29" cy="88" r="5"/><text class="ink2" x="40" y="92">cGAN（種 3 つの平均）</text><circle class="s2" cx="225" cy="88" r="5"/><text class="ink2" x="236" y="92">履歴ベース</text><circle class="s3" cx="313" cy="88" r="5"/><text class="ink2" x="324" y="92">軽量モデル</text><line class="grid" x1="64" x2="394" y1="356.0" y2="356.0"/><text class="tick mut" x="56" y="360.0" text-anchor="end">30%</text><line class="grid" x1="64" x2="394" y1="317.7" y2="317.7"/><text class="tick mut" x="56" y="321.7" text-anchor="end">40%</text><line class="grid" x1="64" x2="394" y1="279.3" y2="279.3"/><text class="tick mut" x="56" y="283.3" text-anchor="end">50%</text><line class="grid" x1="64" x2="394" y1="241.0" y2="241.0"/><text class="tick mut" x="56" y="245.0" text-anchor="end">60%</text><line class="grid" x1="64" x2="394" y1="202.7" y2="202.7"/><text class="tick mut" x="56" y="206.7" text-anchor="end">70%</text><line class="grid" x1="64" x2="394" y1="164.3" y2="164.3"/><text class="tick mut" x="56" y="168.3" text-anchor="end">80%</text><line class="grid" x1="64" x2="394" y1="126.0" y2="126.0"/><text class="tick mut" x="56" y="130.0" text-anchor="end">90%</text><text class="tick mut" x="64.0" y="372" text-anchor="middle">30%</text><text class="tick mut" x="119.0" y="372" text-anchor="middle">40%</text><text class="tick mut" x="174.0" y="372" text-anchor="middle">50%</text><text class="tick mut" x="229.0" y="372" text-anchor="middle">60%</text><text class="tick mut" x="284.0" y="372" text-anchor="middle">70%</text><text class="tick mut" x="339.0" y="372" text-anchor="middle">80%</text><text class="tick mut" x="394.0" y="372" text-anchor="middle">90%</text><line class="axis" x1="64" x2="394" 