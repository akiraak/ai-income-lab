# 1 銘柄 3 系列（時刻 ＝ 提出日）: ANN_<銘柄>（8-K Item 2.02 の提出日に 1）／ EPSYOY_<銘柄> ／ REVYOY_<銘柄>（前年同期比・対称な変化率）。
