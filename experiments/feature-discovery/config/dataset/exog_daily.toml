# ⚠ **外部の日次系列**（足ではない。1 値の時系列）。
#
# ⚠ **枠を取得の時点で宣言する**（本命 / 偽薬）。結果を見てから分類すると後付けになる
# （[plan §1-1](../../../../docs/plans/daily-data-sources.md)）。
#
# ⚠ **どれも鍵が要らず、権利の制限が無いものだけを並べている。**
# ⚠ **FRED は規約が「抽出をするな」と書いているので入れていない**（判断待ち）。
# ⚠ **SILSO の黒点は CC BY-NC（非商用のみ）なので入れていない**（判断待ち）。
name = "exog_daily"
period = "d"

[[series]]
source = "ecb"
role = "本命"                      # 為替（利用者の指名）
ids = ["USD", "JPY", "GBP", "CHF", "CNY", "AUD", "CAD"]
note = "対ユーロの参照相場。⚠ 中央欧州時間 14:15 ごろの 1 日 1 回の値で、取引の終値ではない"

[[series]]
source = "treasury"
role = "本命"                      # 米国債のイールドカーブ
ids = ["1 Mo", "3 Mo", "1 Yr", "2 Yr", "5 Yr", "10 Yr", "30 Yr"]
years = [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

[[series]]
source = "noaa"
role = "偽薬"                      # ⚠ 値動きと因果を想定しない
ids = ["TMAX", "TMIN", "PRCP"]
stations = ["USW00094728", "USW00023174", "USW00094846"]   # NY セントラルパーク / ロサンゼルス / シカゴ
start = "2018-01-01"
end = "2026-09-01"
note = "⚠ 10 分の 1 度・10 分の 1 mm 単位の整数のまま置く（GHCN-Daily の仕様）"

[[series]]
source = "usgs"
role = "偽薬"                      # ⚠ 値動きと因果を想定しない
ids = ["count", "maxmag"]
start = "2018-01-01"
end = "2026-09-01"
minmagnitude = 5.0
