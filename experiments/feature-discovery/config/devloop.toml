# ⚠ **開発ループ（devloop）の設定**（プラン docs/plans/daily-dev-loop.md §3・利用者決定 2026-10-25「推す案で」＝ K1〜K8）。
# アイデア出し → 作る → 机上で検証 → 選ぶ の 1 周を titan で毎晩 1 回回す運転手の、数と置き場。
# ⚠ **ここに書くのは数と置き場だけ**。規約（登録簿 ＝ 事前固定・数え方・選ぶ段・打ち切り）は rules.md 31 章。
# ⚠ **値を変えるのは利用者**（r・N・予算は晩ごとに日誌に記録される ＝ 後から「いつ変えたか」が分かる）。

[ideation]                      # 段 1（K1）
reference_pct = 30              # 参考の度合い r%: 1 晩 N 本のうち、既存の記録・検証結果一覧・規約を読んで出す本数の割合
ideas_per_night = 5             # N。参考あり ＝ round(N × r / 100) ＝ 2 本・参考なし ＝ 3 本（記録を読まずに出す）
prompts = "devloop/prompts"     # 正本: contract.md（共通の契約）＋ ideate_ref.md ／ ideate_free.md
max_turns = 40                  # claude -p の上限（段 1）
budget_split = { ref = 0.7, free = 0.3 }   # 段 1 の上限を 参考あり ／ 参考なし に分ける割合（実測 $3.82 ／ $1.42 ＝ dev-loop.md §1-1）
max_budget_usd = 6.0            # 段 1 の費用の上限（K4。✅ 2026-10-25 利用者「推しで」＝ $2 → $6。実測 $5.24/晩 ＝ dev-loop.md §1-1。⚠ 上限に当たると結果は 1 文字も返らない）
contract = 3                    # 段 1 の契約の版（2 ＝ 枠の内 ／ 外・確率つきの予想・差なしで分かること ＝ rules.md 31-6。2026-11-01 利用者「推す案で進めて」／ 3 ＝ ＋ 要る効果の大きさ needed_effect ＝ 31-6 の 5。2026-11-13 利用者「推す案で進めて」）
outside_frame_min = 2           # 1 晩に枠の外の案を何本以上（参考なしの束に求める。届かなくても止めない ＝ 日誌に書く）
similar_top = 3                 # 「似た過去の案」を何本出すか（題名 ＋ 問いの文字の近さ・より前の日付の案だけ。⚠ 表示だけ ＝ 状態は変えない。0 ＝ 出さない。2026-11-13 利用者「Aで進めて」）

[build]                         # 段 2（K3: 試運転は人の手。7 晩通ったら claude -p）
mode = "manual"                 # "manual" ＝ 段 2 は人の手（朝に Claude のセッションで）／ "claude" ＝ claude -p
tools = ["Read", "Grep", "Glob", "Write", "Edit"]   # 段 2 を claude -p で呼ぶときの道具（Bash は渡さない ＝ テストは運転手が流す）
max_turns = 60
max_budget_usd = 5.0            # 段 2 の費用の上限（K4。1 晩の合計 ≈ $11 ＝ 段 1 $6 ＋ 段 2 $5）
retries_per_idea = 2            # 同じ id を直して回し直すのは翌晩まで（合計 2 回）

[run]                           # 段 3（cli.queue。既存の器）
time_budget_s = 5400            # 1 晩 ≤ 3 時間のうち段 3 の上限（K4）
max_failures = 1
leak = true                     # ⚠ 切らない（配線の穴に気づく唯一の手）
ledger = true                   # 終わったら検証結果一覧を吐き直す
max_trials_per_night = 12       # 1 晩に数える検証数の上限（K4）
heavy_per_night = 1             # 30 分を超えると見積もる形（tsfresh・PatchTST・TimeXer など GPU の重いもの）は 1 晩 1 本

[select]                        # 段 4（K6。物差しは howto-model-trader.md §3-1 のまま ＝ cli.select_candidates）
top = 3
shape_new_only = true           # 20 章の机上（cli.trader_shape）に自動で足すのは「新しく上位 3 に入った行」だけ
cut_new = true                  # 新しく上位 3 に入った行に、切れ目ずらし 1/3 ／ 2/3（cli.cut_shift）も足す（rules.md 33-6。2026-11-11。false ／ 無しなら足さない）
candidate_verdicts = ["採る"]    # 週 1 回の候補の棚（candidates/dev/）に配線だけの人を作る判定。保留は棚に残す（候補にしない）
weekly_day = "Fri"              # 候補の棚を作る曜日

[schedule]                      # K8
time_local = "01:00"            # 毎日（土日も）。America/Los_Angeles
timezone = "America/Los_Angeles"
total_hours = 3                 # 1 晩の全体の上限（超えたら段 3 の time_budget_s が止め、段 4 は必ず回す）

[stop]                          # 打ち切り（rules.md 31-4）
halt_file = "DEVLOOP_HALT"      # experiments/feature-discovery/DEVLOOP_HALT があれば段 0 で止める（⚠ 実売買の HALT とは別のファイル）
lock_file = "devloop.lock"
consecutive_build_failures = 3  # 段 2 が 3 晩連続で 1 本も通らなければ止めて報告
consecutive_no_new = 14         # 14 晩連続で登録 0（全部「既出」）なら止めて報告

[git]                           # K5
commit = true                   # 毎晩 1 コミット（main だけ・頭に "devloop:"）。⚠ prod は進めない
push = true
branch = "main"
pull = true                     # 段 0: git pull --ff-only（失敗 ＝ 止める）
dirty_tree = "stop"             # 段 0: 作業ツリーが汚れていたら止めて報告（利用者の未コミットと混ぜない）

[mail]                          # 報告メール（プラン docs/plans/devloop-mail.md・2026-11-03 利用者「推す案ですすめて」＝ M1〜M3）
enabled = true                  # false で送らない（設定ファイルが無いときも送らない ＝ timer.log に not-sent の 1 行）
send = "always"                 # M2: "always" 毎晩（来ない ＝ 機械か timer が止まった合図）／ "problems" 止まった・落ちた晩だけ
secrets = "~/.config/ai-income-lab/devloop-mail.env"   # ⚠ リポジトリの外（chmod 600・置くのは利用者）。宛先・アプリ パスワードはここだけ
subject_prefix = "[ail devloop]"
max_body_chars = 20000          # M3: 頭の要約 ＋ 日誌の全文（長い晩は切る）
html = true                     # HTML の本文も付ける（2026-11-04 利用者「D」＝ アイデアの札 ＋ 頭の 1 行 ＋ 回した結果の札。テキストの本文は今までどおり一緒に送る）
repo_url = "https://github.com/akiraak/ai-income-lab"   # 日誌とコミットへのリンク（blob/main/… ・commit/…）

[paths]
ideas = "config/ideas"                                  # 登録簿（1 アイデア 1 TOML。事前固定の正本）
register = "../../docs/specs/experiments/dev-loop/register.md"   # 登録簿を並べた表（cli.devloop register が吐く。⚠ 手で書かない）
log = "../../docs/specs/experiments/dev-loop/log"       # 日誌（1 晩 1 枚・機械で書く）
candidates = "../live-trading/config/traders/candidates/dev"    # 候補の棚（配線だけの人。呼び名は利用者）
queue_prefix = "config/queue/dev_"                      # その晩の queue config（登録簿から機械で作る）
experiment_prefix = "config/experiment/dev_"            # 段 2 が足す実験 config
ideas_code = "ail/ideas"                                # 段 2 が足す新しい口（registry に登録するだけ ＝ 既存の経路は 1 ビットも変わらない形）
tests_prefix = "tests/test_ideas_"                      # 「無い config は 1 ビットも変わらない」のテスト（1 id に 1 本必ず）

# ⚠ 段 2 を claude -p で回すときの allowlist（K7。外に書いたら捨てて status = 失敗）
[allowlist]
write = ["config/ideas/", "config/experiment/dev_", "config/queue/dev_", "ail/ideas/", "tests/test_ideas_",
         "../../docs/specs/experiments/dev-loop/", "config/names.toml", "config/catalog_notes.toml"]
# ⚠ 共有の経路（13500t の毎日の予測が通る道 ＝ 指紋 tests/test_trading_run.py・test_predict.py）。触るアイデアは status = 人の手
forbid = ["cli/run.py", "cli/predict.py", "cli/build.py", "ail/validation/", "ail/models/", "ail/features/", "ail/detectors/",
          "ail/selectors/", "ail/catalog.py", "ail/names.py", "../live-trading/", "../../dashboard/",
          "../../docs/specs/experiments/feature-discovery/rules.md", "../../docs/specs/experiments/feature-discovery/ledger.md",
          "../../TODO.md", "../../CLAUDE.md"]
