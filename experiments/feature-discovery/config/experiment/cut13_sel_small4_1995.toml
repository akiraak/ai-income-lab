# ⚠ **評価期間の切れ目をずらして保留の行を測り直す**（rules.md 33 章・登録簿 `20261111-fold-cut-shift`・プラン docs/plans/archive/fold-cut-shift.md。
# 2026-11-11 利用者「推す案で進めて」）。当てる行 ＝ 2026-11-11 の選ぶ段の上位 3 のうち ① F1-7 ② F2-2（1995 年からの表）。
#
# ⚠ **`sel_small4_1995.toml` との違いは `name`・`[validation] cut_offset = "1/3"`・θ（50 だけ）・`selectors`（F2-2・F1-7 と乱択だけ）だけ。**
# 表・fold の数・パージ・エンバーゴ・種・費用・k・モデルは全部同じ（違いは「切れ目の日付」だけにする）。
# ⚠ **回すと決めたのは結果を見る前**（33-2）。＋2（F1-7 ・ F2-2 × θ 50）。⚠ 結果を見てからほかの量・ほかの行に広げない。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "cut13_sel_small4_1995"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_1995"     # ⚠ 表は作り直さず own_1995 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ **処置は選別**（期間・モデル・検証方式は据え置き）。⚠ **F1-4 は k を使わない**（しきい値で決まる）
selectors = [
    "F2-2 RFE",                # ⚠ 当てる行 ②（rules.md 33-2）
    "F1-7 IC の安定性",        # ⚠ 当てる行 ①
    "乱択（基準）",            # ⚠ 基準線（数えない）。F1-4・全部使うは回さない ＝ 数を増やさない（21-2 と同じ絞り方）
]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50]              # ⚠ 元の行の水準だけ（rules.md 33-2。回す前に固定）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0
cut_offset = "1/3"            # ⚠ fold 1〜5 の初日を、その群の日付の数 × 1/3（切り捨て）個ぶん後ろへ（rules.md 33-1。回す前に固定）

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
