# ⚠ 開発ループ（2026-11-01・§7 の次の手）登録簿 `20261101-crash-exit-centered`（rules.md 31-6・記録 dev-loop.md §8）。回すと決めたのは結果を見る前（登録 16:31 PST）。
#    X5 と同じ中身の出口% から土台（急落の割合）を引いた検知器 X6 × θ 3 ＝ 3 検証。表は own_2018 を借りる。
name = "dev_crash_exit_c"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 14400.0          # ⚠ パージ ＝ 10 日（ラベルが先 5 営業日を見る）
bar_minutes = 1440.0

detectors = ["X6 出口だけ 先5日の急落を当てる（own・学習・土台差）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
