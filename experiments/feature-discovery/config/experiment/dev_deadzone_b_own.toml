# ⚠ 開発ループのサンドボックス 1 本目（2026-11-13）。登録簿 `20261101-deadzone-label`（rules.md 31-7）。回すと決めたのは結果を見る前。
# 元 ＝ dev_vol_label_own（＝ own_2018 の表を借りる）。違い ＝ 訓練のラベルは素の y のまま、|y| < 0.5 × own_vol_60 の行を学習から外す。対の相手 ＝ own_2018 の素の行（既存）。全部使う × θ 3 ＝ 3 検証。
name = "dev_deadzone_b_own"
label_deadzone = "b"          # ⚠ 訓練の行のうち |y| < 0.5 × own_vol_60 の行を学習から外す（較正・評価の行は外さない）。無い config は 1 ビットも変わらない
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置は検証方式）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
