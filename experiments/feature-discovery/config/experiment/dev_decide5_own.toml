# ⚠ 開発ループ ステージ 5（サンドボックス）。レジストリ `20261109-decide-every-5d`（rules.md 31-7）。回すと決めたのは結果を見る前。
# ⚠ **`trade_own_ridge_a.toml` との違いは `[trading] decide_every = 5` の 1 行だけ**（売買の判断を、銘柄ごとに評価分割の頭から 5 本に 1 回だけにする。間の足は前の判断を持ち越す）。
#    表は `own_2018` を借りる（作り直さない ＝ 13-8）。ラベルは y（1 日）・own 35 列 × Ridge・器 ／ θ ／ fold ／ 種 ／ 費用は同じ ＝ 買い% は対の相手と同じ。
#    対の相手 ＝ `trade_own_ridge_a` の素の行（毎日判断）。識別項目 `閾値売買（5日ごと）`（`~decide5`）。全部使う × θ 3 ＝ 3 検証（乱択と「基準 」の行は数えない）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "dev_decide5_own"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置は検証方式）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本
decide_every = 5               # ⚠ 判断は 5 本に 1 回だけ（水準はこの 1 つ。無い config は 1 ビットも変わらない）

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
