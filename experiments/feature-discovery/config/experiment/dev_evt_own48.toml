# ⚠ **開発ループの登録簿 `20261108-edgar-8k-event-flags`（参考あり・枠の内）**（rules.md 31 章・記録 dev-loop.md・事前固定は登録簿）。
#    ern_own48_ernf の写し（会社 48 本・2018-01-31〜・同じ切れ目）。違いは層だけ: 決算の層 ernf の代わりに、8-K の印の層 evt
#    （前の足より後に使えるようになった 8-K ／ 項目 5.02 ／ 項目 2.02・直近 20 本の件数・最後の 8-K からの日数・印）× Ridge × θ 3 ＝ 3 検証。
#    対の相手 ＝ ern_own48 の行（既存・同じ表の own だけ・同じ集合・同じ切れ目。evt は銘柄も行も落とさない）。
#    ⚠ 取得が先: `cli.fetch --exog events8k_daily`（連絡先は利用者・E2）。系列が無いと全部の会社が印 1 になる ＝ 回さない。
# ⚠ **回すと決めたのは結果を見る前（登録 2026-11-08 01:01 PST）**。
name = "dev_evt_own48"
dataset = "daily"
horizon = 1
cost_bp = 5.0
start_date = "2018-01-31"
feature_layers = ["own", "evt"]   # ⚠ 8-K の印の層（ail/ideas/i20261108_evt_layer.py。5 列 ＋ 印 1 列）
targets = "company"            # ⚠ ETF には 8-K が無い
horizon_min = 1440.0
bar_minutes = 1440.0
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16
model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
evt_lag_days = 1
