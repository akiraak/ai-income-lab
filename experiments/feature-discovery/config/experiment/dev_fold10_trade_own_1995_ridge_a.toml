# ⚠ **評価期間を 5 つから 10 個に替えるだけの実験**（開発ループのレジストリ `20261101-ten-fold-long-table`。2026-11-13・サンドボックス）。
#
# ⚠ **`trade_own_1995_ridge_a.toml` との違いは `name` と `[validation] folds = 10` だけ。**
# 表（own_1995 ＝ 1995 年からの長い表）・特徴量・モデル・θ・形式・種・コスト・パージ ／ エンバーゴは全部同じ。
# 検証方式は `閾値売買（評価期間10）`（名前 `~fold10`）＝ 5 つの評価期間の行とは別の識別項目で、判定を直接比べない。
# ⚠ **回すと決めたのは結果を見る前**。数える検証 ＝ 全部使う × θ 3 水準 ＝ 3（乱択・基準線は数えない）。
# ⚠ 正の評価期間の数の二項検定（`checks.json` の `by_threshold.<θ>.sign_test`）は診断 ＝ 採否には使わない。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "dev_fold10_trade_own_1995_ridge_a"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_1995"     # ⚠ 表は作り直さず own_1995 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置は評価期間の数）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 10                     # ⚠ 評価期間 10 個（表の日付を 11 等分・最初の 1 つは訓練だけ）。事前固定 ＝ 10 だけ（catalog.FOLD_VARIANTS）
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
