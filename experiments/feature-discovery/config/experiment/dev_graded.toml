# ⚠ 開発ループ（2026-11-01・段 1 の契約 2・枠の外）登録簿 `20261101-graded-weight-sizing`（rules.md 31-6・記録 dev-loop.md §7）。回すと決めたのは結果を見る前。
#    trade_own_ridge_a の写し ＋ [trading] graded = true（素の行は既存と同じ識別項目・〔量を段階に〕の行 × θ 3 ＝ ＋3 検証）。
name = "dev_graded"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"
graded = true                  # ⚠ 持つ量を買い% に応じて変える行を足す（無い config は 1 ビットも変わらない）

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
