# ⚠ **開発ループの登録簿 `20261025-h5-pick-centered`（参考あり・組み合わせる）の単体**（rules.md 31 章・記録 dev-loop.md §2・事前固定は登録簿 `config/ideas/20261025-h5-pick-centered.toml`）。
#    H5（25-5）の 4 本を土台差（25-7）で比べて期間を選ぶ検知器 ＝ `ail/ideas/i20261025_h5_pick_centered.py`。`trade_own_fwdpick_a` との違いは検知器の登録名だけ。
# ⚠ **表は `trade_own_fwdmulti_a` を `features_from` で借りる**（13-8）。θ 3 水準 ＝ 3 検証。⚠ **回すと決めたのは結果を見る前（登録 2026-10-25 12:31 PDT）**。
name = "dev_h5_pick_centered"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま
cost_bp = 5.0
features_from = "trade_own_fwdmulti_a"   # ⚠ 表は作り直さない（13-8）
start_date = "2018-01-31"

feature_layers = ["own", "trend"]   # ⚠ 元の表と同じ（trend は損切り係のため）
label_scales = [5, 10, 20, 40]      # ⚠ 元の表と同じ
targets = "all"

horizon_min = 86400.0          # ⚠ 元の表と同じパージ（60 日 × 1440 分）
bar_minutes = 1440.0

detectors = [
  "H5 先5〜40日から期間を選ぶゲート（全列・学習・土台差）",   # 登録簿 20261025-h5-pick-centered（ail/ideas）。4 本を土台差で比べて期間を選ぶ
]

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[model_args]
fwd_columns = "own"            # ⚠ 買い係・売り係は own 35 列だけ（25-1 の 2）

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 単体は 3 水準（H1〜H4 と同じ ＝ 25-5 の 6）
form = "shared"

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
trend_windows = [20]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
