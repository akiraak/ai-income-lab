# ⚠ **開発ループの登録簿 `20261101-c3-as-stop-role`（参考あり・枠の内）**（rules.md 31 章・記録 dev-loop.md・事前固定は登録簿）。
#    `trader_roles_t15`（R9・損切りなし）との違いは 損切り係 X7（C3 SMA200 と同じ規則を出口だけの形にしたもの）を 1 本足しただけ（と手法名）。
#    対照は両側にある: R9（損切りなし）／ R1〜R4（X1 ＝ 高値 20 日から −10%）。
# ⚠ **表は `trade_own_fwdmulti_a` を `features_from` で借りる**（作り直さない ＝ 13-8）。SMA200 は表の close から作る（trend 層は 20 日だけ）。
# ⚠ **数**: 素の行 1 ＋ 条件 2 ＝ 3 検証 ＋ X7 の単体の行（4 本で同じ識別項目 ＝ 合わせて 1）。⚠ **回すと決めたのは結果を見る前（登録 2026-11-01 15:49 PST）**。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "dev_roles_c3stop_b5e20"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま
cost_bp = 5.0
features_from = "trade_own_fwdmulti_a"   # ⚠ 表は作り直さない（13-8）
start_date = "2018-01-31"

feature_layers = ["own", "trend"]   # ⚠ 元の表と同じ（trend 層は読まない ＝ fwd_columns = own）
label_scales = [5, 10, 20, 40]      # ⚠ 元の表と同じ
targets = "all"

horizon_min = 86400.0          # ⚠ 元の表と同じパージ（60 日 × 1440 分）
bar_minutes = 1440.0

detectors = [
  "H2 先5日ゲート（全列・学習）",     # 買い係
  "H3 先20日ゲート（全列・学習）",     # 売り係
  "X7 出口だけ 終値がSMA200を割ったら降りる",   # 損切り係（ail/ideas/i20261101_c3_stop.py）
]

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[model_args]
fwd_columns = "own"            # ⚠ 買い係・売り係は own 35 列だけ（25-1 の 2）

[trading]
style = "threshold"
thresholds = [50]              # ⚠ 人の設定の 1 水準だけ（20-6）
form = "shared"

# ⚠ 役割つきの合わせる口（25-2）。最短保有 ＝ 買い係の期間。損切り係 ＝ C3 と同じ規則の X7（損切り係は最短保有の中でも毎日読む）
[[trading.mix]]
name = "R22 買い先5日・売り先20日（対照・損切りSMA200）"
combine = "roles"
min_hold_days = 5
members = [
  { method = "H2 先5日ゲート（全列・学習）", role = "buy" },
  { method = "H3 先20日ゲート（全列・学習）", role = "exit" },
  { method = "X7 出口だけ 終値がSMA200を割ったら降りる", role = "stop" },
]

# ⚠ 2a いまの人の条件（20-2。1 人 $600 ＝ 25-2 の 7）。合成だけに当てる（20-6 の 4 の 5）
[[trading.trader]]
tag = "5本・$600"
symbols = ["T", "PFE", "NKE", "VZ", "BAC"]
budget_usd = 600
methods = ["R22 買い先5日・売り先20日（対照・損切りSMA200）"]

# ⚠ 2b 全銘柄を買える予算（20-2）
[[trading.trader]]
tag = "全銘柄・全部を買える予算"
methods = ["R22 買い先5日・売り先20日（対照・損切りSMA200）"]

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
trend_windows = [20]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
