# ⚠ **開発ループの登録簿 `20261113-score-trailing-rank`（参考あり・枠の内）**（rules.md 31 章・記録 dev-loop.md・事前固定は登録簿）。
#    trade_own_ridge_a の写し（own_2018 の表・同じ切れ目）。違いは検知器だけ: 既存の own × Ridge の予測値を、較正した確率にせず
#    「その銘柄の直近 252 営業日の自分の予測値の中での順位」にして買い% にする TR1（ail/ideas/i20261113_score_trailing_rank.py）× θ 3 ＝ 3 検証。
#    対の相手 ＝ trade_own_ridge_a の `全部使う（基準）` の行（既存・同じ表・同じ切れ目）と、同じ保有日率の乱択ゲート（既存の checks・数えない）。
#    leak 対照は LEAK_ 列を学習器の入力に足す（予測値が先を知る ＝ 順位が先を知る）。
# ⚠ **回すと決めたのは結果を見る前（登録 2026-11-13 01:04 PST）**。
name = "dev_score_trailing_rank"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

detectors = ["TR1 自分の直近252日の予測値の中の順位（own・学習）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
