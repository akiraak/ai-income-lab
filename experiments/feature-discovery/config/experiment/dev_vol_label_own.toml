# ⚠ 開発ループ 3 周目（2026-11-01 利用者「開発ループの3周目を進めて」）。登録簿 `20261101-vol-scaled-label`（rules.md 31 章・記録 dev-loop.md §5）。回すと決めたのは結果を見る前。
# 対の相手 ＝ own_2018 の素のラベルの行（既存）。
#    `own_2018` の表を借り、訓練のラベルだけ y ÷ own_vol_60（`prep.train_label`）。評価の損益・器・θ・fold・種は同じ。識別項目 `閾値売買（ボラ割りラベル）`（`~vol-label`）。全部使う × θ 3 ＝ 3 検証。
name = "dev_vol_label_own"
label = "vol_scaled"           # ⚠ 訓練のラベルだけ y ÷ own_vol_60（登録簿 20261101-vol-scaled-label）。無い config は 1 ビットも変わらない
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置は検証方式）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
