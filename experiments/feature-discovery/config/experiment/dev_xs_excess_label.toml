# ⚠ **開発ループの登録簿 `20261025-xs-excess-label`（参考なし）**（rules.md 31 章・記録 dev-loop.md §2・事前固定は登録簿）。
#    `trade_own_ridge_a` との違いは `label = "xs_excess"` の 1 行だけ: 訓練のラベルを「y − 同じ日の表の全銘柄の y の平均」（断面の超過リターン）にする（`prep.train_label`）。
#    評価の損益・器・θ・表・fold・種は同じ。識別項目は検証方式の変種 `閾値売買（断面超過ラベル）`（名前 `~xs-label`）。全部使う × θ 3 ＝ 3 検証（乱択は基準線）。
# ⚠ **回すと決めたのは結果を見る前（登録 2026-10-25 12:31 PDT）**。
name = "dev_xs_excess_label"
label = "xs_excess"            # ⚠ 訓練のラベルだけ断面の超過リターンに（登録簿 20261025-xs-excess-label）。無い config は 1 ビットも変わらない
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置は検証方式）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
