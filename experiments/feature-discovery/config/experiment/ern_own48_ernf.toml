# ⚠ **欠損を印にする決算の層 `ernf` を own に足した行**（会社 48 本。rules.md 28 章・2026-10-22 利用者「3 本まとめて進めて」）。
# 対の相手は `ern_own48`（own だけ・48 社）。⚠ `ernf` は欠損を印の列にして銘柄を落とさないので、対の相手と**銘柄も行も同じ**になる
# （`ern_own48_ern` は 3 列そろった行だけ ＝ 45 社で、対の相手と集合が違った ＝ earnings-layer.md §3）。
# name ／ feature_layers 以外は `ern_own48` と 1 文字も違わない。
name = "ern_own48_ernf"
dataset = "daily"
horizon = 1
cost_bp = 5.0
start_date = "2018-01-31"
feature_layers = ["own", "ernf"]   # ⚠ 欠損を印にする決算の層（rules.md 28-1。3 列 ＋ 印 3 列）
targets = "company"            # ⚠ ETF には決算が無い（26-5）
horizon_min = 1440.0
bar_minutes = 1440.0
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16
model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ern_lag_days = 1
ern_max_stale_days = 400
