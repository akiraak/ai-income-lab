# ⚠ **段 3 の本命**（2026-09-12）: ⚠ **対象 48 本を、大型株 63 本の断面とリードラグも使って当てる。**
#
# ⚠ **これは「大型株を材料に入れると効くか」を測るための片割れである。**
#    ⚠ **相方は `midcap_own.toml`（own だけ）で、違うのは特徴量の層だけ。**
#    ⚠ **2 つ動かすと、どちらが効いたか分からない**（13-2 規約 5 と同じ向き）。
#
# ⚠ **物差しは 13 章のまま**（片道 2.5bp・対 B&H 上乗せ・θ 3 水準・形式 (A)）。
# ⚠ **B&H は「対象 48 本の等加重」**なので、⚠ **us63 の実行とは数字を直接比べない**（13-8）。
name = "midcap_cs"
dataset = "midcap48_daily"
horizon = 1
cost_bp = 5.0

feature_layers = ["own", "cs", "ll"]
targets = "company"            # ⚠ **当てる相手は 48 本だけ**（材料 63 本は当てない）

horizon_min = 1440.0
bar_minutes = 1440.0

selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16
model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
# ⚠ **先行銘柄は universe の `etf` 群 ＝ 材料 63 本**（利用者の指示「大型株のデータを入力に入れる」）
ll_leaders = "etf"
ll_lags = [1, 2, 3, 5]
beta_window = 60

[notes]
# ⚠ 断面は全銘柄が揃う時刻でしか作れない（2018-06 以降）
common_window_only = true
