# ⚠ **台帳の空白を埋める「手間 小」の 4 件のうち、`transform` の 1 件（F5-1 PCA）**
# （プラン `docs/plans/selectors-small-four.md` §1-1）。
#
# ⚠ **実行を分けたのは「変換は実行ぜんたいに掛かる」から**（`transform` は 1 本しか指定できない）。
# ⚠ **同じ実行に混ぜると、他の 3 手法まで主成分の上で回ることになる** = 処置が 2 つになる。
#
# ⚠ **選別は「全部使う」1 本だけにする。** 「乱択（基準）」を入れると手法名が
# ⚠ **「F5-1 PCA ＋ 乱択（基準）」**になり、⚠ **台帳が基準線と見分けられず試行に数えてしまう**
# （`ail/catalog.py` の `is_trial` は名前で基準線を判別する）。
#
# ⚠ **数えるのは 1 手法 × θ 3 水準 ＝ 3 試行。** ⚠ **門は診断なので `--ignore-gate` で回す**（14-10 規約 2）。
#
# ⚠ **成分の数は k と揃える**（16）。⚠ **「全部使う」（35 列）と列数を揃えないと、比べているのが
# ⚠ **直交化の効果か列数の効果か分からなくなる。** 水準を増やすなら回す前に決める（14-9）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "pca_1995"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_1995"     # ⚠ 表は作り直さず own_1995 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ **標本から学ぶ変換**（rules.md 3 章 B）。⚠ **訓練分割の内側で fit し `fitted/` に成分を残す**
transform = "F5-1 PCA"

selectors = ["全部使う（基準）"]   # ⚠ 変換の後は全成分を使う（選別は処置ではない）
k = 16                             # ⚠ 成分の数もここから読む（`ctx["k"]`）

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
