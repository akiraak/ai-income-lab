# ⚠ **選別の軸の空白 2 つを埋める**（プラン `plans/selectors-lgbm-two.md`）。
# ⚠ **閾値売買で回した選別は 4 本だけ**（F1-4・F1-7・F2-2・F5-1）で、
# ⚠ **F3-3 並べ替え(MDA) と F3-1 Lasso は毎日往復（gpu_lgbm_2018）にしか無かった。**
#
# ⚠ **trade_own_lgbm_a.toml との違いは `selectors` の行だけ。** 表・モデル・閾値・形式・
# ⚠ **fold 数・種・コスト・k・embargo は全部同じにしてある**（rules.md 13-8 の橋渡しの形）。
# ⚠ **揃えないと、比べているのが選別の差か設定の差か分からなくなる。**
#
# ⚠ **形式は (A) 共通だけ**（プラン §0-2）: 13-6 の「両形式」は処置が検証方式のときの要求で、
# ⚠ **ここの処置は選別である。** ⚠ **先例 sel_small4_1995 も (A) だけ**で、
# ⚠ **比較相手になる既存 4 選別が (A) にしか無い**（(B) では橋渡しの相手がいない）。
#
# ⚠ **回すと決めたのは結果を見る前**（14-10 規約 3）。⚠ **2 手法 × θ 3 水準 ＝ 6 試行として数える。**
# ⚠ **門は診断なので `--ignore-gate` で回す**（14-10 規約 2。門前でも回し、回したものは全部数える）。
#
# ⚠ **「全部使う（基準）」と「乱択（基準）」は基準線で、n_trials に数えない**（13-9 の 4）。
# ⚠ **この 2 本は `trade_own_lgbm_a` と鍵が同じなので台帳でまとまる** —
# ⚠ **数字が 1 つでも食い違ったら配線を壊したということ**（検算に使う）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "sel_lgbm_two"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ **処置は選別**（表・モデル・形式・検証方式は据え置き）。
# ⚠ **どちらも「訓練分割の内側だけで選ぶ」ことが要件**（rules.md 3 章 B）。⚠ **破っていないかは leak 対照で見る**
selectors = [
    "F3-3 並べ替え(MDA)",      # ⚠ モデル依存の順位。列ごとにシャッフルして精度の落ち方で測る（重い）
    "F3-1 Lasso",              # ⚠ 線形の選別を非線形モデルに渡す形。噛み合わない可能性が先にある
    "全部使う（基準）",        # ⚠ 基準線。⚠ **これを超えられない選別は選ぶ意味が無い**
    "乱択（基準）",            # ⚠ 基準線。⚠ **これに負ける選別は「選んでいない」のと同じ**
]
k = 16

model = "LightGBM"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
