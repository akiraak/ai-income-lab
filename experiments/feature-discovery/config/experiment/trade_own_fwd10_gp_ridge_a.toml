# ⚠ **変換を検知器に通す口の最初の 1 本 ＝ GA × 先 10 日の門**（rules.md 24 章・記録 transform-into-detectors.md。
# 2026-10-09 利用者決定 A「汎用の口」）。プランは plans/transform-into-detectors.md Phase 2。
#
# ⚠ **`trade_own_fwd10_ridge_a.toml` と `name` / `transform` 以外は 1 文字も違わない**（表・fold・θ・学習器・種・コスト・パージ）。
# ⚠ **表は作り直さず `trade_own_fwd10_ridge_a` のものを読む**（`y_fwd_10` の列が要る。13-8。表の差を混ぜない）。
# ⚠ **違うのは「GA の列 16 本が検知器の説明変数に足される」ことだけ**なので、差を「変換の差」として読める。
#
# ⚠ **GA の水準は `trade_own_gp_a` と同じ事前固定**（`ail/search/evolve.py` の DEFAULTS。回す前に書いた・結果を見て動かさない）:
# 個体 100 ／ 世代 20 ／ トーナメント 3 ／ エリート 2 ／ 交叉 0.7 ／ 突然変異 0.2 ／ 深さ 6 ／ ノード 30 ／
# 適合度は訓練内 holdout の Spearman |ρ|（⚠ **1 日の `y` で測る。`y_fwd_10` ではない** ＝ rules.md 24-1 の 2）／ champion は相関 0.9 で間引いて k=16。
# ⚠ **世代 × 個体は n_trials に数えない。** 検証 fold に出るのは fold ごとの champion 16 列 ＋ own 35 列 → fwd → Ridge → Platt の 1 手法。
# ⚠ **1 手法 × θ 3 水準 ＝ 3 検証**（798 → 801）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_own_fwd10_gp_ridge_a"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま
cost_bp = 5.0
start_date = "2018-01-31"      # ⚠ own_2018 と同じ（期間を揃える）
features_from = "trade_own_fwd10_ridge_a"   # ⚠ 表は作り直さない（`y_fwd_10` を持つ既存の表）

feature_layers = ["own"]
label_scales = [10]            # ⚠ 学習の対象（先 10 本の累積リターン）。⚠ **説明変数ではない**（接頭辞 y_fwd_ で外れる）
targets = "all"

horizon_min = 21600.0          # ⚠ パージ = 15 日 × 1440 分（営業日 10 本を暦で覆う）
bar_minutes = 1440.0

# ⚠ **標本から学ぶ変換**（rules.md 3 章 B）を **検知器の口**（24 章）に通す。式は訓練分割の内側で探し、`fitted/` の `_transform` に残す
transform = "F4-1 記号回帰（遺伝的プログラミング）"
k = 16                         # ⚠ GA の champion の本数（`trade_own_gp_a` と同じ。⚠ 1 回目の実行では書き忘れて 8 本になった ＝ 記録 §1-0）

# ⚠ **検知器 1 本**（rules.md 14-1 の契約 ＝ 買い% 1 本。表の全列 ＋ GA の列 → model → Platt）。⚠ **1 × 3 閾値 = 3 検証**
detectors = ["H1 先10日ゲート（全列・学習）"]

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
