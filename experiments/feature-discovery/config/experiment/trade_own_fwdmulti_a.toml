# ⚠ **先 5 ／ 10 ／ 20 ／ 40 営業日を当てにいく 4 本と、損切り係 1 本を 1 枚の表に載せる**（rules.md 25 章・記録
#    `docs/specs/experiments/horizon-roles-trader.md` §0。プラン `docs/plans/trader-model-roles.md`。利用者決定 2026-10-18
#    「買い係・売り係・損切り係で先の期間を別々に」「推す案でいく」）。
#
# ⚠ **この 1 本が表の持ち主**（`y_fwd_5 ／ 10 ／ 20 ／ 40` と `own_trend20_*` が要るので own_2018 を `features_from` で読めない。
#    説明変数の式は同じ・尻が 40 本短い）。Phase 2 の役割つきの 4 本（`trader_roles_t7〜t10`）が `features_from` でこの表を読む
#    ＝ 合わせる口のメンバーは **同じ表** ＝ fold の切れ目が同じ（20-6 の 4 の 2 で止まらない）。
# ⚠ **動かす軸は学習の対象（先の期間）だけ**。見る数字は T1 と同じ own 35 列（`[model_args] fwd_columns = "own"` で
#    `own_trend20_*` を見ない ＝ 25-1 の 2）。`trend` 層は損切り係 X1 が高値 20 日の列を読むためだけ。
# ⚠ **損益の対象は 1 日のまま**（13-4 のシミュレータを変えない。rules.md 15-3）。
# ⚠ **パージは 40 営業日を暦で覆う 60 日**（rules.md 14-7・15-4。40 × 1.5 × 1440 分）。較正の holdout は検知器ごとに自分の W でパージ。
# ⚠ **数（事前固定・記録 §0-4）**: H1 の 3 行は既存の識別項目（own 表）と**層が違う**（own ＋ trend）ので新しい行 ＝ 検知器 4 × θ 3 ＋
#    X1 単体（持ち続ける ＋ 損切り）× θ 3 ＝ **15 検証**。⚠ 結果を見て期間を足さない・動かさない（14-9）。
# ⚠ **門は測って記録するが、門前でも回す**（既定 ＝ 診断。14-10 規約 2）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_own_fwdmulti_a"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま
cost_bp = 5.0
start_date = "2018-01-31"      # ⚠ own_2018 と同じ（期間を揃える）

feature_layers = ["own", "trend"]   # ⚠ trend は損切り係 X1 のため（窓は下の [features] で 20 だけ）。買い係・売り係は見ない
label_scales = [5, 10, 20, 40]      # ⚠ 学習の対象（先 W 本の累積リターン）。⚠ **説明変数ではない**（接頭辞 y_fwd_ で外れる）
targets = "all"

horizon_min = 86400.0          # ⚠ パージ = 60 日 × 1440 分（営業日 40 本を暦で覆う）
bar_minutes = 1440.0

# ⚠ 検知器 5 本（rules.md 14-1 ／ 16-1 の契約）。H* は買い% 1 本・X1 は 入口 100 ＋ 出口（規則）
detectors = [
  "H1 先10日ゲート（全列・学習）",
  "H2 先5日ゲート（全列・学習）",
  "H3 先20日ゲート（全列・学習）",
  "H4 先40日ゲート（全列・学習）",
  "X1 出口だけ 高値20日から−10%で降りる",
]

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[model_args]
fwd_columns = "own"            # ⚠ 買い係・売り係は own 35 列だけを見る（25-1 の 2）。X1 は規則なので関係ない

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
trend_windows = [20]           # ⚠ 損切り係の高値・σ の窓（stop.py の WINDOW と同じ）
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
