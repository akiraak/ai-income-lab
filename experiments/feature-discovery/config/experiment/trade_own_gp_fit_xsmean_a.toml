# ⚠ **GA の適合度を替える 3 案の 1 つ**（rules.md 23 章・記録 evolutionary-search.md §9。2026-10-08 利用者決定）。
#
# ⚠ **`trade_own_gp_a.toml` との違いは `name` と `fitness = "xs_mean"` だけ。**
# 表・(A) 共通・Ridge・GA の設定（`ail/search/evolve.py` の DEFAULTS）・種・θ・コストは全部同じ。
# ⚠ **回すと決めたのは結果を見る前**。3 案 × θ 3 ＝ ＋9 のうちの 3（数えるのは champion × θ だけ ＝ 14-11）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_own_gp_fit_xsmean_a"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ **標本から学ぶ変換**（rules.md 3 章 B）。⚠ **式そのものを訓練分割の内側で探し、`fitted/` に残す**
transform = "F4-1 記号回帰（遺伝的プログラミング）"
fitness = "xs_mean"            # ⚠ 適合度 ＝ 日ごとの断面の順位相関の平均の絶対値（rules.md 23 章。回す前に固定）

selectors = ["全部使う（基準）"]   # ⚠ 変換の後は全列（＝ champion 16 列）を使う
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
