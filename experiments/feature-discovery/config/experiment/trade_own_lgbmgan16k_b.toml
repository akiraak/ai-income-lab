# ⚠ **batch 16,384 の GAN 増強**（2026-09-13。利用者の決定「両方回す」）。
# ⚠ **既定 1024 の `trade_own_lgbmgan_b.toml` と model 以外は完全に同じ。**
#    ⚠ **違うのは WGAN-GP の batch だけ**なので、差を「batch の差」として読める（rules.md 13-8）。
#
# ⚠ **なぜ足したか**: ⚠ **1 反復の時間が batch にほとんど依らない**【実測 2026-09-13】。
#    256 行でも 16,384 行でも 1 反復は 37ms → 47ms にしかならない（＝ カーネル起動律速）。
#    ⚠ **batch を 16 倍にすると反復数が 1/9 になり、そのぶん速くなる**。
#    ⚠ **だがこれは速さのための水準であって、最適化の軌跡が変わる ＝ 別の手法である。**
#    ⚠ **別のモデル名で登録して台帳の鍵を割り、普通の試行として数える**（rules.md 14-9・13-9 の 3・5）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_own_lgbmgan16k_b"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置はモデル）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

model = "LightGBM+GAN増強(batch16k)"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "per_symbol"            # (B) 銘柄別 63 本（fit も較正も銘柄ごと）

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
