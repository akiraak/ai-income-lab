# ⚠ **モデルの軸の空白を埋める 2 本のうちの 1 本**（プラン `plans/mlp-threshold-trading.md`）。
# ⚠ **閾値売買で回したモデルは Ridge と LightGBM だけで、MLP は毎日往復に 4 行あるきりだった。**
# ⚠ **trade_own_lgbm_a.toml と model 以外は完全に同じ**（表・fold・θ・選別・k・種・コスト）。
#    ⚠ **違うのはモデルだけ**なので、既存 4 本との差を「モデルの差」として読める（rules.md 13-8）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_own_mlp_a"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置はモデル）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

# ⚠ **ハイパーパラメータは ail/models/deep.py の既定のまま。振らない**（rules.md 13-6 の 3）。
# ⚠ **振った水準の数だけ n_trials が増える。** デバイスは AIL_TORCH_DEVICE（既定 auto）
model = "MLP"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
