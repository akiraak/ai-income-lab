# ⚠ **ハイパーパラメータを訓練分割の内側で選ぶ段を入れた 3 本のうちの 1 本**（rules.md 14-12。2026-10-09 利用者決定 B。
# プラン plans/hyperparam-inner-selection.md・記録 hyperparam-inner-selection.md）。
# ⚠ **trade_own_mlp_a.toml と違うのはモデル（`MLP（内側選抜）`）と、選別を「全部使う」1 本に絞ったことだけ**
#    （表・fold・θ・k・種・コスト は同じ ＝ 既定の対と「選ぶ段の有無」だけで比べる。13-8）。
# ⚠ 乱択（基準）は入れない（候補の学習が 2 倍になるだけ。GA の config と同じ判断）。
# ⚠ 候補（層と幅 × Dropout × 学習率 ＝ 45。既定が先頭）は ail/models/tuned.py に事前固定 ＝ 結果を見て足さない・動かさない（14-12 規約 1）。
# ⚠ 数えるのは champion × θ 3 ＝ n_trials ＋3（候補 × fold は数えない。14-11 規約 2）
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_own_mlp_tuned_a"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

selectors = ["全部使う（基準）"]
k = 16

model = "MLP（内側選抜）"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
