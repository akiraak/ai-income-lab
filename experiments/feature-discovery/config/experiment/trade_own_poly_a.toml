# ⚠ **台帳の空白 F4-4 多項式・交互作用の展開**（プラン `plans/ledger-blanks-six.md`）。
#
# ⚠ **F4（生成型）はこれが初めての実施である**（カタログ 4 件中 0 件だった）。
# ⚠ **「特徴量を選ぶ」側は 13 手法回して全滅しているが、「作る」側はまるごと空だった。**
#
# ⚠ **実行を分けたのは「変換は実行ぜんたいに掛かる」から**（`transform` は 1 本しか指定できない）。
# ⚠ **選別は「全部使う」1 本だけ。** 「乱択（基準）」を入れると手法名が「F4-4 … ＋ 乱択（基準）」になり、
# ⚠ **台帳が基準線と見分けられず試行に数えてしまう**（`pca_1995.toml` の教訓）。
#
# ⚠ **水準は事前固定**: 2 次・交互作用あり・定数項なし（35 列 → 665 列）。⚠ **own だけ**（断面は足さない）。
# ⚠ **1 手法 × θ 3 水準 ＝ 3 試行。** ⚠ **α は 1 のまま振らない**（振ると n_trials が増える）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_own_poly_a"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さず own_2018 のものを読む（13-8。表の差を混ぜない）

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ **標本から学ぶ変換**（rules.md 3 章 B）。⚠ **訓練分割の内側で fit し `fitted/` に中身を残す**
transform = "F4-4 多項式・交互作用の展開"

selectors = ["全部使う（基準）"]   # ⚠ 変換の後は全列を使う（選別は処置ではない）
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
