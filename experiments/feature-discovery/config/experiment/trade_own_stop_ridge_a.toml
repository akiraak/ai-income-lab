# ⚠ **損切りを 1 つの予測モデルとして扱えるか**（記録 `docs/specs/experiments/stoploss-as-model.md` §0。利用者の指示 2026-09-27
# 「損切りは一つのモデルとして考えてもよいかも検証」。決めごと K2・K3 ＝ プラン new-model-trader.md §2）。
#
# ⚠ **動かす軸は出口だけ。** 入口は 8 本とも同じ 1 本（T1 と同じ own 35 列 → Ridge → Platt。学習の対象は 1 日の y）。
# ⚠ **`trend` 層（窓 20 の 6 列）は損切りの規則（L1・L2）が読むためだけ**に表に入れる（入口には入れない ＝ `stop.entry_columns`）。
# ⚠ **`label_scales = [10]` は L3（学ぶ出口 ＝ P(y_fwd_10 ≤ 0)）のため**。⚠ **この 1 本が表の持ち主**（`y_fwd_10` と `own_trend20_*` が
#    要るので own_2018 を `features_from` で読めない。説明変数の式は同じ・尻が 10 本短い）。
# ⚠ **パージは 2 つのラベルの長いほう**（10 営業日を暦で覆う 15 日。rules.md 16-3 の 4）。
# ⚠ **数（事前固定・記録 §0-4）**: 検知器 8 本 × θ 3 ＝ 24 ＋ 形 B（`〔買値から−N%〕` 3 × θ 3）9 ＝ **33 検証**。
#    固定日数の出口（`基準 …〔N日で降りる〕`）は基準線 ＝ 数えない。⚠ **結果を見て水準を足さない・動かさない**（14-9）。
# ⚠ **門は測って記録するが、門前でも回す**（既定 ＝ 診断。14-10 規約 2）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_own_stop_ridge_a"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま（13-4 のシミュレータの物差し）
cost_bp = 5.0
start_date = "2018-01-31"      # ⚠ own_2018 と同じ（期間を揃える）

feature_layers = ["own", "trend"]   # ⚠ trend は損切りの規則のため（窓は下の [features] で 20 だけ）
label_scales = [10]            # ⚠ L3 の学習の対象（先 10 本の累積リターン）。⚠ **説明変数ではない**（接頭辞 y_fwd_ で外れる）
targets = "all"

horizon_min = 21600.0          # ⚠ パージ = 15 日 × 1440 分（営業日 10 本を暦で覆う）
bar_minutes = 1440.0

# ⚠ **検知器 8 本 ＝ 対照 1 ＋ L1 3 水準 ＋ L2 3 水準 ＋ L3 1**（rules.md 16-1 の契約 ＝ 入口% と出口% の 2 本。L0 だけ 1 本）
detectors = [
  "L0 入口のみ（損切りなし）",
  "L1 高値20日から−5%で降りる",
  "L1 高値20日から−10%で降りる",
  "L1 高値20日から−20%で降りる",
  "L2 高値20日からσの2倍で降りる",
  "L2 高値20日からσの4倍で降りる",
  "L2 高値20日からσの8倍で降りる",
  "L3 先10日の下げを学んで降りる",
]

model = "Ridge"                # ⚠ 入口と L3 の出口で同じ（16-3 の 6）
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

# ⚠ **位置を知る出口**（記録 §0-3。`simulate` の口 ＝ 既定は 1 ビットも変えない）。⚠ **L0 の行にだけ当てる**
[trading.position_exits]
methods = ["L0 入口のみ（損切りなし）"]
stop_loss_pct = [5, 10, 20]    # 形 B: 買値からの下落 %（L1 と同じ値 ＝ 高値からと買値からを直接比べる）
max_hold_days = [5, 10]        # 基準線: 固定日数の出口（`基準 ` で始まる行 ＝ 数えない）

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
trend_windows = [20]           # ⚠ 損切りの規則が見る窓は 20 日だけ（60 ／ 200 は 16 章の出口に近づくので足さない）
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
