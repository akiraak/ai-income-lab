# ⚠ **暦の列（`cal` 層: 曜日 5 列 ＋ 前の足からの日数）を `own` に足した実験**（利用者の指示 2026-09-17「データに曜日を含めたものを検証する」）。
# ⚠ **`trade_own_1995_ridge_a.toml` から変えたのは `name`・`features_from`・`feature_layers` だけ**（橋渡し対。期間・銘柄・モデル・θ・コストは同一。rules.md 13-8）。
# ⚠ **事前登録**: docs/specs/experiments/weekday-feature.md §1（回すと決めたのは結果を見る前・n_trials ＋9）。
name = "trade_owncal_1995_ridge_a"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "owncal_1995"   # ⚠ 表は作り直さず owncal_1995 のものを読む（13-8）

feature_layers = ["own", "cal"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置は期間）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
