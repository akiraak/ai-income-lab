# ⚠ **買う線と売る線を別に置く**（rules.md 18 章・記録 `docs/specs/experiments/forward10-target.md` §7。利用者の指示 2026-09-27
# 「買いと売りの閾値を別の値にしたもので検証してください」）。⚠ **事前固定は 3 組 ＝ (55, 50)・(60, 50)・(60, 55)**（買い線, 売り線）。
# ⚠ **表は trade_ownex_fwd10_ridge_a のものを読む**（features_from。作り直さない）。
# 対称の行（θ 50 ／ 55 ／ 60）も出るが、既存の識別項目にまとまる（再現・一致の検算）。新しい検証は 3 組 × … ＝ 手法 1 本につき 3。
# それ以外は trade_ownex_fwd10_ridge_a と同じ（そちらの頭の注意書きを読む）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_ownex_fwd10_ridge_a_pairs"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま
cost_bp = 5.0
features_from = "trade_ownex_fwd10_ridge_a"   # ⚠ 表は持ち主のものを読む（y_fwd_10 つき）

feature_layers = ["own", "cs", "rel", "ex"]
label_scales = [10]            # ⚠ 学習の対象（先 10 本の累積リターン）。⚠ **説明変数ではない**
targets = "company"

horizon_min = 21600.0          # ⚠ パージ = 15 日 × 1440 分（営業日 10 本を暦で覆う）
bar_minutes = 1440.0

detectors = ["H1 先10日ゲート（全列・学習）"]

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本
threshold_pairs = [[55, 50], [60, 50], [60, 55]]   # ⚠ [買い線, 売り線]。事前固定（rules.md 18-1）。結果を見て足さない

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 1               # ⚠ 断面は同じ足の他銘柄を見るので、境目を 1 本空ける（trade_ownex_ridge_a と同じ）
seed = 0

[features]
beta_window = 60
ex_lag_days = 1
ex_sources = ["ecb", "treasury", "noaa", "usgs"]
ex_zero_fill = ["usgs"]        # ⚠ 地震は「行が無い日 = 0 件」
ex_transforms = ["d1", "z20"]  # ⚠ 水準は非定常なので入れない
ex_max_stale_days = 7
