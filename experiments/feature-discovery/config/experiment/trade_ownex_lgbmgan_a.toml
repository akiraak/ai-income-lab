# ⚠ **GAN 増強 × 閾値売買 × ownex の 12 本のうちの 1 本**（プラン `plans/gan-threshold-ownex.md`）。
# ⚠ **batch 1,024（既定）**。own では 36 行とも「落とす」だった（docs/specs/experiments/gan-threshold-trading.md）。
# ⚠ **trade_ownex_lgbm_a.toml と name・model 以外は完全に同じ**（表・対象・fold・θ・選別・k・種・コスト・embargo）。
#    ⚠ **違うのはモデルの 1 段だけ**なので、差をモデル（と batch）の差として読める（rules.md 13-8）。
#
# ⚠ **GAN の形は 2026-09-09 に事前固定したもの**（WGAN-GP・300 epoch・幅 128・潜在 32・α = 100%）。振らない。
# ⚠ **門は既定で診断**（2026-09-14 から。フラグを付けずに回す。rules.md 14-10 規約 2）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_ownex_lgbmgan_a"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "trade_ownex_ridge_a"  # ⚠ 表は trade_ownex_ridge_a が持ち主（作り直さない）

feature_layers = ["own", "cs", "rel", "ex"]
targets = "company"

horizon_min = 1440.0
bar_minutes = 1440.0

# ⚠ 選別は「全部使う」1 本に絞る（選別の優劣は決着済み。処置は検証方式）。乱択は選別の基準線
selectors = ["全部使う（基準）", "乱択（基準）"]
k = 32

model = "LightGBM+GAN増強"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 1               # ⚠ 断面は同じ足の他銘柄を見るので、境目を 1 本空ける
seed = 0

[features]
beta_window = 60
ex_lag_days = 1
ex_sources = ["ecb", "treasury", "noaa", "usgs"]
ex_zero_fill = ["usgs"]        # ⚠ 地震は「行が無い日 = 0 件」
ex_transforms = ["d1", "z20"]  # ⚠ 水準は非定常なので入れない
ex_max_stale_days = 7
