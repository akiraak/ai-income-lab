# ⚠ **線形の変換 × 非線形の学習器 ＝ ウェーブレット × 先 10 日の門 × LightGBM**（rules.md 24-2・記録 transform-into-detectors.md §3。利用者「1 で進めて」2026-10-18）。db4・レベル 3（`trade_ownseq_fwd10_wave_ridge_a` と同じ）。⚠ 検知器は窓の生の 60 列も読んだまま（足す規則）。
#
# ⚠ **`trade_ownseq_fwd10_lgbm_a.toml` と `name` / `transform` / `k` 以外は 1 文字も違わない**（表・fold・θ・学習器・種・コスト・パージ）＝ 対の相手はその既存の実行（回し直さない）。
# ⚠ **表は作り直さず `trade_ownseq_fwd10_ridge_a` のものを読む**（`features_from`。13-8）。
# ⚠ **これは Ridge の結果を見た後に登録した処置**（Ridge では買い% が 1 ビットも変わらなかった ＝ 記録 §2-3）。水準は元の実行のまま・学習器は既存の `fwd` × LightGBM のまま（水準を足さない）。
# ⚠ **1 手法 × θ 3 水準 ＝ 3 検証**（2 本で ＋6）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trade_ownseq_fwd10_wave_lgbm_a"
features_from = "trade_ownseq_fwd10_ridge_a"   # ⚠ 表は持ち主のものを読む（y_fwd_10 つき）
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま
cost_bp = 5.0

feature_layers = ["own", "seq"]
label_scales = [10]            # ⚠ 学習の対象（先 10 本の累積リターン）。⚠ **説明変数ではない**
targets = "all"

horizon_min = 21600.0          # ⚠ パージ = 15 日 × 1440 分（営業日 10 本を暦で覆う）
bar_minutes = 1440.0

# ⚠ **変換を検知器の口に通す**（rules.md 24 章）。係数は `fitted/` の `_transform` に残す
transform = "F5-4 ウェーブレット・スペクトル"
k = 16                         # ⚠ 元の実行と同じ（F5-1 は成分の数。ほかは読まない）

detectors = ["H1 先10日ゲート（全列・学習）"]

model = "LightGBM"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
