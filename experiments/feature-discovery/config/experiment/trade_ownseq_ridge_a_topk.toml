# ⚠ **上位 K（保有できる銘柄数に上限を置く）**（rules.md 17 章・プラン `plans/topk-holdings.md`。利用者の指示 2026-09-19）。
# `trade_ownseq_ridge_a` と同じ表・同じモデル・同じ fold で、⚠ **違うのは [trading] の top_k だけ**。
# 出る行: 素の行（既存と同じ鍵にまとまる ＝ 再現の検算）＋ 上位 K の行（K 5 × 端数 ／ 整数株 A ／ 整数株 B⚠ ＝ 15 試行）＋ 基準線「乱択上位 K」。
# ⚠ **事前登録は rules.md 17 章**（売買の規則・水準・基準線・予想を結果の前に固定）。⚠ **結果を見て K・θ・予算を動かして回し直さない。**
name = "trade_ownseq_ridge_a_topk"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "trade_ownseq_ridge_a"   # ⚠ 表は作り直さず、元の実験のものを読む（13-8。表の差を混ぜない）
start_date = "2018-01-31"      # ⚠ own_2018 と同じ（期間を揃える。rules.md 14-4）

feature_layers = ["own", "seq"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

detectors = [
  "T3 QUANT（60日窓）",          # ⚠ 実売買の T3 が使う 1 本だけ（MiniRocket・Hydra は回さない）
]
k = 60                         # 窓の長さ（⚠ 選別はしない。窓の列は事前固定）

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50]              # ⚠ 実売買の 3 人で確定済みの 1 水準だけ（rules.md 17-2。3 水準に広げない）
top_k = [1, 3, 5, 10, 20]      # ⚠ 事前固定（17-2 の案 B）。結果を見て足さない・引かない
top_k_budgets_usd = { "A" = 300, "B⚠" = 3000 }   # 整数株の版（17-3）。⚠ **規模 B（$3,000 ＝ 口座 $10,000）は実際の取引で使えない可能性がある**
form = "shared"                # (A) 銘柄共通 1 本

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
