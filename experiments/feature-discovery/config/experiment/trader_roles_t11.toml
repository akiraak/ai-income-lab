# ⚠ **25-5（2026-10-18）: 1 本で「買い」と「何日持つか」を出す買い係 H5 ＋ 損切り係 X1 をトレーダーの形（20 章）で机上にかける**（rules.md 25-5 の 6 ②・記録 horizon-roles-trader.md §6・プラン §3-3）。
#    候補の人の識別名は `T11`（呼び名は後で）。H5 θ 50 の行は `trade_own_fwdpick_a` に、X1 の行は `trade_own_fwdmulti_a` にまとまる（再現の検算）。
# ⚠ **表は `trade_own_fwdmulti_a` を `features_from` で借りる**（13-8）。合成 R5 の素の行 1 ＋ 条件 2 ＝ 3 検証。⚠ **回すと決めたのは結果を見る前**。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trader_roles_t11"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま
cost_bp = 5.0
features_from = "trade_own_fwdmulti_a"   # ⚠ 表は作り直さない（13-8）
start_date = "2018-01-31"

feature_layers = ["own", "trend"]   # ⚠ 元の表と同じ（trend は損切り係のため）
label_scales = [5, 10, 20, 40]      # ⚠ 元の表と同じ
targets = "all"

horizon_min = 86400.0          # ⚠ 元の表と同じパージ（60 日 × 1440 分）
bar_minutes = 1440.0

detectors = [
  "H5 先5〜40日から期間を選ぶゲート（全列・学習）",   # 買い係（保有日数も出す）
  "X1 出口だけ 高値20日から−10%で降りる",   # 損切り係
]

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[model_args]
fwd_columns = "own"            # ⚠ 買い係・売り係は own 35 列だけ（25-1 の 2）

[trading]
style = "threshold"
thresholds = [50]              # ⚠ 人の設定の 1 水準だけ（20-6）
form = "shared"

# ⚠ 買い係が期間を選ぶ合わせる口（25-5 の 4）。売り係なし・最短保有なし（保有日数は買い係が行ごとに出す）。K9 (a) ＝ stop_blocks_buy は書かない
[[trading.mix]]
name = "R5 買い係が期間を選ぶ・損切り"
combine = "roles"
hold_from_buy = true
members = [
  { method = "H5 先5〜40日から期間を選ぶゲート（全列・学習）", role = "buy" },
  { method = "X1 出口だけ 高値20日から−10%で降りる", role = "stop" },
]

# ⚠ 2a いまの人の条件（20-2。✅ 2026-10-04 から 1 人 $600 ＝ 25-2 の 7）。合成だけに当てる（20-6 の 4 の 5）
[[trading.trader]]
tag = "5本・$600"
symbols = ["T", "PFE", "NKE", "VZ", "BAC"]
budget_usd = 600
methods = ["R5 買い係が期間を選ぶ・損切り"]

# ⚠ 2b 全銘柄を買える予算（20-2）
[[trading.trader]]
tag = "全銘柄・全部を買える予算"
methods = ["R5 買い係が期間を選ぶ・損切り"]

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
trend_windows = [20]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
