# ⚠ **候補の人 `T6`（ソラ）を、いまの 3 人と同じ期間の表でトレーダーと同じ形にかける**（rules.md 20-6・
# プラン `docs/plans/trader-shape-live-three.md`。利用者の指示 2026-10-01「新しく作られたT4移行とT1-T3も比較したい」）。
# `T6` のモデル ＝ F2-2 RFE（16 列を選んで Ridge・θ 50）。元は 1995 年からの表（`sel_small4_1995`）だが、
# ⚠ **ここでは 2018 年からの表（`own_2018` ＝ `T1` と同じ表）**で回す ＝ 本番の日足（2018 年から）に入れたときの形。
#
# ⚠ **`trader_sel_small4_1995.toml` との違い**: 表が `own_2018`・selectors を `T6` の 1 本に絞った。モデル・k・fold・種・コストは同じ。
# ⚠ **表が違うので別の検証**: 素の行（F2-2 × 2018 年から）＋ 条件 2 ＝ 3 検証として数える（20-6）。
# ⚠ **回すと決めたのは結果を見る前**（20-6）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trader_sel_small4_2018"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "own_2018"     # ⚠ 表は作り直さない（13-8）。`T1` と同じ表

feature_layers = ["own"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

selectors = [
    "F2-2 RFE",
]
k = 16

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50]              # ⚠ `T6` の設定の 1 水準だけ（20-6）
form = "shared"

# ⚠ 2a 今の条件（20-2）。5 本は 2026-09-21 に実際の 3 人で確定したもの（⚠ 結果を見て選び直さない）
[[trading.trader]]
tag = "5本・$300"
symbols = ["T", "PFE", "NKE", "VZ", "BAC"]
budget_usd = 300

# ⚠ 2b 全銘柄を買える予算（20-2）: 予算は fold ごとに「評価期間の close の最高値 × 銘柄数」
[[trading.trader]]
tag = "全銘柄・全部を買える予算"

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
