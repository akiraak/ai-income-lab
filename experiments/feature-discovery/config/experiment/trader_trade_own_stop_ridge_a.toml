# ⚠ **候補の人 `T5`（ミオ）をトレーダーと同じ形で机上にかける**（rules.md 20-6・プラン `docs/plans/trader-shape-live-three.md`。
# 利用者の指示 2026-10-01「新しく作られたT4移行とT1-T3も比較したい」）。
# `T5` ＝ 主モデル（own 35 列 × Ridge）＋ 損切りモデル（高値 20 日から −10% で降りる）を `unanimous`。机上の写しは
# 対の検知器「L1 高値20日から−10%で降りる」（入口 ＝ 主モデル・出口 ＝ max(100 − 入口%, 損切り)。stoploss-as-model.md §0）。
#
# ⚠ **`trade_own_stop_ridge_a.toml` との違い**: 表は `features_from` で借りる・detectors を `T5` の 1 本に絞った・θ を 50 だけにした・
# `[trading.position_exits]` を外した・⚠ **[[trading.trader]] を足した**。表・ラベル・fold・種・コストは同じ（素の行は既存と同じ識別項目にまとまる）。
# ⚠ **回すと決めたのは結果を見る前**（20-6）。⚠ 1 本 × 条件 2 ＝ 2 検証として数える。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trader_trade_own_stop_ridge_a"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日のまま（13-4 のシミュレータの物差し）
cost_bp = 5.0
features_from = "trade_own_stop_ridge_a"   # ⚠ 表は作り直さない（13-8）
start_date = "2018-01-31"      # ⚠ own_2018 と同じ（期間を揃える）

feature_layers = ["own", "trend"]   # ⚠ trend は損切りの規則のため（窓は下の [features] で 20 だけ）
label_scales = [10]            # ⚠ 元の表と同じ（L3 の学習の対象。この config では使わない）
targets = "all"

horizon_min = 21600.0          # ⚠ 元の表と同じパージ（15 日 × 1440 分）
bar_minutes = 1440.0

detectors = [
  "L1 高値20日から−10%で降りる",   # ⚠ `T5` の損切りモデルと同じ水準（X1 −10%）の 1 本だけ
]

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50]              # ⚠ `T5` の設定の 1 水準だけ（20-6）
form = "shared"

# ⚠ 2a 今の条件（20-2）。5 本は 2026-09-21 に実際の 3 人で確定したもの（⚠ 結果を見て選び直さない）
[[trading.trader]]
tag = "5本・$300"
symbols = ["T", "PFE", "NKE", "VZ", "BAC"]
budget_usd = 300

# ⚠ 2b 全銘柄を買える予算（20-2）: 予算は fold ごとに「評価期間の close の最高値 × 銘柄数」
[[trading.trader]]
tag = "全銘柄・全部を買える予算"

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
trend_windows = [20]           # ⚠ 損切りの規則が見る窓は 20 日だけ
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
