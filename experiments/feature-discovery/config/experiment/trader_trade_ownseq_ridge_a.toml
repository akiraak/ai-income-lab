# ⚠ **いまの 3 人をトレーダーと同じ形で机上にかける**（rules.md 20-6・プラン `docs/plans/archive/trader-shape-live-three.md`。
# TODO「予測モデルの検証のようにトレーダーの検証も行う」。利用者の指摘 2026-09-26）。`T3`（カエデ） が使うモデル。
#
# ⚠ **`trade_ownseq_ridge_a.toml` との違い**: 表は `features_from` で借りる・detectors を実売買の 1 本（T3 QUANT）に絞った（`_topk` と同じ）・θ を実売買の設定の 1 水準だけにした・
# ⚠ **[[trading.trader]] を足した**。表・モデル・k・fold・種・コストは同じ（素の行は既存と同じ識別項目にまとまる ＝ 再現の検算）。
# ⚠ **回すと決めたのは結果を見る前**（20-6）。⚠ 1 本 × 条件 2 ＝ 2 検証として数える。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trader_trade_ownseq_ridge_a"
dataset = "daily"
horizon = 1
cost_bp = 5.0
features_from = "trade_ownseq_ridge_a"   # ⚠ 表は作り直さず、元の実験のものを読む（13-8。表の差を混ぜない）
start_date = "2018-01-31"      # ⚠ own_2018 と同じ（期間を揃える。rules.md 14-4）

feature_layers = ["own", "seq"]
targets = "all"

horizon_min = 1440.0
bar_minutes = 1440.0

detectors = [
  "T3 QUANT（60日窓）",          # ⚠ 実売買の T3 が使う 1 本だけ（MiniRocket・Hydra は回さない）
]
k = 60                         # 窓の長さ（⚠ 選別はしない。窓の列は事前固定）

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50]              # ⚠ 実売買の T3 の設定の 1 水準だけ（20-6）
form = "shared"

# ⚠ 2a 今の条件（20-2）。5 本は 2026-09-21 に実際の 3 人で確定したもの（⚠ 結果を見て選び直さない）
[[trading.trader]]
tag = "5本・$300"
symbols = ["T", "PFE", "NKE", "VZ", "BAC"]
budget_usd = 300

# ⚠ 2b 全銘柄を買える予算（20-2）: 予算は fold ごとに「評価期間の close の最高値 × 銘柄数」
[[trading.trader]]
tag = "全銘柄・全部を買える予算"

[validation]
split = "walk_forward_dates"
folds = 5
purge = true
embargo_bars = 0
seed = 0

[features]
ex_lag_days = 1
ex_zero_fill = ["usgs"]
ex_transforms = ["d1", "z20"]
ex_max_stale_days = 7
