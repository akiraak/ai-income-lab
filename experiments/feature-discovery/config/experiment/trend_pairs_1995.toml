# ⚠ **入口と出口を別の窓で持つ検知器**（規約は rules.md 16 章。[プラン](../../../../docs/plans/archive/downtrend-entry-timing.md)）。
#
# ⚠ **動かす軸は 1 つだけ — 出力の契約。** 既存の 21 試行は買い% 1 本で、
# ⚠ **売り% = 100 − 買い% だったので「入口は短期・出口は長期」を書く場所が無かった**（16 章の冒頭）。
#
# ⚠ **表は `trend_scales_1995` のものを読む**（`features_from`）。⚠ **作り直さない** — 表を作り直すと
# ⚠ **列の順や間引きが同じでも「表の差」が混ざる**（rules.md 13-8）。⚠ **leak 表にも
# ⚠ **`LEAK_fwd_20/60/200` が 3 本そろっている**ので、どの構成でも leak 対照が跳ねる（16-7 の 4）。
#
# ⚠ **事前固定するのは構造だけ**（rules.md 14-9・16-4）: 窓の順序対 6（20/60・20/200・60/200 ＋
# ⚠ **逆向き 3 つは対照**）／ 系統 2（D 学習ゲート・C 古典フィルタ）／ θ は 50・55・60 ／ 形式は (A) だけ ／
# ⚠ **合計 36 試行**（n_trials 217 → 253）。⚠ **結果を見て足さない・減らさない。**
# ⚠ **対称な窓（W_in = W_out）は置かない** — 16-2 で 100 − 入口% に退化し、既存の行と同じものになる。
#
# ⚠ **パージは 2 つのラベルの長いほう**を暦で覆う（16-3 の 4）。最長は 200 営業日 ＝ 300 暦日で、
# ⚠ **`trend_scales_1995` と同じ値**（構成ごとに変えない ＝ fold の切れ目を揃える）。
#
# ⚠ **門（14-5）は測って記録するが、門前でも回す**（14-10 規約 2）。⚠ **門が測るのは入口% だけ**
# （`gate._fold_detectors` が `fn(...)[0]` を読む）。⚠ **診断なので問題ないが、門の値で出口側を語らない。**
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trend_pairs_1995"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは 1 日（13-4 のシミュレータを変えない）
cost_bp = 5.0

features_from = "trend_scales_1995"   # ⚠ 表の持ち主は trend_scales_1995（作り直さない）
feature_layers = ["own", "trend"]     # ⚠ **出来高は足さない**（別の処置 ＝ 別タスク。16-4）
label_scales = [20, 60, 200]   # ⚠ 学習の対象（先 W 本の累積リターン）。⚠ **説明変数ではない**
targets = "all"

horizon_min = 432000.0         # ⚠ パージ = 300 日 × 1440 分（営業日 200 本を暦で覆う）
bar_minutes = 1440.0

# ⚠ **12 本 = 6 構成 × 2 系統**（rules.md 16-4）。⚠ **12 × 3 閾値 = 36 試行**
# ⚠ **前半 3 構成が仮説（入口は短期・出口は長期）、後半 3 構成はその対照（逆向き）**
detectors = [
  "入口D1(20)×出口D2(60)（学習）",
  "入口D1(20)×出口D3(200)（学習）",
  "入口D2(60)×出口D3(200)（学習）",
  "入口D2(60)×出口D1(20)（学習）",
  "入口D3(200)×出口D1(20)（学習）",
  "入口D3(200)×出口D2(60)（学習）",
  "入口C1(20)×出口C2(60)（古典）",
  "入口C1(20)×出口C3(200)（古典）",
  "入口C2(60)×出口C3(200)（古典）",
  "入口C2(60)×出口C1(20)（古典）",
  "入口C3(200)×出口C1(20)（古典）",
  "入口C3(200)×出口C2(60)（古典）",
]
k = 6                          # スケールごとの列数（⚠ 選別はしない。列は事前固定）

model = "Ridge"                # ⚠ **入口と出口で変えない**（16-3 の 6）
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。⚠ **入口と出口で別の θ を振らない**（16-1 の 3）
form = "shared"                # (A) 銘柄共通。⚠ **対称構成と同じ形式にする**（比べられるようにする）

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0
