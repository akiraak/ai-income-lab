# ⚠ **下降トレンドの検知**（[プラン](../../../../docs/plans/archive/downtrend-detection.md)。規約は rules.md 13・14 章）。
#
# ⚠ **動かす軸は 1 つだけ — 予測の対象。** 既存の 24 試行は「明日の符号」を当てにいって
# 較正の傾き a ≈ 0（確率に情報が無い）だった。ここでは**先 W 営業日の符号**を対象にする。
#
# ⚠ **事前固定するのは構造だけ**（rules.md 14-9）: スケールの窓 20 / 60 / 200 ／ 各スケールに同形の
# 6 列 ／ 出力は買い% 1 本 ／ θ は 50・55・60 ／ 形式は (A) だけ ／ 試す構成は 7 本。
# ⚠ **「中期 −10% で売り」のような数値は 1 つも置かない。** 係数は訓練分割の内側で学習する。
#
# ⚠ **期間は 1995 表と同じ考え方**（rules.md 14-4）: `start_date` を書かない ＝ 開始日を手で選ばない。
# ⚠ **表の両端が削れる** — 頭は `own_trend200_*` の助走 200 本、尻は `y_fwd_200` の先読み 200 本。
#
# ⚠ **パージは最長ラベル（200 営業日）を暦で覆う 300 日**（rules.md 14-7。営業日のまま暦に当てると
# ⚠ **3 割足りない** ＝ ラベルが重なったまま残る）。⚠ **fold 長がその 6 倍以上あることは実行時に検算する。**
#
# ⚠ **門（14-5）は測って記録するが、門前でも回す**（プラン §2-6。⚠ **回した 21 試行は全部数える**）。
# 理由: 門の AUC は順位だけの指標で**大きさを見ない**ため、⚠ **下げ日の大きさに乗るレジームの効果を
# ⚠ **落としうる**。14-5 規律 3 の形（`--ignore-gate` で回し、普通に試行として数える）。
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "trend_scales_1995"
dataset = "daily"
horizon = 1                    # ⚠ 損益のラベルは今までどおり 1 日（13-4 のシミュレータを変えない）
cost_bp = 5.0

feature_layers = ["own", "trend"]
label_scales = [20, 60, 200]   # ⚠ 学習の対象（先 W 本の累積リターン）。⚠ **説明変数ではない**
targets = "all"

horizon_min = 432000.0         # ⚠ パージ = 300 日 × 1440 分（営業日 200 本を暦で覆う）
bar_minutes = 1440.0

# ⚠ **検知器 7 本**（rules.md 14-1 の出力の契約 ＝ 買い% 1 本）。⚠ **7 × 3 閾値 = 21 試行**
detectors = [
  "D1 短期ゲート（20日・学習）",
  "D2 中期ゲート（60日・学習）",
  "D3 長期ゲート（200日・学習）",
  "D4 合成ゲート（3スケール平均）",
  "C1 短期 SMA20 フィルタ",
  "C2 中期 SMA60 フィルタ",
  "C3 長期 SMA200 フィルタ",
]
k = 6                          # スケールごとの列数（⚠ 選別はしない。列は事前固定）

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通。⚠ **(B) は全 12 試行で (A) 以下という実測がある**

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0
