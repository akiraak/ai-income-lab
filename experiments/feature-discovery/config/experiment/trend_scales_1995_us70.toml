# ⚠ **`trend_scales_1995_us74.toml` から `dataset` だけを変えた**（2026-09-12）。
# ⚠ **動かす軸は銘柄集合だけ** — 層・スケール・ラベル・検知器・θ・形式・種・パージ・コストは同一。
#
# ⚠ **us74 から「先物を転がす ETF」4 本（USO・UNG・DBC・UUP）を外した集合で回す。**
# ⚠ **規則は回す前に書いた**（config/universe/us70.toml の頭）。⚠ **商品の仕組みで引いた線であり、
#    測った成績では引いていない。** ⚠ **外れる 4 本は 当てた分が 正 2・負 1・ゼロ 1 で、
#    結果に都合よく働いていない。**
#
# ⚠ **これは us74 の実行の「やり直し」ではなく、別の試行である**（rules.md 13-9 の 3・銘柄集合は次元）。
# ⚠ **us74 の 21 試行は残す・消さない。**

name = "trend_scales_1995_us70"
dataset = "daily70"
horizon = 1                    # ⚠ 損益のラベルは今までどおり 1 日（13-4 のシミュレータを変えない）
cost_bp = 5.0

feature_layers = ["own", "trend"]
label_scales = [20, 60, 200]   # ⚠ 学習の対象（先 W 本の累積リターン）。⚠ **説明変数ではない**
targets = "all"

horizon_min = 432000.0         # ⚠ パージ = 300 日 × 1440 分（営業日 200 本を暦で覆う）
bar_minutes = 1440.0

# ⚠ **検知器 7 本**（rules.md 14-1 の出力の契約 ＝ 買い% 1 本）。⚠ **7 × 3 閾値 = 21 試行**
detectors = [
  "D1 短期ゲート（20日・学習）",
  "D2 中期ゲート（60日・学習）",
  "D3 長期ゲート（200日・学習）",
  "D4 合成ゲート（3スケール平均）",
  "C1 短期 SMA20 フィルタ",
  "C2 中期 SMA60 フィルタ",
  "C3 長期 SMA200 フィルタ",
]
k = 6                          # スケールごとの列数（⚠ 選別はしない。列は事前固定）

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通。⚠ **(B) は全 12 試行で (A) 以下という実測がある**

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0
