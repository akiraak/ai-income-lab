# ⚠ **`trend_scales_1995.toml` から `dataset` だけを変えた**（2026-09-12）。
# ⚠ **動かす軸は銘柄集合だけ** — 層・スケール・ラベル・検知器・θ・形式・種・パージ・コストは同一。
#
# ⚠ **利用者の決定 (a)**: 低相関の 11 本（債券・商品・通貨 ETF）を**売買の対象に加える**。
# ⚠ **入力にだけ使うのではない。** 狙いは実効系列数を伸ばすこと（株どうしは ρ=0.346 で頭打ち）。
#
# ⚠ **測るのは「t が伸びたか」ではなく「足した 11 本で効くか」である。**
#    t ×1.170 は「11 本でも同じだけ効く」前提の上限で、⚠ **効かなければ t は ×0.95 と下がる**
#    （docs/specs/experiments/universe-widening.md §8-0）。
#
# ⚠ **B&H が「株の籠」から「株 ＋ 債券 ＋ 商品の籠」に変わる。**
#    ⚠ **`trend_scales_1995`（63 本）とは橋渡し対（rules.md 13-8）として並べて読み、数字を直接比べない。**
#
# ⚠ **fold 1 はほぼ 63 本のまま**（11 本の開始は 2002-07〜2007-04、検証の始まりは 2000-09-08）。

name = "trend_scales_1995_us74"
dataset = "daily74"
horizon = 1                    # ⚠ 損益のラベルは今までどおり 1 日（13-4 のシミュレータを変えない）
cost_bp = 5.0

feature_layers = ["own", "trend"]
label_scales = [20, 60, 200]   # ⚠ 学習の対象（先 W 本の累積リターン）。⚠ **説明変数ではない**
targets = "all"

horizon_min = 432000.0         # ⚠ パージ = 300 日 × 1440 分（営業日 200 本を暦で覆う）
bar_minutes = 1440.0

# ⚠ **検知器 7 本**（rules.md 14-1 の出力の契約 ＝ 買い% 1 本）。⚠ **7 × 3 閾値 = 21 試行**
detectors = [
  "D1 短期ゲート（20日・学習）",
  "D2 中期ゲート（60日・学習）",
  "D3 長期ゲート（200日・学習）",
  "D4 合成ゲート（3スケール平均）",
  "C1 短期 SMA20 フィルタ",
  "C2 中期 SMA60 フィルタ",
  "C3 長期 SMA200 フィルタ",
]
k = 6                          # スケールごとの列数（⚠ 選別はしない。列は事前固定）

model = "Ridge"
baselines = ["常に上（ドリフト）", "直前リターンの符号"]

[trading]
style = "threshold"
thresholds = [50, 55, 60]      # ⚠ 事前固定。結果を見て動かさない（rules.md 13-3）
form = "shared"                # (A) 銘柄共通。⚠ **(B) は全 12 試行で (A) 以下という実測がある**

[validation]
split = "walk_forward_dates"   # ⚠ fold の切れ目は日付で決める（rules.md 13-6 の 1）
folds = 5
purge = true
embargo_bars = 0
seed = 0
