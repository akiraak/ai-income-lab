# ⚠ **災害を銘柄に割り当てる表**（2026-09-09）。⚠ **`im_` 層はこの 1 ファイルだけを読む。**
#
# ⚠ **なぜこの表が要るのか。** [§9-4](../../../../docs/specs/experiments/daily-data-sources.md) の判定:
# ⚠ **`ex_` 層は全銘柄で同じ値になるので、市場全体の方向にしか効きようがない。**
# ⚠ **地域と業種に割り当てて初めて、断面（どの銘柄が上がるか）が動きうる。**
#
# ⚠ **重みは全部【推測】である。** ⚠ **出典のある売上の地域内訳ではない**（2026-09-09 時点の主業種と
# 主要な拠点から振った）。⚠ **割り当てそのものが仮説であり、外れれば効かない**
# （[plan §6](../../../../docs/plans/impact-data.md) の限界 1）。
# ⚠ **だからこそ「割り当てを入れ替えた偽薬」を併置する**（`im_scramble`）。
#
# ⚠ **重みの意味**: 「その銘柄の商売のうち、その災害に反応する割合 × 反応の強さ」【推測】。
# ⚠ **0〜1。** 書いていない銘柄は 0（＝ 曝露なし）。⚠ **0 は欠損ではない**ので、そのまま 0 が入る。
name = "us63"
note = "⚠ 地域の定義は ail/data/regions.py が正本。⚠ 系列名は data/raw/<取得元>/series/ の識別子"
selected_on = "2026-09-09"
# ⚠ **後知恵が入っている**（universe の survivorship_bias と同じ種類の限界）。
# ⚠ **2026-09-09 時点で知っていることから振っている。** 例: ⚠ **公益に山火事責任の重みを置いたのは、
#    検証の期間の中で起きた出来事を知っているからである。** ⚠ **当時知り得た情報ではない。**
# ⚠ **これは偽薬（割り当ての入れ替え）では消えない**（入れ替えても後知恵の重み自体は残る）。
hindsight = true

# ---------------------------------------------------------------- 経路（チャネル）
# ⚠ **1 チャネル = 「どの災害の系列を」「どの重みで」銘柄に割り当てるか。**
# ⚠ **チャネルを増やすと列が増え、多重検定が厳しくなる**（rules.md 11 章 規約 4）。6 本にとどめる。

[[channel]]
name = "geo_dmg"
source = "ncei_storm"
kind = "region"                       # ⚠ 地域ごとの系列を重みで足す
series = "SE_DMG_{region}"
weights = "geo"
hypothesis = "⚠ 自社の商売がある地域の被害額が大きいほど、保険金・操業停止・復旧費が業績に効く"
note = "⚠ NCEI は 101 日遅れて公表される。ずらし幅 120 日（ail/features/impact.py）"

[[channel]]
name = "geo_warn"
source = "iem"
kind = "region"
series = "WW_RGN_{region}"
weights = "geo"
hypothesis = "⚠ 警報は被害より先に出るので、同じ地域の曝露を 1 日遅れで拾える"

[[channel]]
name = "ins"
source = "ncei_storm"
kind = "scalar"                       # ⚠ 全国の系列を 1 個の重みで割る
series = "SE_DAMAGE"
weights = "ins"
hypothesis = "⚠ 全国の被害額は保険の支払いであり、引受を持つ会社の利益を直接削る"

[[channel]]
name = "fire"
source = "iem"
kind = "scalar"
series = "WW_山火事_西部"
weights = "fire"
hypothesis = "⚠ 西部の火災気象警報は、送電線の運用停止と山火事責任を通じて公益と保険に効く"

[[channel]]
name = "tropical"
source = "iem"
kind = "scalar"
series = "WW_熱帯_湾岸"
weights = "energy"
hypothesis = "⚠ 湾岸の熱帯低気圧の警報は、メキシコ湾の生産と製油所の停止を先に知らせる"
note = "⚠ 標本が薄い（ハリケーンは年に数回）。⚠ 効かなくても「効かない」とは言い切れない"

[[channel]]
name = "rebuild"
source = "iem"
kind = "scalar"
series = "WW_CNT"
weights = "rebuild"
hypothesis = "⚠ 全国の警報が多い時期ほど、復旧の資材と機械の需要が増える"

# ---------------------------------------------------------------- 重み【推測】

# ⚠ **地域への曝露。** 行の合計は「災害に反応する商売の割合」の目安【推測】
[weights.geo]
XLE     = { "湾岸" = 0.60, "中西部" = 0.15, "西部" = 0.15, "北東部" = 0.10 }   # メキシコ湾の生産・製油
XOM     = { "湾岸" = 0.60, "中西部" = 0.15, "西部" = 0.10, "北東部" = 0.10 }
CVX     = { "湾岸" = 0.50, "西部" = 0.30, "中西部" = 0.10, "北東部" = 0.10 }   # 湾岸 ＋ カリフォルニア
XLU     = { "西部" = 0.40, "湾岸" = 0.20, "中西部" = 0.20, "北東部" = 0.20 }   # 送電線と山火事責任
XLRE    = { "湾岸" = 0.30, "西部" = 0.30, "北東部" = 0.30, "中西部" = 0.10 }
XLF     = { "北東部" = 0.40, "湾岸" = 0.30, "西部" = 0.20, "中西部" = 0.10 }   # NY の拠点 ＋ 引受
"BRK/B" = { "湾岸" = 0.40, "西部" = 0.30, "中西部" = 0.20, "北東部" = 0.10 }   # 保険と再保険
HD      = { "湾岸" = 0.40, "西部" = 0.20, "中西部" = 0.20, "北東部" = 0.20 }   # ⚠ 復旧の需要で逆に増えうる
DIS     = { "湾岸" = 0.60, "西部" = 0.30, "北東部" = 0.10 }                  # オーランドとアナハイム
T       = { "北東部" = 0.30, "湾岸" = 0.30, "西部" = 0.20, "中西部" = 0.20 }   # 通信網の被害
VZ      = { "北東部" = 0.40, "湾岸" = 0.25, "西部" = 0.20, "中西部" = 0.15 }
WMT     = { "湾岸" = 0.35, "中西部" = 0.25, "西部" = 0.20, "北東部" = 0.20 }
COST    = { "西部" = 0.40, "湾岸" = 0.25, "北東部" = 0.20, "中西部" = 0.15 }
MCD     = { "湾岸" = 0.30, "中西部" = 0.25, "西部" = 0.25, "北東部" = 0.20 }
CAT     = { "中西部" = 0.40, "湾岸" = 0.30, "西部" = 0.20, "北東部" = 0.10 }
XLB     = { "湾岸" = 0.35, "中西部" = 0.30, "西部" = 0.20, "北東部" = 0.15 }
XLI     = { "中西部" = 0.30, "湾岸" = 0.30, "西部" = 0.20, "北東部" = 0.20 }
XLY     = { "湾岸" = 0.30, "西部" = 0.25, "北東部" = 0.25, "中西部" = 0.20 }
XLP     = { "湾岸" = 0.30, "中西部" = 0.25, "西部" = 0.25, "北東部" = 0.20 }
# ⚠ **広い ETF は分散しているぶん薄い**（0 ではないが小さい）【推測】
SPY     = { "湾岸" = 0.05, "西部" = 0.05, "中西部" = 0.05, "北東部" = 0.05 }
DIA     = { "湾岸" = 0.05, "西部" = 0.05, "中西部" = 0.05, "北東部" = 0.05 }
IWM     = { "湾岸" = 0.07, "西部" = 0.06, "中西部" = 0.06, "北東部" = 0.06 }   # ⚠ 小型株は地元の商売が多い

# ⚠ **保険の引受。** 全国の被害額がそのまま支払いになる
[weights.ins]
"BRK/B" = 1.00
XLF     = 0.40
XLRE    = 0.15
SPY     = 0.05

# ⚠ **山火事。** 公益（送電線の停止と責任）と保険
[weights.fire]
XLU     = 1.00
"BRK/B" = 0.30
CVX     = 0.25
XLRE    = 0.20
XLF     = 0.15
COST    = 0.10

# ⚠ **熱帯低気圧。** メキシコ湾の生産・製油と、湾岸の施設
[weights.energy]
XLE = 1.00
XOM = 0.90
CVX = 0.70
DIS = 0.30
XLB = 0.20
XLI = 0.10

# ⚠ **復旧の需要。** ⚠ **災害で「上がる」側**（被害と符号が逆になりうる）
[weights.rebuild]
HD   = 1.00
CAT  = 0.60
XLB  = 0.40
XLI  = 0.30
HON  = 0.25
XLY  = 0.20
WMT  = 0.15
