question = "素の閾値売買が B&H に負けるのは、降りる日の選び方が悪いからか、単に現金で持つ日があるからか。降りている間の置き場を現金から市場（全銘柄の等加重）に替えると、上乗せは「その銘柄が市場より弱い日を選べたか」だけになる。決めることを「持つか現金か」から「この銘柄か市場か」に変える。"
