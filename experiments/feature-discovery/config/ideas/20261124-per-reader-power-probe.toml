notes = "段 1 の出力の key_shape の原文: 数えない（植え込みの診断・ledger_rows に行なし。レジストリの [power] に読み手の登録名ごとに 1 行） ／ 段 2: この案はランナーに新しいステージ（ステージ 3 の前の植え込みの診断）を足すもので、新しい読み手（検知器・学習器）を足すものではない。\n作るのに要る変更は 4 つあり、どれも allowlist の write（config/ideas/・config/experiment/dev_*・config/queue/dev_*・ail/ideas/・tests/test_ideas_*・dev-loop の記録・names.toml・catalog_notes.toml）の外にある。\n1. cli/devloop.py の night(): ステージ 3（cli.queue）の前に診断のステップを呼ぶ。その晩の queue に入っている新しい読み手の登録名を拾う処理と、1 晩 3 時間の時間の上限の配分も、ここに書かないと作れない。\n2. cli/devloop.py の register まわり: レジストリの TOML に [power] の項目（読み手の登録名ごとに保留以上の割合と相関を 1 行）を書き足す。ログ docs/specs/experiments/dev-loop/log/<日付>.md への出力も、ランナーのログを組むコードにある。\n3. 植え込みの本体 cli/inject_power.py: --experiment で実験 config を替えれば読み手は替えられる。ただし、強さを検出限界の 1 ／ 3 ／ 10 倍の 3 段に絞る引数がない。買い% と植え込んだ信号の相関を返す出力もない。この 2 つを足すには cli/ の既存ファイルを直す必要がある（新しいモジュールを cli/ に置くのも allowlist の外）。\n4. config/devloop.toml: 診断を入れる／入れないのフラグ（例 [power] enabled）と、1 晩あたりの時間の上限を足す。\nail/ideas/ の仕組み（ail.bootstrap が読む ＝ registry に登録するだけ）ではランナーのステージを差し込めない。\n失敗の型の 2 つ目（窓固定・配列の読み手に植え込みの列が届かない）を『拾えない』と読み違えないための判定も、ランナーの側に要る。届くかどうかは rules.md 24-1 の表で決まる。\n"
