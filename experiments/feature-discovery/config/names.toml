# 予測モデル名の綴り（rules.md 10-2）。`ail/names.py` が台帳の鍵から名前を作るときに引く。
# ⚠ **既存の名前（実験名・モデル名・選び方や作り方の登録名）は 1 つも変えない。** ここにあるのは別名の綴りだけ
# ⚠ **この一覧に無い選び方・作り方・学習器が台帳に出ると止まる**（名前を付けてから回す）。検知器や学習器を足したら 1 行足す
# 名前の形 ＝ <入力データ>.<数字の選び方・作り方>.<学習器>.<学習範囲>（言葉と台帳の列の対応は rules.md 10-2）
# ⚠ 綴りは英小文字・数字・`-` だけ（`.` `~` `@` は名前の区切りに使う）。⚠ 2 つの名前に同じ綴りを付けない（tests/test_names.py）
# ⚠ カタログの選び方（F1-1 など）は ID を小文字にするだけなので、ここには書かない
# ⚠ 左側（登録名）は記録の鍵なので変えない（「60日窓」＝ 観測期間 60 日。綴りでは `60`。⚠ 台帳の列「期間」＝ データの開始日とは別物）

[method]
# 数字の選び方・作り方（台帳の列「鍵」）
# 基準線（選別の契約で動くもの）
"全部使う（基準）" = "all"
"乱択（基準）" = "random"
"常に上（ドリフト）" = "drift"
"直前リターンの符号" = "lastsign"
# 検知器（rules.md 14-1）。入口 × 出口の対は `in-<入口>-out-<出口>` で機械的に作るので書かない
"C1 短期 SMA20 フィルタ" = "c1-sma20"
"C2 中期 SMA60 フィルタ" = "c2-sma60"
"C3 長期 SMA200 フィルタ" = "c3-sma200"
"D1 短期ゲート（20日・学習）" = "d1-gate20"
"D2 中期ゲート（60日・学習）" = "d2-gate60"
"D3 長期ゲート（200日・学習）" = "d3-gate200"
"D4 合成ゲート（3スケール平均）" = "d4-gatemix"
"S1 PatchTST（60日窓）" = "s1-patchtst60"
"T1 MiniRocket（60日窓）" = "t1-minirocket60"
"T2 Hydra（60日窓）" = "t2-hydra60"
"T3 QUANT（60日窓）" = "t3-quant60"

[topk]
# 上位 K の基準線（rules.md 17-7）。`ボラ上位〔<選び方・作り方>・上位3・端数〕` → `voltop-<選び方・作り方>-top3-frac`
"ボラ上位" = "voltop"
"乱択上位" = "randtop"

[holding]
# 上位 K の買い方（rules.md 17 章）。`〔上位3・端数〕` → `-top3-frac`
"端数" = "frac"
"整数株A" = "sha"
"整数株B⚠" = "shb"

[learner]
# 台帳の「モデル」列の基底（rules.md 10-1）。増強は `+`、水準は括弧で後ろに付く
"Ridge" = "ridge"
"LightGBM" = "lgbm"
"MLP" = "mlp"
"PatchTST" = "patchtst"
"—" = "none"                   # 基準線の行（モデルを使わない）
"常に上（ドリフト）" = "drift"
"直前リターンの符号" = "lastsign"

[augment]
"GAN増強" = "gan"

[form]
# 学習範囲（台帳の列「形式」）: 全部の株をまとめて 1 つ ／ 株ごとに 1 つずつ
"共通" = "a"
"銘柄別" = "b"

[defaults]
# ⚠ **既定の値は名前に書かない**（rules.md 10-1 の「水準」と同じ）。外れたときだけ `~` で後ろに足す
style = "閾値売買"              # 毎日往復 → ~rt
granularity = "日足"            # 1 分足 → ~1m
horizon = "1"                   # 390 本先 → ~h390
layer = "adjusted"              # raw → ~raw
period = "2018-01-31"           # 1995-02-10 → ~p1995-02-10 ／ 記録なし（—）→ ~p-na
symbols = "63"                  # 48 → ~n48 ／ 記録なし（—）→ ~n-na
calibration = "std"             # 閾値売買で「旧」→ ~cal-old（毎日往復の既定は「—」）
