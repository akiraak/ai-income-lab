# 予測モデル名の綴り（rules.md 10-2）。`ail/names.py` が台帳の鍵から名前を作るときに引く。
# ⚠ **既存の名前（実験名・モデル名・選び方や作り方の登録名）は 1 つも変えない。** ここにあるのは別名の綴りだけ
# ⚠ **この一覧に無い選び方・作り方・学習器が台帳に出ると止まる**（名前を付けてから回す）。検知器や学習器を足したら 1 行足す
# 名前の形 ＝ <入力データ>.<数字の選び方・作り方>.<学習器>.<学習範囲>（言葉と台帳の列の対応は rules.md 10-2）
# ⚠ 綴りは英小文字・数字・`-` だけ（`.` `~` `@` は名前の区切りに使う）。⚠ 2 つの名前に同じ綴りを付けない（tests/test_names.py）
# ⚠ カタログの選び方（F1-1 など）は ID を小文字にするだけなので、ここには書かない
# ⚠ 左側（登録名）は記録の鍵なので変えない（「60日窓」＝ 観測期間 60 日。綴りでは `60`。⚠ 台帳の列「期間」＝ データの開始日とは別物）

[method]
# 数字の選び方・作り方（台帳の列「鍵」）
# 基準線（選別の契約で動くもの）
"全部使う（基準）" = "all"
"乱択（基準）" = "random"
"常に上（ドリフト）" = "drift"
"直前リターンの符号" = "lastsign"
"持ち続ける" = "hold"                     # トレーダーの形の基準線（rules.md 20-3 の 1）
# 検知器（rules.md 14-1）。入口 × 出口の対は `in-<入口>-out-<出口>` で機械的に作るので書かない
# 買う線と売る線を別に置いた行（rules.md 18-2）は `<選び方・作り方>〔売り線50〕` → `<綴り>-out50` で機械的に作るので書かない
"C1 短期 SMA20 フィルタ" = "c1-sma20"
"C2 中期 SMA60 フィルタ" = "c2-sma60"
"C3 長期 SMA200 フィルタ" = "c3-sma200"
"D1 短期ゲート（20日・学習）" = "d1-gate20"
"D2 中期ゲート（60日・学習）" = "d2-gate60"
"D3 長期ゲート（200日・学習）" = "d3-gate200"
"D4 合成ゲート（3スケール平均）" = "d4-gatemix"
"H1 先10日ゲート（全列・学習）" = "h1-gate10"      # 先 10 営業日（2026-09-27・forward10-target.md）
# 損切りを出口だけのモデルにする検知器（2026-09-27・stoploss-as-model.md §0-4）。形 B の `〔買値から−N%〕` → `-stopN`・
# 基準線の `〔N日で降りる〕` → `-holdN` は機械的に作るので書かない
"L0 入口のみ（損切りなし）" = "l0-nostop"
"L1 高値20日から−5%で降りる" = "l1-dd20-5"
"L1 高値20日から−10%で降りる" = "l1-dd20-10"
"L1 高値20日から−20%で降りる" = "l1-dd20-20"
"L2 高値20日からσの2倍で降りる" = "l2-ddvol20-2"
"L2 高値20日からσの4倍で降りる" = "l2-ddvol20-4"
"L2 高値20日からσの8倍で降りる" = "l2-ddvol20-8"
"L3 先10日の下げを学んで降りる" = "l3-learn10"
# 出口だけを言うモデル（入口 100・出口 ＝ 規則。2026-09-28・Phase 3。`cli.predict` のためだけ ＝ 検証結果一覧には出ない）
"X1 出口だけ 高値20日から−5%で降りる" = "x1-exit-dd20-5"
"X1 出口だけ 高値20日から−10%で降りる" = "x1-exit-dd20-10"
"X1 出口だけ 高値20日から−20%で降りる" = "x1-exit-dd20-20"
"X2 出口だけ 高値20日からσの2倍で降りる" = "x2-exit-ddvol20-2"
"X2 出口だけ 高値20日からσの4倍で降りる" = "x2-exit-ddvol20-4"
"X2 出口だけ 高値20日からσの8倍で降りる" = "x2-exit-ddvol20-8"
"X3 出口だけ 先10日の下げを学んで降りる" = "x3-exit-learn10"
"S1 PatchTST（60日窓）" = "s1-patchtst60"
# 「目的の系列 ＋ 外生系列」の深層学習（2026-09-27・exog-deep-models.md §0-2）。`fwd10` ＝ 学習の対象が先 10 営業日
"S2 Chronos-2（60日窓・先10日・共変量あり）" = "s2-chronos2-60-fwd10-cov"
"S3 Chronos-2（60日窓・先10日・共変量なし）" = "s3-chronos2-60-fwd10-nocov"
"S4 TimeXer（60日窓・先10日・外生あり）" = "s4-timexer-60-fwd10-exo"
"T1 MiniRocket（60日窓）" = "t1-minirocket60"
"T2 Hydra（60日窓）" = "t2-hydra60"
"T3 QUANT（60日窓）" = "t3-quant60"

[topk]
# 上位 K の基準線（rules.md 17-7）。`ボラ上位〔<選び方・作り方>・上位3・端数〕` → `voltop-<選び方・作り方>-top3-frac`
"ボラ上位" = "voltop"
"乱択上位" = "randtop"

[holding]
# 上位 K の買い方（rules.md 17 章）。`〔上位3・端数〕` → `-top3-frac`
"端数" = "frac"
"整数株A" = "sha"
"整数株B⚠" = "shb"

[trader]
# トレーダーの形の条件（rules.md 20-2・20-4）。`<選び方・作り方>〔トレーダー・5本・$300〕` → `<綴り>-tr5`。
# 基準線 `基準 持ち続ける〔トレーダー・…〕` は `hold-tr5`（`持ち続ける` は [method]）
"5本・$300" = "tr5"
"全銘柄・全部を買える予算" = "trall"

[mix]
# 合わせる口の手法（rules.md 20-6 の 4）。ほかの実験の手法の買い% ／ 出口% を行ごとに平均した手法。
# ⚠ 検証結果一覧の「モデル」「特徴量の層」の列は**持ち主の実行**のもの（メンバーは実行の `fitted` の `members`）
"M1 3本の平均" = "mix3-mean"

[execution]
# 閾値売買の変種「どの値段で執行したか」（rules.md 22-3）。`閾値売買（翌日始値）` → `~exec-open`。
# ⚠ 訓練の窓 `閾値売買（訓練直近2520日）` → `~train2520` は機械的に作るので書かない（rules.md 21-3）
"翌日始値" = "exec-open"

[fitness]
# GA の適合度を替えた行（rules.md 23-2）。`F4-1〔適合度・断面の平均〕` → `f4-1-fit-xsmean`
"断面の平均" = "fit-xsmean"
"断面の安定性" = "fit-xsir"
"4期間の最小" = "fit-worst4"

[learner]
# 台帳の「モデル」列の基底（rules.md 10-1）。増強は `+`、水準は括弧で後ろに付く
"Ridge" = "ridge"
"LightGBM" = "lgbm"
"MLP" = "mlp"
"PatchTST" = "patchtst"
"Chronos-2" = "chronos2"          # 基盤モデルの zero-shot（学習しない。2026-09-27）
"TimeXer" = "timexer"
"—" = "none"                   # 基準線の行（モデルを使わない）
"常に上（ドリフト）" = "drift"
"直前リターンの符号" = "lastsign"

[augment]
"GAN増強" = "gan"

[form]
# 学習範囲（台帳の列「形式」）: 全部の株をまとめて 1 つ ／ 株ごとに 1 つずつ
# 2026-09-21 の利用者の裁定: 実験名の `_a` / `_b` ではなく単語にする（a / b だと意味が読めない）
"共通" = "shared"
"銘柄別" = "each"

[defaults]
# ⚠ **既定の値は名前に書かない**（rules.md 10-1 の「水準」と同じ）。外れたときだけ `~` で後ろに足す
style = "閾値売買"              # 毎日往復 → ~rt
granularity = "日足"            # 1 分足 → ~1m
horizon = "1"                   # 390 本先 → ~h390
layer = "adjusted"              # raw → ~raw
period = "2018-01-31"           # 1995-02-10 → ~p1995-02-10 ／ 記録なし（—）→ ~p-na
symbols = "63"                  # 48 → ~n48 ／ 記録なし（—）→ ~n-na
calibration = "std"             # 閾値売買で「旧」→ ~cal-old（毎日往復の既定は「—」）
