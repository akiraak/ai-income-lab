experiments = ["trade_ownex_ridgegan16k_a", "trade_ownex_lgbmgan16k_a", "trade_ownex_mlpgan16k_a",
               "trade_ownex_ridgegan_a", "trade_ownex_lgbmgan_a", "trade_ownex_mlpgan_a",
               "trade_ownex_ridgegan16k_b", "trade_ownex_lgbmgan16k_b", "trade_ownex_mlpgan16k_b",
               "trade_ownex_ridgegan_b", "trade_ownex_lgbmgan_b", "trade_ownex_mlpgan_b"]

leak = true              # ⚠ 配線の穴に気づく唯一の手。切らない
