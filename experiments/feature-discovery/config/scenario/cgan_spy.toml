# ⚠ **条件付き GAN のシナリオ予測**（[プラン](../../../../docs/plans/archive/cgan-scenario-forecast.md)。記録は `docs/specs/experiments/cgan-scenario.md`）。
#
# ⚠ **`config/experiment/` には置かない。** あちらは `cli.run`（点予測 → 純利 bp）の設定で、
# ⚠ **こちらは分布（1,000 本のシナリオ）→ CRPS**。物差しが違うので入口（`cli.scenario`）も設定の置き場も分ける（記録 §0 決定 1）。
#
# ⚠ **ここの数値は全部 2026-09-18 に結果を見る前に固定した**（rules.md 14-9）。⚠ **動かしたら別の試行として記録 §0-3 に数える。**
#
# ⚠ **TOML の平の key はテーブル見出しより上に書く**（rules.md 10 章 規約 1）
name = "cgan_spy"
symbol = "SPY"
period = "d"             # `data/adjusted/d/`（分割は調整済み・⚠ 配当は未調整 ＝ 価格リターン）
# ⚠ **市場全体のリターンの列。** ⚠ **対象と同じ銘柄なら足さない**（日次対数リターンと同じ列が 2 本になるだけ。記録 §0 決定 3）
market = "SPY"
window = 60              # 入力: 直前 60 営業日（予測起点の足を含む）
horizon = 5              # 出力: 次の 5 営業日の日次対数リターン
n_scenarios = 1000
seeds = [0, 1, 2]        # ⚠ 種は「再現の幅」であって試行ではない

[split]
# ⚠ **時間順・増えていく窓。** テストの塊ごとに学習し直す（再学習の頻度 ＝ 2 年）。
# 学習 ＝ 検証の始まりより前の全部 ／ 検証 ＝ テストの直前 `val_years` 年（checkpoint を選ぶだけ）／ テスト ＝ 塊。
# ⚠ **境目では、答えの確定日（起点 ＋ 5 営業日）が次の期間に食い込む起点を落とす**（`data.split`）
test_starts = ["2016-09-01", "2018-09-01", "2020-09-01", "2022-09-01", "2024-09-01"]
test_end = "2026-09-01"  # ⚠ 起点がこれより前のものだけ（答えが 2026-09-08 の足までに確定する）
val_years = 2

[model]
# ⚠ **小さく始める**（プラン §4）。⚠ **チューニングしない**（rules.md 11 章 規約 4）
encoder = "gru"
hidden = 64
layers = 1
latent_dim = 16
lr = 1e-4
betas = [0.5, 0.9]
n_critic = 5
gp_lambda = 10.0
batch = 256
max_epochs = 200
# ⚠ **checkpoint は検証期間の CRPS で選ぶ**（敵対的損失では選ばない。プラン §4 の 6）
eval_every = 5           # 何 epoch ごとに検証の CRPS を測るか
eval_scenarios = 200     # 途中の検証に使う本数（最後の評価は `n_scenarios`）
patience = 8             # 検証の CRPS が `patience` 回続けて良くならなければ止める
aux_loss = "none"        # ⚠ MSE の補助損失は入れない（分布が縮む。プラン §4）

[eval]
# ⚠ **採用基準の数値**（記録 §3。2026-09-19 にテスト期間の成績を 1 つも見る前に固定）
block_len = 10           # ブロック再標本化の塊（営業日）。5 日予測の重なり（4 日）より長く取る
n_boot = 2000
boot_seed = 0
min_blocks_better = 4    # テストの 5 塊のうち、履歴ベースより CRPS が低い塊がこの数以上
coverage_80 = [0.72, 0.88]   # 80% 区間の被覆率がこの帯の中（5 塊を合わせて）
coverage_95 = [0.90, 0.99]
