# ⚠ **相関の低さを狙って選んだ候補**（2026-09-09）。
#
# ⚠ **なぜ銘柄数ではなく相関を狙うのか**: 会社株どうしの相関は 0.346 で、
# ⚠ **同じ大型株を何本足しても実効系列数は 8.35 本で頭打ちになる**（48 本で既に 6.47 = 上限の 77%）。
# ⚠ **伸ばせるのは「相関の低いものを入れたとき」だけである。**
#
# ⚠ **選んだのは資産クラスであって、成績ではない。** ⚠ **リターンとの関係を見て選んでいないので、
#    ラベルの情報は混ざっていない**（相関は市場に対する無条件の性質）。
name = "lowcorr"
description = "米国大型株と相関が低そうな ETF の候補（債券・商品・国際・ボラ・不動産・通貨）"
survivorship_bias = true          # ⚠ 2026-09-09 時点で存在する ETF から選んでいる
selected_on = "2026-09-09"

# ⚠ **23 本を取って市場との相関を実測した**（2026-09-09。[記録](../../../../docs/specs/experiments/daily-data-sources.md) §7）。
# ⚠ **当たっていたのは 23 本中 12 本だけ。** 国際株・小型株・REIT は**実質的に株そのもの**だった。
#
# ⚠ **`kept` と `equity_like` の線引きは資産クラスで引いている**（測った相関で引いていない）。
# ⚠ **測った値で選ぶと、全期間の情報を使って銘柄を選ぶことになる**（無条件の性質なのでラベルは漏れないが、
#    分割の外で選んだことに変わりはない）。⚠ **資産クラスは事前に決められる。**
[groups]
# ⚠ 株ではないもの（債券・商品・通貨）＝ 予測に使う候補
etf = [
  "TLT", "IEF", "SHY", "LQD", "TIP",      # 債券（|相関| 0.04〜0.33）
  "GLD", "SLV", "USO", "DBC", "UNG",      # 商品（0.08〜0.30）
  "UUP",                                  # ドル指数（0.13）
]
# ⚠ **取ったが、実質は株なので予測の材料としては別枠**（raw には残す。消さない）
equity_like = [
  "HYG",                                  # ⚠ 債券 ETF だが相関 0.776。**ハイイールドは株のように動く**
  "EFA", "EEM", "FXI", "EWJ", "EWZ", "INDA",   # 国際株（0.49〜0.84）
  "VNQ", "IJR", "XBI",                    # REIT・小型株・バイオ（0.64〜0.84）
  "VXX",                                  # ⚠ 相関 −0.605。**逆に強く効くので独立ではない**
  "GDX",                                  # ⚠ 金鉱株。相関 0.245 と低いが、株ではある
]
company = []

[market_proxy]
market = "SPY"
sectors = {}
