# 「採る」になった選抜の規則の追試 B ＝ S&P 500 の残り・ティッカー順の次の 50 本（rules.md 30 章・2026-10-23 利用者「推す案で進めて」）。
#
# ⚠ **規則は取得の前に固定した**（docs/plans/archive/symbol-selection-widen.md §4-3・rules.md 30-3）:
#   S&P 500 の構成銘柄（Wikipedia「List of S&P 500 companies」2026-10-23 12:39 PDT 取得・503 本 ＝ docs/specs/experiments/assets/sp500-constituents-2026-10-23.csv）
#   のうち `us63`（63 本）と `midcap50`（midcap48 の 48 ＋ 落ちた ABNB・AMCR）に無い 405 本を ⚠ **ティッカーのアルファベット順**に並べ、
#   先頭 50 本 ＝ B（BE〜CRH）・次の 50 本 ＝ C（CRL〜ETN）。取得したあと ⚠ **2018-06-27 以前から日足の無いものを機械的に落とす**
#   （足りないぶんを次のティッカーで埋めない ＝ midcap48 と同じ「落ちたら落ちたまま」。成績では落とさない）。
# ⚠ 取得の前の候補 50 本をまず書き、取得のあとに落ちた銘柄をコメントに残して `company` から外す（記録 §1）。
# ⚠ **`etf` に材料（us63）を入れているのは midcap48 と同じ理由**（`config.symbols_of` が `etf` と `company` しか読まない・
#    `ll_leaders = "etf"` が先行銘柄としてこの群を読む）。⚠ 中身が ETF だからではない。
# ⚠ **`targets = "company"` で、当てる相手は下の会社だけ**（材料は説明変数に使うが当てない）。
# ⚠ **生存バイアスは midcap48 と同じ**（いまの S&P 500 の構成銘柄を過去に当てる。rules.md 12-1）。
# ⚠ **`sector_of` は書いていない**ので `rel_` 層は使えない（midcap48 と同じ）。
name = "midcap_b"
description = "追試 B: S&P 500 の残り（us63・midcap50 に無い）ティッカー順の先頭 50 本 ＋ 材料 63 本（us63）"
survivorship_bias = true
