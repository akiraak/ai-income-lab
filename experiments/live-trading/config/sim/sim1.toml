# シミュレーション sim1（live-trading.md §0-7 (c)〜(e)）。仮データ ＝ 取得済みの実データの日足の再生。
# ⚠ 日付は仮・値段は過去の実物 ＝ 損益に意味は無い（判定に混ぜない）。⚠ 記録は sim/sim1/ の下だけ（全行 sim: true ／ mock: true ／ test: true）
name = "sim1"
traders = ["sim_a", "sim_b", "sim_c"]
start = "2026-10-01"            # 仮の期間（NYSE の営業日 64 日。休場 11-26・12-25 ／ 半日立会 11-27・12-24 を踏む）
end = "2026-12-31"
source_start = "2026-06-01"     # 値段の出どころ: この日から営業日の順に 1 本ずつ、仮の営業日へ当てる
windows = ["15:45:30"]          # 執行器を起こす時刻（ET）の一覧。いまは 1 日 1 回（窓 15:45〜16:05）
speed = 60                      # 速さの初期値（×1 ／ ×10 ／ ×60 ／ ×300 ／ ×1440 ／ max）
skip_outside_window = true      # 窓の外は次の窓まで飛ぶ（何も起きないので）
spread_bp = 2.0
fill_noise = 0.003
seed = 0
