# ⚠ **候補（本番の人ではない）**。先の期間が違う「買い係 ／ 売り係 ／ 損切り係」を持つ人（プラン trader-model-roles.md §1・§2・§5 Phase 4。
# 2026-10-18 利用者決定「期間を別々にすることが大切」「推す案でいく」「トレーダー名は適切に付けて」・K9 (a) ＝ 往復あり）。
# 識別名 `T10`（呼び名 レン ＝ dashboard/traders.toml）。ねらい: ⚠ 対照: 短い先で買い・長い先が弱いときだけ降りる（「向きが大切か」を見る）。
# ⚠ **配線の確認が目的**。机上（horizon-roles-trader.md の `R4 買い先5日・売り先20日・損切り（対照）` ＝ 採る 0）で採る理由は出ていない ＝ 成績で採らない・成績で人を選ばない。
# 係（役割 ＝ `[[models]] role`。意味は live-trading.md §0-1「役割と最短保有」・システム説明「トレーダーのしくみ」）:
#   買い係 `buy`   ＝ 先 5 営業日ゲート（own 35 列 × Ridge。先 5 営業日の累積リターンが正の確率 → 買い%）。持ち株 0 の日に 買い% > θ で買う
#   売り係 `exit`  ＝ 先 20 営業日ゲート（同じ 35 列・先 20 営業日）。出口% ＝ 100 − 買い%。⚠ 建ててから `min_hold_days` ＝ 5 営業日は読まない（最短保有 ＝ 買い係が見た期間）
#   損切り係 `stop` ＝ X1 高値 20 日から −10%（T5 と同じ 1 本。買い% は常に 100 ＝ 買いに効かない）。⚠ 最短保有の中でも毎日読む・言えば降りる
# ⚠ 買い係と売り係は**同じ実験名 `trade_own_fwdmulti_a` の別の手法**（signals.py は (実験名, 手法, 銘柄) で行を引く ＝ 2026-10-18 Phase 3。
#    run-live.sh ／ simpredict.py は (実験名, 手法) ごとに `cli.predict --method` を 1 本ずつ流す ＝ この人で予測 3 本）。
#    損切り係は別の実験 `trade_own_stopexit_a`（`cli.predict` のためだけの config ＝ T5 と同じ）。
# ⚠ 側ごとの合わせ方は書かない（`combine = "asis"` ＝ 買いの側 1 本・売りの側 1 本）。損切り係は合わせ方に関わらず「言えば降りる」（別の口）。
# ⚠ `stop_blocks_buy` は書かない（既定 false ＝ K9 (a)。損切り係が言った翌日に買い係が買い戻す往復はそのまま）。
# ⚠ `config/traders/` の直下に無いので `run_day.py --traders T10` では読めない ＝ 本番に入れるのは利用者の決定（11/4 の判定の後・プラン §6）。
# ⚠ 銘柄集合・`sizing`・θ・予算は 3 人と同じ（違いを期間だけにする）。⚠ ここから先にモデル・θ・期間・最短保有・銘柄・sizing を替えるのは新しい人。

name = "T10"
test = false
budget_usd = 300.0                  # 規模 A の 1 人分と同じ（⚠ 本番に入れるなら合計の上限を利用者が決める）
symbols = ["T", "PFE", "NKE", "VZ", "BAC"]
sizing = "shares"
combine = "asis"                    # 買いの側 1 本・売りの側 1 本（損切り係は別の口 ＝ 言えば降りる）
threshold = 50.0
min_hold_days = 5                 # 建ててから 5 営業日は売り係を読まない（買い係が見た先の期間 ＝ プラン §1）
note = "先の期間が違う 3 係: 買い係 先 5 日 ／ 売り係 先 20 日 ／ 損切り係 高値 20 日から −10%。最短保有 5 営業日。種 0"

# 買い係（先 5 営業日）
[[models]]
kind = "experiment"
name = "trade_own_fwdmulti_a"
method = "H2 先5日ゲート（全列・学習）"
role = "buy"

# 売り係（先 20 営業日。最短保有の後だけ読む）
[[models]]
kind = "experiment"
name = "trade_own_fwdmulti_a"
method = "H3 先20日ゲート（全列・学習）"
role = "exit"

# 損切り係（毎日読む。T5 と同じ 1 本 ＝ 買い% は常に 100）
[[models]]
kind = "experiment"
name = "trade_own_stopexit_a"
method = "X1 出口だけ 高値20日から−10%で降りる"
role = "stop"
