# シミュレーションの試験用トレーダー sim_T1（live-trading.md §0-7 (k)）＝ 本番の候補 `candidates/notional/T1.toml` の写し。
# ⚠ `kind = "experiment"` ＝ 運転手が置く `sim/<名前>/out/<仮の日付>/predict.jsonl`（`simpredict.py` の作り置き）を読む。
# ⚠ 日付は仮・値段は過去の実物 ＝ 損益に意味は無い（判定に混ぜない）。モデル・θ・合成規則は候補と同じ（替えない）。

name = "sim_T1"
test = true                         # シミュレーションの記録は判定に混ぜない
budget_usd = 300.0                  # 規模 A（$300 × 3 ＋ 予備 $100）。規模 B は別の設定にして上限を明示する（⚠ 実際の取引では使えない可能性がある）
universe = "us63"
                                    # 1 銘柄の枠 $300 ÷ 63 ＝ $4.76
sizing = "notional"                 # 金額指定（Notional Market）。§0-3 で $4.76 ／ $6.25 が通ったときだけ
combine = "asis"
threshold = 50.0
note = "線形（Ridge・own 35 列）。種 0"

[[models]]
kind = "experiment"
name = "trade_own_ridge_a"
method = "全部使う（基準）"
